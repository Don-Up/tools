<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e1e1e;
    color: #e0e0e0;
    min-height: 100vh;
}

#app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 24px 120px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100vh;
}

#topBar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
}

#topBar h1 {
    font-size: 16px;
    font-weight: 600;
    color: #4fc3f7;
    margin: 0;
}

.btn {
    padding: 5px 12px;
    font-size: 13px;
    color: #fff;
    background: #3a86ff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
}

.btn:hover { background: #2a6edc; }
.btn:disabled { background: #3a3a3a; color: #777; cursor: default; }
.btn.secondary { background: #3a3a3a; color: #cfd8dc; }
.btn.secondary:hover { background: #4a4a4a; }

#settingsRow {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 16px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 13px;
    color: #b0bec5;
}

#settingsRow label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

#settingsRow input[type="checkbox"] {
    accent-color: #4fc3f7;
    cursor: pointer;
}

#errorBanner {
    display: none;
    padding: 10px 16px;
    background: #7f1d1d;
    color: #fecaca;
    border-radius: 6px;
    font-size: 14px;
}

#errorBanner.visible { display: block; }

#thinkingSection {
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0;
}

#thinkingSection summary {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    color: #b0bec5;
    user-select: none;
}

#thinkingContent {
    padding: 0 16px 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #888;
    white-space: pre-wrap;
    word-break: break-word;
}

#answerSection {
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px 24px;
    min-height: 200px;
    line-height: 1.7;
    color: #e0e0e0;
}

#answerSection.empty {
    color: #666;
    font-style: italic;
    text-align: center;
    padding-top: 80px;
}

#answerSection h1, #answerSection h2, #answerSection h3 {
    color: #4fc3f7;
    margin: 18px 0 10px;
    font-weight: 600;
}

#answerSection h1 { font-size: 22px; }
#answerSection h2 { font-size: 18px; }
#answerSection h3 { font-size: 16px; }

#answerSection p { margin: 8px 0; }
#answerSection ul, #answerSection ol { margin: 8px 0 8px 24px; }
#answerSection li { margin: 4px 0; }

#answerSection a { color: #4fc3f7; text-decoration: none; }
#answerSection a:hover { text-decoration: underline; }

#answerSection blockquote {
    border-left: 3px solid #444;
    padding-left: 12px;
    color: #b0bec5;
    margin: 10px 0;
}

#answerSection table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
}

#answerSection th, #answerSection td {
    border: 1px solid #444;
    padding: 6px 10px;
    text-align: left;
}

#answerSection th { background: #2d2d2d; }

#answerSection pre {
    position: relative;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px 14px;
    margin: 10px 0;
    overflow-x: auto;
}

#answerSection code {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
}

#answerSection :not(pre) > code {
    background: #2d2d2d;
    padding: 1px 5px;
    border-radius: 3px;
    color: #ffb74d;
}

#answerSection .code-copy {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #cfd8dc;
    background: #3a3a3a;
    border: 1px solid #555;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
}

#answerSection .code-copy:hover { background: #4fc3f7; color: #1e1e1e; }
#answerSection .code-copy.copied { background: #81c784; color: #1e1e1e; }

#answerSection .stream-cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: #4fc3f7;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

#inputBar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    position: sticky;
    bottom: 16px;
    margin-top: 16px;
    z-index: 5;
}

#questionInput {
    width: 100%;
    min-height: 60px;
    max-height: 200px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    color: #e0e0e0;
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 4px;
    resize: none;
    overflow-y: auto;
}

#questionInput:focus { outline: none; border-color: #4fc3f7; }
#questionInput.flash-error { border-color: #ef5350; transition: border-color 0.2s; }

#inputActions {
    display: flex;
    align-items: center;
    gap: 8px;
}

#inputActions .hint {
    margin-left: auto;
    font-size: 12px;
    color: #888;
}

#inputActions kbd {
    display: inline-block;
    padding: 1px 6px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 11px;
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 3px;
    color: #b0bec5;
}

#app {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    max-width: 1200px;
    padding: 0;
}

#sidebar {
    background: #1a1a1a;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow: hidden;
}
.main-area {
    padding: 20px 24px 40px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
}
.sidebar-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
}
.sidebar-search {
    width: 100%;
    padding: 6px 10px;
    font-size: 13px;
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 4px;
    font-family: inherit;
    box-sizing: border-box;
}
.sidebar-search:focus { outline: none; border-color: #4fc3f7; }
.conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
}
.conv-item {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: relative;
}
.conv-item:hover { background: #232323; }
.conv-item.active { background: #2a3a4a; }
.conv-item-title {
    font-size: 13px;
    color: #e0e0e0;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.conv-item-preview {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.conv-item-time {
    font-size: 10px;
    color: #666;
}
.conv-item-menu {
    position: absolute;
    right: 8px;
    top: 8px;
    background: #333;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
    display: none;
}
.conv-item:hover .conv-item-menu { display: block; }
.conv-list-empty {
    padding: 20px 12px;
    text-align: center;
    color: #666;
    font-size: 12px;
}
.icon-only { padding: 4px 10px; }
.model-badge {
    color: #888;
    font-size: 12px;
    padding: 4px 8px;
    background: #2a2a2a;
    border-radius: 4px;
    margin-left: auto;
}
.conv-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #2a2a2a;
    margin-bottom: 12px;
}
.conv-header.hidden { display: none; }
.conv-title {
    font-size: 15px;
    color: #cfd8dc;
    font-weight: 500;
    margin: 0;
    cursor: pointer;
}
.conv-title:hover { color: #4fc3f7; }

.messages {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 200px;
}
.messages.empty {
    color: #666;
    text-align: center;
    padding: 60px 0;
    font-size: 14px;
}
.message {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}
.message.user { flex-direction: row-reverse; }
.message-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #333;
    color: #cfd8dc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
}
.message.user .message-avatar { background: #2a4a6a; }
.message.assistant .message-avatar { background: #2a4a3a; }
.message-body {
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    max-width: calc(100% - 50px);
    flex: 1;
    min-width: 0;
}
.message.user .message-body {
    background: #1e2a3a;
    border-color: #2a3a4a;
}
.message-thought {
    margin-bottom: 10px;
    padding: 8px 10px;
    background: #1e1e1e;
    border-left: 2px solid #4fc3f7;
    border-radius: 4px;
    font-size: 12px;
    color: #9aa5b1;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'Consolas', 'Monaco', monospace;
}
.message-thought summary {
    cursor: pointer;
    color: #888;
    font-size: 11px;
    list-style: none;
    margin-bottom: 6px;
}
.message-thought summary::-webkit-details-marker { display: none; }
.message-thought summary::before { content: '▸ '; }
.message-thought[open] summary::before { content: '▾ '; }
.message-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
}
.message-actions button {
    background: transparent;
    border: 1px solid #444;
    color: #888;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
}
.message-actions button:hover { color: #4fc3f7; border-color: #4fc3f7; }
.message.streaming .message-body::after {
    content: '▌';
    color: #4fc3f7;
    animation: blink 1s steps(2) infinite;
    margin-left: 2px;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
}
.modal[hidden] { display: none; }
.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
}
.modal-panel {
    position: relative;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px 24px;
    min-width: 400px;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.modal-title {
    font-size: 16px;
    color: #cfd8dc;
    margin: 0;
    font-weight: 600;
}
.modal-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.modal-field label {
    font-size: 12px;
    color: #888;
}
.modal-textarea {
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 80px;
}
.modal-textarea:focus { outline: none; border-color: #4fc3f7; }
.modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}
.btn.danger {
    background: #7f1d1d;
    color: #fff;
}
.btn.danger:hover { background: #991b1b; }

.message-content { font-size: 14px; line-height: 1.7; color: #e0e0e0; }
.message-content h1, .message-content h2, .message-content h3 {
    color: #cfd8dc;
    font-weight: 600;
    margin: 18px 0 10px;
    line-height: 1.3;
}
.message-content h1 { font-size: 20px; }
.message-content h2 { font-size: 17px; }
.message-content h3 { font-size: 15px; }
.message-content p { margin: 8px 0; }
.message-content ul, .message-content ol { padding-left: 24px; margin: 8px 0; }
.message-content li { margin: 4px 0; }
.message-content blockquote {
    border-left: 3px solid #4fc3f7;
    background: #252525;
    margin: 10px 0;
    padding: 8px 12px;
    color: #b0bec5;
}
.message-content table {
    border-collapse: collapse;
    margin: 12px 0;
    width: auto;
    font-size: 13px;
}
.message-content th {
    background: #252525;
    color: #cfd8dc;
    text-align: left;
    padding: 6px 12px;
    border: 1px solid #333;
}
.message-content td {
    padding: 6px 12px;
    border: 1px solid #333;
}
.message-content pre {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px;
    margin: 10px 0;
    overflow-x: auto;
    position: relative;
}
.message-content :not(pre) > code {
    background: #2d2d2d;
    color: #ffb74d;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9em;
}
.message-content pre code {
    background: transparent;
    color: inherit;
    padding: 0;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
}
    </style>
</head>
<body>
    <main id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <button id="newConvBtn" class="btn" type="button">+ 新对话</button>
                <input id="convSearchInput" class="sidebar-search" type="text" placeholder="搜索会话..." />
            </div>
            <div id="convList" class="conv-list"></div>
        </aside>
        <div class="main-area">
            <header id="topBar">
                <h1>ai</h1>
                <span class="model-badge">M3</span>
                <button id="settingsBtn" class="btn secondary icon-only" type="button" title="设置">⚙</button>
            </header>
            <div id="settingsRow">
                <label>
                    <input id="showThinkingToggle" type="checkbox">
                    显示思考
                </label>
            </div>
            <div id="errorBanner"></div>
            <div id="convHeader" class="conv-header hidden">
                <h2 id="convTitle" class="conv-title"></h2>
                <button id="convPromptBtn" class="btn secondary" type="button">本对话提示词</button>
            </div>
            <section id="messages" class="messages empty"></section>
            <div id="inputBar">
                <textarea id="questionInput" placeholder="输入你的问题... (Ctrl+Enter 发送, Esc 清空)" maxlength="10000"></textarea>
                <div id="inputActions">
                    <button id="sendBtn" class="btn" type="button" disabled>发送</button>
                    <button id="clearBtn" class="btn secondary" type="button">清空</button>
                    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送 · <kbd>Esc</kbd> 清空</span>
                </div>
            </div>
        </div>
    </main>
    <div id="convPromptModal" class="modal" hidden>
        <div id="convPromptModalBackdrop" class="modal-backdrop"></div>
        <div class="modal-panel">
            <h2 class="modal-title">本对话提示词</h2>
            <div class="modal-field">
                <textarea id="convPromptInput" class="modal-textarea" rows="6" placeholder="留空则使用默认系统提示词"></textarea>
            </div>
            <div class="modal-actions">
                <button id="convPromptOkBtn" class="btn" type="button">保存</button>
                <button id="convPromptClearBtn" class="btn secondary" type="button">恢复默认</button>
                <button id="convPromptCancelBtn" class="btn secondary" type="button">取消</button>
            </div>
        </div>
    </div>
    <div id="settingsModal" class="modal" hidden>
        <div id="settingsModalBackdrop" class="modal-backdrop"></div>
        <div class="modal-panel">
            <h2 class="modal-title">设置</h2>
            <div class="modal-field">
                <label for="defaultPromptInput">默认系统提示词</label>
                <textarea id="defaultPromptInput" class="modal-textarea" rows="6"></textarea>
                <button id="resetPromptBtn" class="btn secondary" type="button">恢复默认</button>
            </div>
            <div class="modal-field">
                <button id="clearAllConvsBtn" class="btn danger" type="button">清空所有会话</button>
            </div>
            <div class="modal-actions">
                <button id="settingsOkBtn" class="btn" type="button">保存</button>
                <button id="settingsCancelBtn" class="btn secondary" type="button">取消</button>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.1.2/lib/index.umd.min.js"></script>
    <script>
        'use strict';

        const BASE_URL = 'https://next-reader-psi.vercel.app/api/minimax';
        const MODEL = 'MiniMax-M3';
        const MAX_TOKENS = 8192;
        const DEFAULT_SYSTEM_PROMPT = '你是一个简洁、准确的助手。优先用中文回答,除非用户用其他语言提问。';

        const IDB_NAME = 'aiChatDb';
        const IDB_VERSION = 1;
        const STORE_CONV = 'conversations';
        const STORE_SETTINGS = 'settings';

        const state = {
            showThinking: (() => {
                const v = localStorage.getItem('aiShowThinking');
                return v === null ? true : v === 'true';
            })(),
            defaultSystemPrompt: localStorage.getItem('aiDefaultSystemPrompt') || DEFAULT_SYSTEM_PROMPT,
            question: '',
            isStreaming: false,
            abortController: null,
            db: null,
            idbAvailable: true,
            conversations: [],
            currentConvId: null,
            currentMessages: [],
            searchQuery: '',
        };

        function openDb() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('IndexedDB not supported'));
                    return;
                }
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STORE_CONV)) {
                        const s = db.createObjectStore(STORE_CONV, { keyPath: 'id' });
                        s.createIndex('byUpdated', 'updatedAt', { unique: false });
                    }
                    if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
                        db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function settingsPutMany(pairs) {
            if (!state.db) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const tx = state.db.transaction(STORE_SETTINGS, 'readwrite');
                const s = tx.objectStore(STORE_SETTINGS);
                pairs.forEach(p => s.put(p));
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        function migrateFromLocalStorage() {
            const lsThinking = localStorage.getItem('aiShowThinking');
            const lsPrompt = localStorage.getItem('aiDefaultSystemPrompt');
            const writes = [];
            if (lsThinking !== null) writes.push({ key: 'showThinking', value: lsThinking });
            if (lsPrompt) writes.push({ key: 'defaultSystemPrompt', value: lsPrompt });
            if (writes.length === 0) {
                localStorage.setItem('ai.html:migrated', 'v1');
                return Promise.resolve();
            }
            return settingsPutMany(writes).then(() => {
                localStorage.removeItem('aiApiKey');
                localStorage.removeItem('aiShowThinking');
                localStorage.removeItem('aiDefaultSystemPrompt');
                localStorage.setItem('ai.html:migrated', 'v1');
            });
        }

        function txStore(storeName, mode) {
            return state.db.transaction(storeName, mode).objectStore(storeName);
        }

        function reqToPromise(req) {
            return new Promise((resolve, reject) => {
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function settingsGet(key) {
            if (!state.db) return Promise.resolve(null);
            return reqToPromise(txStore(STORE_SETTINGS, 'readonly').get(key))
                .then(r => (r ? r.value : null));
        }
        function settingsPut(key, value) {
            if (!state.db) return Promise.resolve();
            return reqToPromise(txStore(STORE_SETTINGS, 'readwrite').put({ key, value }));
        }
        function convGetAll() {
            if (!state.db) return Promise.resolve([]);
            return reqToPromise(txStore(STORE_CONV, 'readonly').getAll());
        }
        function convGet(id) {
            if (!state.db) return Promise.resolve(null);
            return reqToPromise(txStore(STORE_CONV, 'readonly').get(id));
        }
        function convPut(conv) {
            if (!state.db) return Promise.resolve();

        function uuidv4() {
            if (crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        function relativeTime(ts) {
            const diff = Date.now() - ts;
            if (diff < 60_000) return '刚刚';
            if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} 分钟前`;
            if (diff < 86_400_000) return `${Math.floor(diff / 3_600_000)} 小时前`;
            if (diff < 7 * 86_400_000) return `${Math.floor(diff / 86_400_000)} 天前`;
            const d = new Date(ts);
            return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        async function copyMessageToClipboard(msg, btn) {
            try {
                await navigator.clipboard.writeText(msg.content || '');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = msg.content || '';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) { /* ignore */ }
                document.body.removeChild(ta);
            }
            const old = btn.textContent;
            btn.textContent = '✓';
            setTimeout(() => { btn.textContent = old; }, 1200);
        }

        async function regenerateLast() {
            if (state.isStreaming) return;
            const conv = state.conversations.find(c => c.id === state.currentConvId);
            if (!conv || conv.messages.length < 2) return;
            const last = conv.messages[conv.messages.length - 1];
            if (last.role !== 'assistant') return;
            conv.messages.pop();
            await updateConvMessages(conv.id, conv.messages);
            const lastUser = conv.messages[conv.messages.length - 1];
            dom.questionInput.value = lastUser.content;
            await send();

        async function persistStreamingMsg() {
            if (!streamingMsg) return;

            if (conv) await updateConvMessages(conv.id, conv.messages);

        async function callApi(conv, question) {
            const body = buildRequestBody(conv, question);
            const res = await fetch(BASE_URL, {
                method: 'POST',
                headers: {
                    'content-type': 'application/json',
                    'anthropic-version': '2023-06-01',
                },
                body: JSON.stringify(body),
                signal: state.abortController.signal,
            });

            if (!res.ok) {
                const err = new Error(`HTTP ${res.status}`);
                err.status = res.status;
                throw err;
            }

            const contentType = res.headers.get('content-type') || '';
            if (!contentType.includes('text/event-stream')) {
                const json = await res.json();
                return handleNonStreaming(json);
            }

            await parseSseStream(res.body);
        }

        async function handleNonStreaming(json) {
            if (Array.isArray(json && json.content)) {
                for (const block of json.content) {
                    if (block.type === 'text' && streamingMsg) streamingMsg.content += (block.text || '');
                    else if (block.type === 'thinking' && streamingMsg) streamingMsg.thinking += (block.thinking || '');
                }
            }
            if (streamingMsg) streamingMsg.stopReason = json.stop_reason || 'end_turn';
        }

        async function parseSseStream(body) {
            const reader = body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                let sep;
                while ((sep = buffer.indexOf('\n\n')) !== -1) {
                    const raw = buffer.slice(0, sep);
                    buffer = buffer.slice(sep + 2);
                    processSseEvent(raw);
                }
            }
            if (buffer.trim()) processSseEvent(buffer);
        }

        function processSseEvent(raw) {
            const lines = raw.split('\n');
            let eventName = '';
            const dataLines = [];
            for (const line of lines) {
                if (line.startsWith('event:')) eventName = line.slice(6).trim();
                else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
            }
            const data = dataLines.join('\n');
            if (!data || data === '[DONE]') return;
            let payload;
            try {
                payload = JSON.parse(data);
            } catch (err) {
                console.warn('SSE JSON parse failed', err, data);
                return;
            }
            handleSsePayload(eventName, payload);
        }

        function handleSsePayload(eventName, payload) {
            if (!streamingMsg) return;
            switch (eventName) {
                case 'message_start':
                    if (payload.message && payload.message.stop_reason) {
                        streamingMsg.stopReason = payload.message.stop_reason;
                    }
                    break;
                case 'content_block_start':
                    break;
                case 'content_block_delta': {
                    const delta = payload.delta || {};
                    if (delta.type === 'text_delta' || typeof delta.text === 'string') {
                        streamingMsg.content += (delta.text || '');
                        updateStreamDom();
                    } else if (delta.type === 'thinking_delta' || typeof delta.thinking === 'string') {
                        streamingMsg.thinking += (delta.thinking || '');
                        updateStreamDom();
                    }
                    break;
                }
                case 'content_block_stop':
                    persistStreamingMsg();
                    break;
                case 'message_delta':
                    if (payload.delta && payload.delta.stop_reason) {
                        streamingMsg.stopReason = payload.delta.stop_reason;
                    }
                    break;
                case 'message_stop':
                    break;
                default:
                    break;
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function appendCodeCopyButtons(root) {
            const pres = root.querySelectorAll('pre');
            pres.forEach((pre) => {
                if (pre.dataset.copyAttached === '1') return;
                pre.dataset.copyAttached = '1';
                const btn = document.createElement('button');
                btn.className = 'code-copy';
                btn.type = 'button';
                btn.textContent = '复制';
                btn.addEventListener('click', async () => {
                    const code = pre.querySelector('code');
                    const text = code ? code.textContent : pre.textContent;
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch (err) {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (e) { /* ignore */ }
                        document.body.removeChild(ta);
                    }
                    btn.textContent = '✓ 已复制';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '复制';
                        btn.classList.remove('copied');
                    }, 1500);
                });
                pre.appendChild(btn);
            });
        }

async function send() {
    if (state.isStreaming) {
        if (state.abortController) state.abortController.abort();
        return;
    }
    const question = dom.questionInput.value.trim();
    if (!question) return;
    const conv = state.conversations.find(c => c.id === state.currentConvId);
    if (!conv) {
        showError('没有当前对话。');
        return;
    }
    showError(null);
    dom.questionInput.value = '';
    dom.questionInput.style.height = 'auto';
    updateSendEnabled();

    const userMsg = { role: 'user', content: question, ts: Date.now() };
    conv.messages.push(userMsg);
    if (conv.title === '新对话') {
        conv.title = question.slice(0, 20);
        dom.convTitle.textContent = conv.title;
    }
    await updateConvMessages(conv.id, conv.messages);
    renderSidebar();
    const userEl = renderMessage(userMsg, { id: conv.messages.length - 1 });
    dom.messages.classList.remove('empty');
    dom.messages.appendChild(userEl);

    const asstMsg = { role: 'assistant', content: '', thinking: '', ts: Date.now() };
    appendStreamBubble(asstMsg);
    await updateConvMessages(conv.id, conv.messages);

    state.abortController = new AbortController();
    setSendButtonState(true);

    try {
        await callApi(conv, question);
        if (!streamingMsg.content && streamingMsg.thinking) {
            streamingMsg.content = '（模型仅返回了思考过程,无最终答复。）';
            updateStreamDom();
        }
        streamingBubble.wrap.remove();
        const final = renderMessage(streamingMsg, { id: conv.messages.length - 1 });
        dom.messages.appendChild(final);
        if (streamingMsg.stopReason === 'max_tokens') {
            const note = document.createElement('p');
            note.style.cssText = 'color:#888; font-size:12px; margin-top:8px; font-style:italic;';
            note.textContent = '…(响应被截断,达到 max_tokens 限制)';
            final.querySelector('.message-body').appendChild(note);
        }
        await updateConvMessages(conv.id, conv.messages);
    } catch (err) {
        if (err.name === 'AbortError') {
            const note = document.createElement('p');
            note.style.cssText = 'color:#888; font-size:12px; margin-top:8px; font-style:italic;';
            note.textContent = '(已中止)';
            streamingBubble.body.appendChild(note);
        } else if (err.status) {
            const map = {
                401: 'API Key 无效或已过期。',
                403: '无权访问,请检查账户或区域。',
                404: '模型或接口路径错误。',
                429: '请求过于频繁,请稍后重试。',
            };
            showError(map[err.status] || `服务器错误 (${err.status}),请稍后重试。`);
        } else {
            showError(`网络错误: ${err.message || err}`);
            streamingBubble.body.insertAdjacentHTML('beforeend', '<p style="color:#888; font-size:12px; margin-top:8px; font-style:italic;">(连接中断)</p>');
        }
        streamingBubble.wrap.classList.remove('streaming');
        const final = renderMessage(streamingMsg, { id: conv.messages.length - 1 });
        streamingBubble.wrap.replaceWith(final);
        await updateConvMessages(conv.id, conv.messages);
    } finally {
        streamingMsg = null;
        streamingBubble = null;
        setSendButtonState(false);
        state.abortController = null;
        updateSendEnabled();
    }
}

function clearAll() {
    if (state.isStreaming && state.abortController) {
        state.abortController.abort();
    }
    dom.questionInput.value = '';
    showError(null);
    updateSendEnabled();
    dom.questionInput.focus();
}

dom.sendBtn.addEventListener('click', send);

dom.clearBtn.addEventListener('click', clearAll);

dom.questionInput.addEventListener('input', () => {
    dom.questionInput.style.height = 'auto';
    dom.questionInput.style.height = Math.min(dom.questionInput.scrollHeight, 200) + 'px';
    updateSendEnabled();
});

dom.questionInput.addEventListener('keydown', (e) => {
    if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && e.key === 'Enter') {
        e.preventDefault();
        send();
    } else if (e.key === 'Escape') {
        e.preventDefault();
        clearAll();
    }
});

document.addEventListener('keydown', async (e) => {
    if (dom.settingsModal && !dom.settingsModal.hidden) return;
    if (dom.convPromptModal && !dom.convPromptModal.hidden) return;
    if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && e.code === 'KeyN') {
        e.preventDefault();
        const c = await createConversation();
        state.currentConvId = c.id;
        state.currentMessages = c.messages;
        renderSidebar();
        renderMessages();
        dom.questionInput.focus();
        return;
    }
    if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && e.code === 'KeyK') {
        e.preventDefault();
        dom.convSearchInput.focus();
        dom.convSearchInput.select();
        return;
    }
    if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && e.code === 'KeyR') {
        if (state.isStreaming) return;
        e.preventDefault();
        regenerateLast();
        return;
    }
});

dom.convSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const items = Array.from(dom.convList.querySelectorAll('.conv-item'));
        if (items.length === 0) return;
        const outlined = dom.convList.querySelector('.conv-item[style*="outline"]');
        let activeIdx = outlined ? items.indexOf(outlined) : items.findIndex(el => el.classList.contains('active'));
        let nextIdx;
        if (e.key === 'ArrowDown') nextIdx = Math.min(items.length - 1, (activeIdx < 0 ? 0 : activeIdx + 1));
        else nextIdx = Math.max(0, (activeIdx < 0 ? 0 : activeIdx - 1));
        if (outlined) outlined.style.outline = '';
        items[nextIdx].classList.add('active');
        items[nextIdx].style.outline = '2px solid #4fc3f7';
        items[nextIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
        e.preventDefault();
        const outlined = dom.convList.querySelector('.conv-item[style*="outline"]');
        if (outlined) outlined.click();
    } else if (e.key === 'Escape') {
        dom.convSearchInput.value = '';
        state.searchQuery = '';
        renderSidebar();
        dom.convSearchInput.blur();
    }
});

updateSendEnabled();
dom.questionInput.focus();

dom.questionInput.addEventListener('input', () => {
    if (dom.errorBanner.classList.contains('visible')) {
        showError(null);
    }
});

dom.questionInput.addEventListener('keydown', (e) => {
    if (dom.questionInput.value.length >= dom.questionInput.maxLength) {
        const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Tab'];
        if (!allowedKeys.includes(e.key) && !e.ctrlKey && !e.metaKey) {
            dom.questionInput.classList.add('flash-error');
            setTimeout(() => dom.questionInput.classList.remove('flash-error'), 200);
        }
    }
});
    </script>
</body>
