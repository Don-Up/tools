<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e1e1e;
    color: #e0e0e0;
    min-height: 100vh;
}

#app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 24px 120px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100vh;
}

#topBar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
}

#topBar h1 {
    font-size: 16px;
    font-weight: 600;
    color: #4fc3f7;
    margin: 0;
}

#apiKeyLabel {
    color: #888;
    font-size: 13px;
    margin-left: auto;
}

#apiKeyInput {
    width: 220px;
    padding: 5px 8px;
    font-size: 13px;
    font-family: 'Consolas', 'Monaco', monospace;
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 4px;
}

#apiKeyInput:focus { outline: none; border-color: #4fc3f7; }

.btn {
    padding: 5px 12px;
    font-size: 13px;
    color: #fff;
    background: #3a86ff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
}

.btn:hover { background: #2a6edc; }
.btn:disabled { background: #3a3a3a; color: #777; cursor: default; }
.btn.secondary { background: #3a3a3a; color: #cfd8dc; }
.btn.secondary:hover { background: #4a4a4a; }

#settingsRow {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 16px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 13px;
    color: #b0bec5;
}

#settingsRow label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

#settingsRow input[type="checkbox"] {
    accent-color: #4fc3f7;
    cursor: pointer;
}

#errorBanner {
    display: none;
    padding: 10px 16px;
    background: #7f1d1d;
    color: #fecaca;
    border-radius: 6px;
    font-size: 14px;
}

#errorBanner.visible { display: block; }

#thinkingSection {
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0;
}

#thinkingSection summary {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    color: #b0bec5;
    user-select: none;
}

#thinkingContent {
    padding: 0 16px 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #888;
    white-space: pre-wrap;
    word-break: break-word;
}

#answerSection {
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px 24px;
    min-height: 200px;
    line-height: 1.7;
    color: #e0e0e0;
}

#answerSection.empty {
    color: #666;
    font-style: italic;
    text-align: center;
    padding-top: 80px;
}

#answerSection h1, #answerSection h2, #answerSection h3 {
    color: #4fc3f7;
    margin: 18px 0 10px;
    font-weight: 600;
}

#answerSection h1 { font-size: 22px; }
#answerSection h2 { font-size: 18px; }
#answerSection h3 { font-size: 16px; }

#answerSection p { margin: 8px 0; }
#answerSection ul, #answerSection ol { margin: 8px 0 8px 24px; }
#answerSection li { margin: 4px 0; }

#answerSection a { color: #4fc3f7; text-decoration: none; }
#answerSection a:hover { text-decoration: underline; }

#answerSection blockquote {
    border-left: 3px solid #444;
    padding-left: 12px;
    color: #b0bec5;
    margin: 10px 0;
}

#answerSection table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
}

#answerSection th, #answerSection td {
    border: 1px solid #444;
    padding: 6px 10px;
    text-align: left;
}

#answerSection th { background: #2d2d2d; }

#answerSection pre {
    position: relative;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px 14px;
    margin: 10px 0;
    overflow-x: auto;
}

#answerSection code {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
}

#answerSection :not(pre) > code {
    background: #2d2d2d;
    padding: 1px 5px;
    border-radius: 3px;
    color: #ffb74d;
}

#answerSection .code-copy {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #cfd8dc;
    background: #3a3a3a;
    border: 1px solid #555;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
}

#answerSection .code-copy:hover { background: #4fc3f7; color: #1e1e1e; }
#answerSection .code-copy.copied { background: #81c784; color: #1e1e1e; }

#answerSection .stream-cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: #4fc3f7;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

#inputBar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    position: sticky;
    bottom: 16px;
    margin-top: 16px;
    z-index: 5;
}

#questionInput {
    width: 100%;
    min-height: 60px;
    max-height: 200px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    color: #e0e0e0;
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 4px;
    resize: none;
    overflow-y: auto;
}

#questionInput:focus { outline: none; border-color: #4fc3f7; }
#questionInput.flash-error { border-color: #ef5350; transition: border-color 0.2s; }

#inputActions {
    display: flex;
    align-items: center;
    gap: 8px;
}

#inputActions .hint {
    margin-left: auto;
    font-size: 12px;
    color: #888;
}

#inputActions kbd {
    display: inline-block;
    padding: 1px 6px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 11px;
    background: #1a1a1a;
    border: 1px solid #444;
    border-radius: 3px;
    color: #b0bec5;
}

#app {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    max-width: 1200px;
    padding: 0;
}

#sidebar {
    background: #1a1a1a;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow: hidden;
}
.main-area {
    padding: 20px 24px 40px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
}
.sidebar-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
}
.sidebar-search {
    width: 100%;
    padding: 6px 10px;
    font-size: 13px;
    background: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 4px;
    font-family: inherit;
    box-sizing: border-box;
}
.sidebar-search:focus { outline: none; border-color: #4fc3f7; }
.conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
}
.conv-item {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: relative;
}
.conv-item:hover { background: #232323; }
.conv-item.active { background: #2a3a4a; }
.conv-item-title {
    font-size: 13px;
    color: #e0e0e0;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.conv-item-preview {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.conv-item-time {
    font-size: 10px;
    color: #666;
}
.conv-item-menu {
    position: absolute;
    right: 8px;
    top: 8px;
    background: #333;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
    display: none;
}
.conv-item:hover .conv-item-menu { display: block; }
.conv-list-empty {
    padding: 20px 12px;
    text-align: center;
    color: #666;
    font-size: 12px;
}
.icon-only { padding: 4px 10px; }
.model-badge {
    color: #888;
    font-size: 12px;
    padding: 4px 8px;
    background: #2a2a2a;
    border-radius: 4px;
    margin-left: auto;
}
.conv-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #2a2a2a;
    margin-bottom: 12px;
}
.conv-header.hidden { display: none; }
.conv-title {
    font-size: 15px;
    color: #cfd8dc;
    font-weight: 500;
    margin: 0;
    cursor: pointer;
}
.conv-title:hover { color: #4fc3f7; }
    </style>
</head>
<body>
    <main id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <button id="newConvBtn" class="btn" type="button">+ 新对话</button>
                <input id="convSearchInput" class="sidebar-search" type="text" placeholder="搜索会话..." />
            </div>
            <div id="convList" class="conv-list"></div>
        </aside>
        <div class="main-area">
            <header id="topBar">
                <h1>ai</h1>
                <label for="apiKeyInput" id="apiKeyLabel">API Key:</label>
                <input id="apiKeyInput" type="password" placeholder="点击此处设置 API Key">
                <button id="apiKeySaveBtn" class="btn secondary" type="button">保存</button>
                <span class="model-badge">M3</span>
                <button id="settingsBtn" class="btn secondary icon-only" type="button" title="设置">⚙</button>
            </header>
            <div id="settingsRow">
                <label>
                    <input id="showThinkingToggle" type="checkbox">
                    显示思考
                </label>
            </div>
            <div id="errorBanner"></div>
            <div id="convHeader" class="conv-header hidden">
                <h2 id="convTitle" class="conv-title"></h2>
                <button id="convPromptBtn" class="btn secondary" type="button">本对话提示词</button>
            </div>
            <section id="messages" class="messages empty"></section>
            <div id="inputBar">
                <textarea id="questionInput" placeholder="输入你的问题... (Ctrl+Enter 发送, Esc 清空)" maxlength="10000"></textarea>
                <div id="inputActions">
                    <button id="sendBtn" class="btn" type="button" disabled>发送</button>
                    <button id="clearBtn" class="btn secondary" type="button">清空</button>
                    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送 · <kbd>Esc</kbd> 清空</span>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script>
        'use strict';

        const BASE_URL = 'https://next-reader-psi.vercel.app/api/minimax';
        const MODEL = 'MiniMax-M3';
        const MAX_TOKENS = 8192;
        const DEFAULT_SYSTEM_PROMPT = '你是一个简洁、准确的助手。优先用中文回答,除非用户用其他语言提问。';

        const IDB_NAME = 'aiChatDb';
        const IDB_VERSION = 1;
        const STORE_CONV = 'conversations';
        const STORE_SETTINGS = 'settings';

        const state = {
            apiKey: localStorage.getItem('aiApiKey') || '',
            showThinking: (() => {
                const v = localStorage.getItem('aiShowThinking');
                return v === null ? true : v === 'true';
            })(),
            defaultSystemPrompt: localStorage.getItem('aiDefaultSystemPrompt') || DEFAULT_SYSTEM_PROMPT,
            question: '',
            thinkingBuf: '',
            textBuf: '',
            currentBlockType: null,
            currentBlockIndex: -1,
            stopReason: null,
            isStreaming: false,
            abortController: null,
            rawAnswerEl: null,
            db: null,
            idbAvailable: true,
            conversations: [],
            currentConvId: null,
            currentMessages: [],
            searchQuery: '',
        };

        function openDb() {
            return new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) {
                    reject(new Error('IndexedDB not supported'));
                    return;
                }
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STORE_CONV)) {
                        const s = db.createObjectStore(STORE_CONV, { keyPath: 'id' });
                        s.createIndex('byUpdated', 'updatedAt', { unique: false });
                    }
                    if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
                        db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function settingsPutMany(pairs) {
            if (!state.db) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const tx = state.db.transaction(STORE_SETTINGS, 'readwrite');
                const s = tx.objectStore(STORE_SETTINGS);
                pairs.forEach(p => s.put(p));
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        function migrateFromLocalStorage() {
            const lsApiKey = localStorage.getItem('aiApiKey');
            const lsThinking = localStorage.getItem('aiShowThinking');
            const lsPrompt = localStorage.getItem('aiDefaultSystemPrompt');
            const writes = [];
            if (lsApiKey) writes.push({ key: 'apiKey', value: lsApiKey });
            if (lsThinking !== null) writes.push({ key: 'showThinking', value: lsThinking });
            if (lsPrompt) writes.push({ key: 'defaultSystemPrompt', value: lsPrompt });
            if (writes.length === 0) {
                localStorage.setItem('ai.html:migrated', 'v1');
                return Promise.resolve();
            }
            return settingsPutMany(writes).then(() => {
                localStorage.removeItem('aiApiKey');
                localStorage.removeItem('aiShowThinking');
                localStorage.removeItem('aiDefaultSystemPrompt');
                localStorage.setItem('ai.html:migrated', 'v1');
            });
        }

        function txStore(storeName, mode) {
            return state.db.transaction(storeName, mode).objectStore(storeName);
        }

        function reqToPromise(req) {
            return new Promise((resolve, reject) => {
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function settingsGet(key) {
            if (!state.db) return Promise.resolve(null);
            return reqToPromise(txStore(STORE_SETTINGS, 'readonly').get(key))
                .then(r => (r ? r.value : null));
        }
        function settingsPut(key, value) {
            if (!state.db) return Promise.resolve();
            return reqToPromise(txStore(STORE_SETTINGS, 'readwrite').put({ key, value }));
        }
        function convGetAll() {
            if (!state.db) return Promise.resolve([]);
            return reqToPromise(txStore(STORE_CONV, 'readonly').getAll());
        }
        function convGet(id) {
            if (!state.db) return Promise.resolve(null);
            return reqToPromise(txStore(STORE_CONV, 'readonly').get(id));
        }
        function convPut(conv) {
            if (!state.db) return Promise.resolve();
            return reqToPromise(txStore(STORE_CONV, 'readwrite').put(conv));
        }
        function convDelete(id) {
            if (!state.db) return Promise.resolve();
            return reqToPromise(txStore(STORE_CONV, 'readwrite').delete(id));
        }

        function uuidv4() {
            if (crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        async function createConversation() {
            const now = Date.now();
            const conv = {
                id: uuidv4(),
                title: '新对话',
                createdAt: now,
                updatedAt: now,
                systemPromptOverride: null,
                model: MODEL,
                messages: [],
            };
            if (state.idbAvailable) await convPut(conv);
            state.conversations.push(conv);
            return conv;
        }

        async function deleteConversation(id) {
            await convDelete(id);
            state.conversations = state.conversations.filter(c => c.id !== id);
        }

        async function renameConversation(id, newTitle) {
            const conv = state.conversations.find(c => c.id === id);
            if (!conv) return;
            const t = newTitle.trim();
            if (t) conv.title = t;
            conv.updatedAt = Date.now();
            if (state.idbAvailable) await convPut(conv);
        }

        async function updateConvMessages(id, messages) {
            const conv = state.conversations.find(c => c.id === id);
            if (!conv) return;
            conv.messages = messages;
            conv.updatedAt = Date.now();
            if (state.idbAvailable) await convPut(conv);
        }

        async function loadAllConversations() {
            if (!state.idbAvailable) {
                state.conversations = [];
                return;
            }
            const all = await convGetAll();
            state.conversations = all.sort((a, b) => b.updatedAt - a.updatedAt);
        }

        function relativeTime(ts) {
            const diff = Date.now() - ts;
            if (diff < 60_000) return '刚刚';
            if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} 分钟前`;
            if (diff < 86_400_000) return `${Math.floor(diff / 3_600_000)} 小时前`;
            if (diff < 7 * 86_400_000) return `${Math.floor(diff / 86_400_000)} 天前`;
            const d = new Date(ts);
            return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        const dom = {
            apiKeyInput: document.getElementById('apiKeyInput'),
            apiKeySaveBtn: document.getElementById('apiKeySaveBtn'),
            showThinkingToggle: document.getElementById('showThinkingToggle'),
            errorBanner: document.getElementById('errorBanner'),
            thinkingSection: document.getElementById('thinkingSection'),
            thinkingContent: document.getElementById('thinkingContent'),
            answerSection: document.getElementById('answerSection'),
            questionInput: document.getElementById('questionInput'),
            sendBtn: document.getElementById('sendBtn'),
            clearBtn: document.getElementById('clearBtn'),
            sidebar: document.getElementById('sidebar'),
            newConvBtn: document.getElementById('newConvBtn'),
            convSearchInput: document.getElementById('convSearchInput'),
            convList: document.getElementById('convList'),
            settingsBtn: document.getElementById('settingsBtn'),
            convHeader: document.getElementById('convHeader'),
            convTitle: document.getElementById('convTitle'),
            convPromptBtn: document.getElementById('convPromptBtn'),
            messages: document.getElementById('messages'),
        };

        marked.setOptions({ breaks: true, gfm: true });

        function renderSidebar() {
            const q = state.searchQuery.toLowerCase();
            const list = state.conversations.filter(c => !q || c.title.toLowerCase().includes(q));
            if (list.length === 0) {
                dom.convList.innerHTML = `<div class="conv-list-empty">${q ? '没有匹配的会话' : '还没有会话'}</div>`;
                return;
            }
            dom.convList.innerHTML = '';
            list.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === state.currentConvId ? ' active' : '');
                item.dataset.id = conv.id;
                const firstUser = conv.messages.find(m => m.role === 'user');
                const preview = firstUser ? firstUser.content.slice(0, 30) : '(空)';
                item.innerHTML = `
                    <div class="conv-item-title">${escapeHtml(conv.title)}</div>
                    <div class="conv-item-preview">${escapeHtml(preview)}</div>
                    <div class="conv-item-time">${relativeTime(conv.updatedAt)}</div>
                    <button class="conv-item-menu" type="button">⋯</button>
                `;
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('conv-item-menu')) return;
                    switchConversation(conv.id);
                });
                item.querySelector('.conv-item-menu').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showConvMenu(conv.id, item);
                });
                dom.convList.appendChild(item);
            });
        }

        function renderMessages() {
            const conv = state.conversations.find(c => c.id === state.currentConvId);
            if (!conv) {
                dom.messages.classList.add('empty');
                dom.messages.innerHTML = '选择或创建一个对话';
                dom.convHeader.classList.add('hidden');
                return;
            }
            if (conv.messages.length === 0) {
                dom.messages.classList.add('empty');
                dom.messages.innerHTML = '在新对话中向 AI 提问...';
            } else {
                dom.messages.classList.remove('empty');
                dom.messages.innerHTML = '';
                // Task 3 fills in actual rendering
            }
            dom.convHeader.classList.remove('hidden');
            dom.convTitle.textContent = conv.title;
        }

        async function switchConversation(id) {
            state.currentConvId = id;
            const conv = state.conversations.find(c => c.id === id);
            if (conv) state.currentMessages = conv.messages;
            renderSidebar();
            renderMessages();
        }

        function showConvMenu(id, anchor) {
            // Task 5 implements this; stub for now
            alert('操作菜单待实现');
        }

        function showError(msg) {
            if (!msg) {
                dom.errorBanner.classList.remove('visible');
                dom.errorBanner.textContent = '';
                return;
            }
            dom.errorBanner.textContent = msg;
            dom.errorBanner.classList.add('visible');
        }

        function setSendButtonState(streaming) {
            state.isStreaming = streaming;
            dom.sendBtn.textContent = streaming ? '停止' : '发送';
            dom.sendBtn.classList.toggle('secondary', streaming);
            dom.questionInput.disabled = streaming;
        }

        function updateSendEnabled() {
            if (state.isStreaming) return;
            dom.sendBtn.disabled = !dom.questionInput.value.trim();
        }

        function renderApiKey() {
            if (state.apiKey) {
                dom.apiKeyInput.type = 'password';
                dom.apiKeyInput.value = '•'.repeat(Math.min(state.apiKey.length, 40));
                dom.apiKeyInput.dataset.masked = '1';
                dom.apiKeySaveBtn.textContent = '修改';
            } else {
                dom.apiKeyInput.type = 'password';
                dom.apiKeyInput.value = '';
                dom.apiKeyInput.placeholder = '点击此处设置 API Key';
                dom.apiKeyInput.dataset.masked = '';
                dom.apiKeySaveBtn.textContent = '保存';
            }
        }

        function unmaskApiKey() {
            if (!state.apiKey) return;
            dom.apiKeyInput.type = 'password';
            dom.apiKeyInput.value = state.apiKey;
            dom.apiKeyInput.dataset.masked = '';
            dom.apiKeySaveBtn.textContent = '保存';
            dom.apiKeyInput.focus();
            dom.apiKeyInput.select();
        }

        function saveApiKey() {
            const v = dom.apiKeyInput.value.trim();
            if (!v) {
                showError('API Key 不能为空');
                return;
            }
            state.apiKey = v;
            localStorage.setItem('aiApiKey', v);
            renderApiKey();
            showError(null);
        }

        dom.apiKeyInput.addEventListener('focus', () => {
            if (dom.apiKeyInput.dataset.masked === '1') unmaskApiKey();
        });

        dom.apiKeyInput.addEventListener('blur', () => {
            if (state.apiKey && dom.apiKeyInput.value === '•'.repeat(Math.min(state.apiKey.length, 40))) return;
        });

        dom.apiKeySaveBtn.addEventListener('click', () => {
            if (dom.apiKeySaveBtn.textContent === '修改') {
                unmaskApiKey();
            } else {
                saveApiKey();
            }
        });

        dom.apiKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveApiKey();
                dom.apiKeyInput.blur();
            }
        });

        (async function init() {
            try {
                state.db = await openDb();
                if (!localStorage.getItem('ai.html:migrated')) {
                    await migrateFromLocalStorage();
                }
            } catch (err) {
                console.error('IDB init failed:', err);
                state.idbAvailable = false;
                showError('本地存储不可用,会话将无法保存(刷新后丢失)。请检查浏览器隐私模式。');
            }

            if (state.idbAvailable) {
                try {
                    const apiKey = await settingsGet('apiKey');
                    if (apiKey) state.apiKey = apiKey;
                    const thinking = await settingsGet('showThinking');
                    if (thinking !== null) state.showThinking = String(thinking) === 'true';
                    const prompt = await settingsGet('defaultSystemPrompt');
                    if (prompt) state.defaultSystemPrompt = prompt;
                } catch (err) {
                    console.error('settings load failed:', err);
                }
            }

            renderApiKey();
            dom.showThinkingToggle.checked = state.showThinking;
            dom.showThinkingToggle.addEventListener('change', () => {
                state.showThinking = dom.showThinkingToggle.checked;
                if (state.idbAvailable) settingsPut('showThinking', String(state.showThinking)).catch(() => {});
                dom.thinkingSection.style.display = state.showThinking ? '' : 'none';
            });
            dom.thinkingSection.style.display = state.showThinking ? '' : 'none';

            if (state.idbAvailable) {
                try {
                    await loadAllConversations();
                } catch (err) {
                    console.error('load conversations failed:', err);
                }
            }
            if (state.conversations.length === 0) {
                try {
                    const c = await createConversation();
                    state.currentConvId = c.id;
                    state.currentMessages = c.messages;
                } catch (err) {
                    console.error('create initial conversation failed:', err);
                }
            } else {
                state.currentConvId = state.conversations[0].id;
                state.currentMessages = state.conversations[0].messages;
            }
            renderSidebar();
            renderMessages();

            updateSendEnabled();
            dom.questionInput.focus();
        })();

        dom.newConvBtn.addEventListener('click', async () => {
            const c = await createConversation();
            state.currentConvId = c.id;
            state.currentMessages = c.messages;
            renderSidebar();
            renderMessages();
            dom.questionInput.focus();
        });

        dom.convSearchInput.addEventListener('input', () => {
            state.searchQuery = dom.convSearchInput.value;
            renderSidebar();
        });

        function buildRequestBody(question) {
            const body = {
                model: MODEL,
                max_tokens: MAX_TOKENS,
                system: state.defaultSystemPrompt,
                messages: [{ role: 'user', content: question }],
                stream: true,
            };
            if (state.showThinking) {
                body.thinking = { type: 'enabled' };
            }
            return body;
        }

        async function callApi(question) {
            const body = buildRequestBody(question);
            const res = await fetch(BASE_URL, {
                method: 'POST',
                headers: {
                    'content-type': 'application/json',
                    'anthropic-version': '2023-06-01',
                },
                body: JSON.stringify(body),
                signal: state.abortController.signal,
            });

            if (!res.ok) {
                const err = new Error(`HTTP ${res.status}`);
                err.status = res.status;
                throw err;
            }

            const contentType = res.headers.get('content-type') || '';
            if (!contentType.includes('text/event-stream')) {
                const json = await res.json();
                return handleNonStreaming(json);
            }

            await parseSseStream(res.body);
        }

        async function handleNonStreaming(json) {
            if (Array.isArray(json && json.content)) {
                for (const block of json.content) {
                    if (block.type === 'text') state.textBuf += block.text;
                    else if (block.type === 'thinking') state.thinkingBuf += (block.thinking || '');
                }
            }
            state.stopReason = json.stop_reason || 'end_turn';
        }

        async function parseSseStream(body) {
            const reader = body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                let sep;
                while ((sep = buffer.indexOf('\n\n')) !== -1) {
                    const raw = buffer.slice(0, sep);
                    buffer = buffer.slice(sep + 2);
                    processSseEvent(raw);
                }
            }
            if (buffer.trim()) processSseEvent(buffer);
        }

        function processSseEvent(raw) {
            const lines = raw.split('\n');
            let eventName = '';
            const dataLines = [];
            for (const line of lines) {
                if (line.startsWith('event:')) eventName = line.slice(6).trim();
                else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
            }
            const data = dataLines.join('\n');
            if (!data || data === '[DONE]') return;
            let payload;
            try {
                payload = JSON.parse(data);
            } catch (err) {
                console.warn('SSE JSON parse failed', err, data);
                return;
            }
            handleSsePayload(eventName, payload);
        }

        function handleSsePayload(eventName, payload) {
            switch (eventName) {
                case 'message_start':
                    if (payload.message && payload.message.stop_reason) {
                        state.stopReason = payload.message.stop_reason;
                    }
                    break;
                case 'content_block_start':
                    state.currentBlockIndex = payload.index;
                    state.currentBlockType = payload.content_block && payload.content_block.type;
                    break;
                case 'content_block_delta': {
                    const idx = payload.index;
                    if (idx !== state.currentBlockIndex) {
                        state.currentBlockIndex = idx;
                    }
                    const delta = payload.delta || {};
                    if (delta.type === 'text_delta' || typeof delta.text === 'string') {
                        state.textBuf += delta.text;
                        renderStreamingText();
                    } else if (delta.type === 'thinking_delta' || typeof delta.thinking === 'string') {
                        state.thinkingBuf += delta.thinking;
                        renderStreamingThinking();
                    }
                    break;
                }
                case 'content_block_stop':
                    if (state.currentBlockType === 'text') {
                        renderFinalAnswer();
                    }
                    state.currentBlockType = null;
                    break;
                case 'message_delta':
                    if (payload.delta && payload.delta.stop_reason) {
                        state.stopReason = payload.delta.stop_reason;
                    }
                    break;
                case 'message_stop':
                    break;
                default:
                    break;
            }
        }

        function renderStreamingThinking() {
            dom.thinkingContent.textContent = state.thinkingBuf;
        }

        function renderStreamingText() {
            if (!state.rawAnswerEl) {
                dom.answerSection.classList.remove('empty');
                dom.answerSection.innerHTML = '';
                const pre = document.createElement('pre');
                pre.style.cssText = 'margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:14px; line-height:1.7; color:#e0e0e0;';
                state.rawAnswerEl = pre;
                dom.answerSection.appendChild(pre);
            }
            state.rawAnswerEl.textContent = state.textBuf;
            appendCursor(state.rawAnswerEl);
        }

        function appendCursor(host) {
            const old = host.nextElementSibling;
            if (old && old.classList && old.classList.contains('stream-cursor')) old.remove();
            const cursor = document.createElement('span');
            cursor.className = 'stream-cursor';
            host.parentNode.insertBefore(cursor, host.nextSibling);
        }

        function removeCursor() {
            const c = dom.answerSection.querySelector('.stream-cursor');
            if (c) c.remove();
        }

        function renderFinalAnswer() {
            if (state.textBuf && state.textBuf.trim()) {
                dom.answerSection.classList.remove('empty');
                let html;
                try {
                    html = marked.parse(state.textBuf);
                } catch (err) {
                    console.error('marked failed', err);
                    html = `<pre>${escapeHtml(state.textBuf)}</pre>`;
                }
                dom.answerSection.innerHTML = html;
                appendCodeCopyButtons(dom.answerSection);
            }
            removeCursor();
            if (state.stopReason === 'max_tokens') {
                const note = document.createElement('p');
                note.style.cssText = 'color:#888; font-size:12px; margin-top:12px; font-style:italic;';
                note.textContent = '…(响应被截断,达到 max_tokens 限制)';
                dom.answerSection.appendChild(note);
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function appendCodeCopyButtons(root) {
            const pres = root.querySelectorAll('pre');
            pres.forEach((pre) => {
                if (pre.dataset.copyAttached === '1') return;
                pre.dataset.copyAttached = '1';
                const btn = document.createElement('button');
                btn.className = 'code-copy';
                btn.type = 'button';
                btn.textContent = '复制';
                btn.addEventListener('click', async () => {
                    const code = pre.querySelector('code');
                    const text = code ? code.textContent : pre.textContent;
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch (err) {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (e) { /* ignore */ }
                        document.body.removeChild(ta);
                    }
                    btn.textContent = '✓ 已复制';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '复制';
                        btn.classList.remove('copied');
                    }, 1500);
                });
                pre.appendChild(btn);
            });
        }

function resetAnswer() {
    state.thinkingBuf = '';
    state.textBuf = '';
    state.currentBlockType = null;
    state.currentBlockIndex = -1;
    state.stopReason = null;
    state.rawAnswerEl = null;
    dom.answerSection.classList.add('empty');
    dom.answerSection.innerHTML = '答复将显示在这里';
    dom.thinkingContent.textContent = '';
}

async function send() {
    if (state.isStreaming) {
        if (state.abortController) state.abortController.abort();
        return;
    }
    const question = dom.questionInput.value.trim();
    if (!question) return;
    if (!state.apiKey) {
        showError('请先在顶部设置 API Key。');
        dom.apiKeyInput.focus();
        return;
    }
    showError(null);
    resetAnswer();
    state.question = question;
    state.abortController = new AbortController();
    setSendButtonState(true);

    try {
        await callApi(question);
        if (!state.textBuf && state.thinkingBuf) {
            state.textBuf = '（模型仅返回了思考过程,无最终答复。）';
            renderFinalAnswer();
        }
    } catch (err) {
        if (err.name === 'AbortError') {
            // user cancelled
        } else if (err.status) {
            const map = {
                401: 'API Key 无效或已过期。',
                403: '无权访问,请检查账户或区域。',
                404: '模型或接口路径错误。',
                429: '请求过于频繁,请稍后重试。',
            };
            const known = map[err.status];
            showError(known || `服务器错误 (${err.status}),请稍后重试。`);
        } else {
            showError(`网络错误: ${err.message || err}`);
        }
        removeCursor();
        renderFinalAnswer();
    } finally {
        setSendButtonState(false);
        state.abortController = null;
        updateSendEnabled();
    }
}

function clearAll() {
    if (state.isStreaming && state.abortController) {
        state.abortController.abort();
    }
    dom.questionInput.value = '';
    resetAnswer();
    showError(null);
    showError(null);
    updateSendEnabled();
    dom.questionInput.focus();
}

dom.sendBtn.addEventListener('click', send);

dom.clearBtn.addEventListener('click', clearAll);

dom.questionInput.addEventListener('input', () => {
    dom.questionInput.style.height = 'auto';
    dom.questionInput.style.height = Math.min(dom.questionInput.scrollHeight, 200) + 'px';
    updateSendEnabled();
});

dom.questionInput.addEventListener('keydown', (e) => {
    if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && e.key === 'Enter') {
        e.preventDefault();
        send();
    } else if (e.key === 'Escape') {
        e.preventDefault();
        clearAll();
    }
});

updateSendEnabled();
dom.questionInput.focus();

dom.questionInput.addEventListener('input', () => {
    if (dom.errorBanner.classList.contains('visible')) {
        showError(null);
    }
});

dom.questionInput.addEventListener('keydown', (e) => {
    if (dom.questionInput.value.length >= dom.questionInput.maxLength) {
        const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Tab'];
        if (!allowedKeys.includes(e.key) && !e.ctrlKey && !e.metaKey) {
            dom.questionInput.classList.add('flash-error');
            setTimeout(() => dom.questionInput.classList.remove('flash-error'), 200);
        }
    }
});
    </script>
</body>
