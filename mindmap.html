<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思维导图生成器（暗黑模式）</title>
    <style>
        :root {
            --bg-color:  #363B40;
            --side-bar-bg-color: #2E3033;
            --text-color: #b8bfc6;
            --select-text-bg-color:#4a89dc;
            --item-hover-bg-color: #0a0d16;
            --control-text-color: #b7b7b7;
            --control-text-hover-color: #eee;
            --window-border: 1px solid #555;
            --active-file-bg-color: rgb(34, 34, 34);
            --active-file-border-color: #8d8df0;
            --primary-color: #a3d5fe;
            --active-file-text-color: white;
            --item-hover-bg-color: #70717d;
            --item-hover-text-color: white;
            --primary-color: #6dc1e7;
            --rawblock-edit-panel-bd: #333;
            --search-select-bg-color: #428bca;
        }

        html {
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-color);
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            line-height: 1.625rem;
        }

        /* Tab styles */
        .tab-container {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: #252525;
            border-bottom: 1px solid #333;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 16px;
            background: #333;
            color: #aaa;
            border: none;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #444;
            color: #ddd;
        }

        .tab.active {
            background: #1e1e1e;
            color: #fff;
        }

        .tab-close {
            margin-left: 8px;
            color: #888;
            font-size: 12px;
        }

        .tab-close:hover {
            color: #ff6b6b;
        }

        .add-tab-btn {
            padding: 8px 12px;
            background: #2a2a2a;
            color: #888;
            border: 1px dashed #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-tab-btn:hover {
            background: #333;
            color: #aaa;
            border-color: #555;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 隐藏原始文本容器 */
        #source-text {
            display: none;
        }

        /* 思维导图容器 */
        .mindmap-container {
            width: 100%;
            max-width: 60%;
            margin: 0 auto;
            padding: 0;
        }

        /* 思维导图节点样式 - 关键修改：自适应宽度 */
        .mindmap-node {
            margin: 8px 0;
            padding: 4px 8px;
            border-radius: 4px;
            list-style: none;
            line-height: 1.5;
            position: relative;
            cursor: pointer;
            display: inline-block; /* 改为inline-block实现宽度自适应 */
            min-width: fit-content; /* 最小宽度适配内容 */
            white-space: nowrap; /* 防止内容换行 */
            box-sizing: border-box;
        }

        /* 根节点（层级0） */
        .node-level-0 {
            font-size: 18px;
            font-weight: bold;
            background: #4285f4;
            color: white;
            margin-left: 0;
        }

        /* 一级子节点（** → 层级1） */
        .node-level-1 {
            font-size: 15px;
            background: #80752c;
            color: white;
            margin-left: 30px;
            font-weight: bold;
        }

        /* 二级子节点（*** → 层级2） */
        .node-level-2 {
            font-size: 14px;
            background: #1d953f;
            color: #eee;
            margin-left: 60px;
        }

        /* 三级子节点（**** → 层级3） */
        .node-level-3 {
            font-size: 12px;
            background: #abc88b;
            color: #333;
            margin-left: 90px;
        }

        /* 四级子节点（***** → 层级4） */
        .node-level-4 {
            font-size: 11px;
            background: #fedcbd;
            color: #333;
            margin-left: 120px;
        }

        /* 行内input样式 - 自适应宽度 */
        .mindmap-node input {
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            outline: none;
            font-size: inherit;
            color: #333;
            background: lightgrey;
            margin: 0 2px;
            font-family: 微软雅黑;
            text-align: center;
            width: auto; /* 取消固定宽度，改为自适应 */
            min-width: 20px; /* 最小宽度保证可用性 */
        }

        /* 层级连接线 */
        .node-level-1::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 50%;
            width: 20px;
            height: 1px;
            background: #999;
        }
        .node-level-2::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 50%;
            width: 30px;
            height: 1px;
            background: #999;
        }
        .node-level-3::before {
            content: '';
            position: absolute;
            left: -40px;
            top: 50%;
            width: 40px;
            height: 1px;
            background: #999;
        }
        .node-level-4::before {
            content: '';
            position: absolute;
            left: -50px;
            top: 50%;
            width: 50px;
            height: 1px;
            background: #999;
        }

        /* Input选中样式 */
        .mindmap-node input::selection {
            background-color: lightgrey;
            color: #333;
        }

        .mindmap-node input::-moz-selection {
            background-color: lightgrey;
            color: #333;
        }

        input::placeholder {
            opacity: 1;
            color: #999;
        }

        /* 提示文本样式 */
        .paste-hint {
            text-align: center;
            color: #999;
            font-size: 16px;
            margin: 50px 0;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .mindmap-container {
                margin: 10px 0;
                max-width: 100%;
            }

            .node-level-0 {
                font-size: 15px;
                margin-left: -20px;
            }

            .node-level-1 {
                font-size: 14px;
                margin-left: 20px;
            }

            .node-level-2 {
                font-size: 12px;
                margin-left: 40px;
            }

            .node-level-3 {
                font-size: 10px;
                margin-left: 60px;
            }

            .node-level-4 {
                font-size: 9px;
                margin-left: 80px;
            }

            .mindmap-node input {
                padding: 1px 3px;
                margin: 0 1px;
            }

            .paste-hint {
                font-size: 14px;
                margin: 30px 0;
            }
        }
    </style>
</head>
<body>
<!-- Tab container -->
<div class="tab-container" id="tabContainer">
    <button class="add-tab-btn" id="addTabBtn">+ Add Tab</button>
</div>

<!-- Tab contents container -->
<div id="tabContents">
    <!-- Tab contents will be added here dynamically -->
</div>

<!-- 原始文本容器（隐藏） -->
<div id="source-text"></div>

<!-- Audio for timer notification -->
<audio id="dingSound" src="mp3/bounce.mp3"></audio>

<script>
    // Tab management
    let tabCount = 0;
    let activeTabId = null;

    // Timer management for inputs
    const inputTimers = {};

    // Add notification indicator to tab
    function addTabNotification(tabId) {
        const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tab && !tab.textContent.includes('💡')) {
            const closeBtn = tab.querySelector('.tab-close');
            const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
            tab.dataset.tabName = tabName;
            if (closeBtn) {
                tab.innerHTML = `${tabName} 💡<span class="tab-close" data-close="${tabId}">×</span>`;
            }
        }
    }

    // Clear notification indicator from tab
    function clearTabNotification(tabId) {
        const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tab && tab.textContent.includes('💡')) {
            const closeBtn = tab.querySelector('.tab-close');
            const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
            if (closeBtn) {
                tab.innerHTML = `${tabName}<span class="tab-close" data-close="${tabId}">×</span>`;
            }
        }
    }

    // Helper function to start timer for an input
    function startTimerForInput(input, minutes) {
        const totalSeconds = minutes * 60;
        input.dataset.timerStarted = 'true';
        input.dataset.timerTotalSeconds = totalSeconds;
        input.dataset.timerOriginal = `${minutes}m`;
        input.dataset.timerStartTime = Date.now();
        input.style.color = "";
        input.style.background = "";

        const timerId = setInterval(() => {
            const elapsed = Math.floor((Date.now() - parseInt(input.dataset.timerStartTime, 10)) / 1000);
            const remaining = parseInt(input.dataset.timerTotalSeconds, 10) - elapsed;

            if (remaining <= 0) {
                clearInterval(timerId);
                delete inputTimers[input.dataset.timerId];
                input.value = input.dataset.timerOriginal || '';
                input.style.color = "";
                input.style.background = "#ff6666";
                delete input.dataset.timerStarted;
                delete input.dataset.timerTotalSeconds;
                delete input.dataset.timerOriginal;
                delete input.dataset.timerStartTime;
                delete input.dataset.timerId;
                const ding = document.getElementById('dingSound');
                if (ding) ding.play();
                const tabContent = input.closest('.tab-content');
                if (tabContent) {
                    addTabNotification(tabContent.dataset.tabId);
                }
            } else {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                input.value = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 250);

        input.dataset.timerId = timerId;
        inputTimers[timerId] = { input, interval: timerId };
    }

    const tabContainer = document.getElementById('tabContainer');
    const tabContents = document.getElementById('tabContents');
    const addTabBtn = document.getElementById('addTabBtn');

    function createTab(name, id) {
        const tab = document.createElement('button');
        tab.className = 'tab active';
        tab.dataset.tabId = id;
        tab.innerHTML = `${name}<span class="tab-close" data-close="${id}">×</span>`;

        tab.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) {
                closeTab(e.target.dataset.close);
            } else if (e.ctrlKey && e.altKey && e.shiftKey) {
                // Ctrl+Alt+Shift click on tab: start 10m timer for all inputs
                const tabContent = document.getElementById(`tab-content-${id}`);
                if (tabContent) {
                    tabContent.querySelectorAll('input').forEach(input => {
                        startTimerForInput(input, 10);
                    });
                }
            } else if (e.ctrlKey && e.altKey) {
                // Ctrl+Alt click on tab: start 2m timer for all inputs
                const tabContent = document.getElementById(`tab-content-${id}`);
                if (tabContent) {
                    tabContent.querySelectorAll('input').forEach(input => {
                        startTimerForInput(input, 2);
                    });
                }
            } else if (e.altKey) {
                // Alt + click to rename tab
                const newName = prompt('Enter new tab name:', tab.textContent.replace('×', '').trim());
                if (newName && newName.trim()) {
                    tab.innerHTML = `${newName.trim()}<span class="tab-close" data-close="${id}">×</span>`;
                }
            } else {
                switchTab(id);
            }
        });

        tabContainer.insertBefore(tab, addTabBtn);
    }

    function createTabContent(id) {
        const content = document.createElement('div');
        content.className = 'tab-content active';
        content.id = `tab-content-${id}`;
        content.innerHTML = `
            <div class="paste-hint" id="paste-hint-${id}">按下 Ctrl+V 粘贴内容生成思维导图</div>
            <div class="mindmap-container" id="mindmap-container-${id}"></div>
        `;
        tabContents.appendChild(content);
        content.dataset.tabId = id;
        return content;
    }

    function switchTab(id) {
        // Update tab appearance
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tabId === id);
        });

        // Update tab content visibility
        document.querySelectorAll('.tab-content').forEach(c => {
            c.classList.toggle('active', c.id === `tab-content-${id}`);
        });

        activeTabId = id;
    }

    function closeTab(id) {
        const tab = document.querySelector(`.tab[data-tab-id="${id}"]`);
        const content = document.getElementById(`tab-content-${id}`);

        if (!tab || !content) return;

        const wasActive = activeTabId === id;
        const isLastTab = document.querySelectorAll('.tab').length <= 1;

        tab.remove();
        content.remove();

        if (isLastTab) {
            addNewTab();
        } else if (wasActive) {
            const remainingTabs = document.querySelectorAll('.tab');
            if (remainingTabs.length > 0) {
                switchTab(remainingTabs[remainingTabs.length - 1].dataset.tabId);
            }
        }
    }

    function addNewTab() {
        tabCount++;
        const tabId = `tab-${tabCount}`;
        const tabName = `Mindmap${tabCount}`;
        createTab(tabName, tabId);
        createTabContent(tabId);
        switchTab(tabId);
    }

    addTabBtn.addEventListener('click', addNewTab);

    let avaVoice = null

    function loadVoices() {
        return new Promise((resolve) => {
            // 先尝试直接获取
            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                resolve(voices);
                return;
            }

            // 如果为空，监听加载完成事件
            window.speechSynthesis.onvoiceschanged = function() {
                voices = window.speechSynthesis.getVoices();
                resolve(voices);
            };
        });
    }

    loadVoices().then(voices => {
        avaVoice = voices.find(voice => voice.name === "Microsoft Ava Online (Natural) - English (United States)");
    })

    function speakText(text, force = false, element = null) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);

            if (avaVoice) {
                utterance.voice = avaVoice;
            }
            utterance.lang = 'en-US';
            utterance.rate = 1;
            utterance.volume = 1;
            utterance.pitch = 1;
            utterance.onend = () => {
                if(element) element.style.visibility = "visible"
            }
            if(element) element.style.visibility = "hidden"
            window.speechSynthesis.speak(utterance);
        } else {
            alert('您的浏览器不支持文本朗读功能');
        }
    }

    // 核心功能：解析文本并生成思维导图
    function initMindmap(tabId) {
        const sourceDiv = document.getElementById('source-text');
        if (!sourceDiv) {
            alert('未找到指定ID的div！');
            return;
        }

        const rawText = sourceDiv.innerHTML.trim();
        if (!rawText) {
            return;
        }

        // 隐藏粘贴提示
        const pasteHint = document.getElementById(`paste-hint-${tabId}`);
        if (pasteHint) pasteHint.style.display = 'none';

        const textLines = rawText.split('\n').map(line => line.trim()).filter(line => line);

        const nodes = [];
        textLines.forEach(line => {
            const starMatch = line.match(/^\*+/);
            let level = 0;
            let content = line;

            if (starMatch) {
                const starCount = starMatch[0].length;
                level = starCount - 1;
                content = line.replace(/^\*+/, '').trim();
            }

            const originalContent = content;

            // 处理~包裹的内容，替换为input标签
            const processedContent = content.replace(/~([^~]+)~+/g, (match, placeholderText) => {
                return `<input type="text" data-answer="${placeholderText.trim()}">`;
            });

            level = Math.min(level, 4);
            nodes.push({level, content: processedContent, originalContent: originalContent});
        });

        // 渲染思维导图
        const container = document.getElementById(`mindmap-container-${tabId}`);
        if (!container) return;
        container.innerHTML = '';

        const ul = document.createElement('ul');
        ul.style.paddingLeft = '20px';
        ul.style.listStyle = 'none';
        ul.style.margin = 0;

        nodes.forEach(node => {
            if(node.content === "hr") {
                ul.append(document.createElement("hr"));
            } else {
                const li = document.createElement('li');
                li.className = `mindmap-node node-level-${node.level}`;
                li.innerHTML = node.content;
                li.addEventListener("click", () => {
                    speakText(node.originalContent, false, li);
                });
                ul.appendChild(li);
                const br = document.createElement('br');
                ul.appendChild(br);
            }
        });

        container.appendChild(ul);
        initInputs(tabId);
    }

    function countChineseCharacters(str) {
        // CJK Unified Ideographs Extension B 需要特殊处理
        const chineseRegex = /[\u4e00-\u9fff\u3400-\u4dbf]|[\ud800-\udbff][\udc00-\udfff]/g;
        const matches = str.match(chineseRegex);
        return matches ? matches.length : 0;
    }


    // 初始化输入框功能
    function initInputs(tabId) {
        let initialInputLength = 0;
        const container = document.getElementById(`mindmap-container-${tabId}`);
        if (!container) return;

        container.querySelectorAll('input').forEach((input, index) => {
            if (input.id === "inpInterval" || input.id === "useTTS") return;

            let answer = input.dataset.answer.trim();
            const answerArray = answer.split(" ");
            let len = answerArray.length;

            if (len > 0) {
                let temp = "";
                for (let i = 0; i < answerArray.length; i++) {
                    temp += (answerArray[i].length + " ");
                }
                input.placeholder = temp.trim();
            }

            initialInputLength = input.dataset.len || 0;
            input.dataset.charIndex = "0";
            input.dataset.wordIndex = "0";
            input.value = answer.substring(0, initialInputLength);
            input.dataset.charIndex = String(input.value.length);

            let hanzi = countChineseCharacters(answer)

            const length = answer.length;
            let width = Math.max(length * (length>10?8:10), 40);
            if(hanzi > 2) width += (hanzi * (5))
            width = Math.min(width, 500);

            input.style.width = width + 'px';

            if (index === 0) input.focus();

            // 监听输入事件
            input.addEventListener('input', () => {
                const targetString = answer.toLowerCase();
                const userInput = input.value.toLowerCase();
                input.dataset.charIndex = String(userInput.length);

                // Check for timer pattern (e.g., "1m", "2m", "10m")
                const timerMatch = userInput.match(/^(\d+)m$/);
                if (timerMatch && !input.dataset.timerStarted) {
                    const minutes = parseInt(timerMatch[1], 10);
                    const totalSeconds = minutes * 60;

                    input.dataset.timerStarted = 'true';
                    input.dataset.timerTotalSeconds = totalSeconds;
                    input.dataset.timerOriginal = userInput;
                    input.dataset.timerStartTime = Date.now();
                    input.style.color = "";
                    input.style.background = "";

                    const timerId = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - parseInt(input.dataset.timerStartTime, 10)) / 1000);
                        const remaining = parseInt(input.dataset.timerTotalSeconds, 10) - elapsed;

                        if (remaining <= 0) {
                            // Timer finished
                            clearInterval(timerId);
                            delete inputTimers[input.dataset.timerId];
                            input.value = input.dataset.timerOriginal || '';
                            input.style.color = "";
                            input.style.background = "#ff6666";
                            delete input.dataset.timerStarted;
                            delete input.dataset.timerTotalSeconds;
                            delete input.dataset.timerOriginal;
                            delete input.dataset.timerStartTime;
                            delete input.dataset.timerId;
                            // Play sound
                            const ding = document.getElementById('dingSound');
                            if (ding) ding.play();
                            // Add notification indicator to tab
                            const tabContent = input.closest('.tab-content');
                            if (tabContent) {
                                addTabNotification(tabContent.dataset.tabId);
                            }
                        } else {
                            // Display remaining time as mm:ss
                            const mins = Math.floor(remaining / 60);
                            const secs = remaining % 60;
                            input.value = `${mins}:${secs.toString().padStart(2, '0')}`;
                        }
                    }, 250);

                    input.dataset.timerId = timerId;
                    inputTimers[timerId] = { input, interval: timerId };
                    return;
                }

                if (targetString) {
                    if (userInput.replaceAll(" ", "") === targetString.replaceAll(" ", "")) {
                        input.style.color = 'yellow';
                    } else if (targetString.replaceAll(" ", "").includes(userInput.replaceAll(" ", ""))) {
                        input.style.color = 'green';
                    } else {
                        input.style.color = 'red';
                    }
                }
            });

            input.addEventListener('focus', () => {
                input.dataset.charIndex = String(input.value.length);
                const length = input.value.length;
                input.setSelectionRange(length, length);
            });

            // 点击补字逻辑
            input.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();

                // Clear notification indicator from tab
                const tabContent = input.closest('.tab-content');
                if (tabContent) {
                    clearTabNotification(tabContent.dataset.tabId);
                }

                // Cancel timer if running
                if (input.dataset.timerId) {
                    const timerId = parseInt(input.dataset.timerId, 10);
                    clearInterval(timerId);
                    delete inputTimers[timerId];
                    input.value = '';
                    input.style.color = "#333";
                    input.style.background = "lightgrey";
                    delete input.dataset.timerStarted;
                    delete input.dataset.timerTotalSeconds;
                    delete input.dataset.timerOriginal;
                    delete input.dataset.timerStartTime;
                    delete input.dataset.timerId;
                    return;
                }

                if (document.activeElement === input) {
                    const placeholderValue = answer;

                    if (event.shiftKey && event.ctrlKey && event.altKey) {
                        // Ctrl+Shift+Alt: start 10m timer
                        startTimerForInput(input, 10);
                    } else if (event.shiftKey && event.ctrlKey) {
                        container.querySelectorAll('input').forEach(input => {
                            if (input.id === "inpInterval" || input.id === "useTTS") return;
                            input.value = "";
                            input.dataset.charIndex = "0";
                            input.dataset.wordIndex = "0";
                            input.style.color = "#333";
                            input.style.background = "lightgrey";
                        });
                    } else if (event.ctrlKey && event.altKey) {
                        // Ctrl+Alt: start 2m timer
                        startTimerForInput(input, 2);
                    } else if (event.shiftKey) {
                        container.querySelectorAll('input').forEach(input => {
                            if (input.id === "inpInterval" || input.id === "useTTS") return;
                            input.value = input.dataset.answer;
                            input.dataset.charIndex = String(input.dataset.answer.length);
                            input.style.color = 'yellow';
                            input.style.background = '#666';
                        });
                    } else if (event.altKey) {
                        // Alt+click only focuses, no other action
                        return;
                    } else if (event.ctrlKey) {
                        input.value = "";
                        input.dataset.charIndex = "0";
                        input.dataset.wordIndex = "0";
                        input.style.color = "#333";
                        input.style.background = "lightgrey";
                    } else {
                        // Show full answer at once
                        input.value = input.dataset.answer;
                        input.dataset.charIndex = String(input.dataset.answer.length);
                        input.style.color = 'yellow';
                        input.style.background = '#666';
                    }
                }
            });

            // 键盘逻辑
            input.addEventListener('keydown', (event) => {
                if (document.activeElement === input) {
                    if (event.key === '`') {
                        event.preventDefault();
                        const placeholderValue = answer;
                        let charIndex = parseInt(input.dataset.charIndex, 10);

                        if (placeholderValue && charIndex < placeholderValue.length) {
                            input.value += placeholderValue.charAt(charIndex);
                            charIndex++;
                            input.dataset.charIndex = String(charIndex);

                            if (input.value.replaceAll(" ", "") === placeholderValue.replaceAll(" ", "")) {
                                input.style.color = 'yellow';
                                speakText(input.value, true);
                            }
                        }
                    } else if (event.key === 'F4') {
                        container.querySelectorAll('input').forEach(input => {
                            if (input.id === "inpInterval" || input.id === "useTTS") return;
                            input.value = input.dataset.answer.substring(0, initialInputLength);
                        });
                    } else if (event.key === 'F3') {
                        input.blur();
                    } else if (event.key === 'F2') {
                        const placeholderValue = answer;
                        input.value = placeholderValue;
                        input.dataset.charIndex = String(placeholderValue.length);
                        input.style.color = 'yellow';
                    } else if (event.key === 'F6') {
                        container.querySelectorAll('input').forEach(input => {
                            if (input.id === "inpInterval" || input.id === "useTTS") return;
                            input.value = input.dataset.answer;
                            input.dataset.charIndex = String(input.dataset.answer.length);
                            input.style.color = 'yellow';
                        });
                    }
                }
            });
        });
    }

    // 监听全局Ctrl+V粘贴事件
    document.addEventListener('keydown', async (e) => {
        // Skip if user is typing in an input field
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag === 'input' || activeTag === 'textarea') {
            return;
        }

        if (e.ctrlKey && e.key === 'v') {
            e.preventDefault();

            if (!activeTabId) return;

            try {
                const clipboardText = await navigator.clipboard.readText();
                if (clipboardText.trim()) {
                    document.getElementById('source-text').innerHTML = clipboardText.trim();
                    initMindmap(activeTabId);
                } else {
                    alert('剪贴板为空，请复制内容后再粘贴！');
                }
            } catch (err) {
                console.error('读取剪贴板失败:', err);
                alert('无法访问剪贴板，请确保浏览器权限已开启！');
            }
        }
    });

    // 兼容处理：如果浏览器不支持navigator.clipboard
    if (!navigator.clipboard) {
        console.warn('当前浏览器不支持Clipboard API，将使用备选方案');
        const hiddenInput = document.createElement('input');
        hiddenInput.style.position = 'fixed';
        hiddenInput.style.opacity = '0';
        hiddenInput.style.zIndex = '-1000';
        document.body.appendChild(hiddenInput);

        document.addEventListener('keydown', (e) => {
            if (activeTag === 'input' || activeTag === 'textarea') return;

            if (e.ctrlKey && e.key === 'v') {
                e.preventDefault();
                hiddenInput.focus();
                setTimeout(() => {
                    if (hiddenInput.value.trim()) {
                        document.getElementById('source-text').innerHTML = hiddenInput.value.trim();
                        initMindmap(activeTabId);
                        hiddenInput.value = '';
                    } else {
                        alert('剪贴板为空，请复制内容后再粘贴！');
                    }
                }, 100);
            }
        });
    }

    // Initialize with one tab
    addNewTab();
</script>
</body>
