<div style="display: flex;flex-direction: column">
    <div style="height: 90vh;overflow:auto; display: flex;justify-items: center;align-items: center;padding-left:20%;padding-right:20%;">
        <div class="contentS" style="margin-left: auto;margin-right: auto;">
            <h2 id="front"
                style="cursor: pointer;text-align: center;line-height:1.5;font-family:Tahoma;margin-left: 0%;margin-right: 0%;color:#bed742;font-weight:bold;margin-top:-20px;margin-bottom:20px">
                {{Front}}<span style="color: lightblue" id="tag">{{Tag}}</span></h2>
            <div style="font-size:20px;line-height:2;font-family: STSong;"  id="answer">{{DetailedExp}}</div>
            <div class="word" style="font-size:14px;line-height:1.0;display:none;font-family:Tahoma" id="rawAnswer">{{Answer}}</div>
            <div style="display: flex">
                <div style="flex: auto">
                    <div style="text-align: left;line-height:1.1;cursor: pointer;font-family:Tahoma;font-size:14px;padding: 6px 0" id="answer1"  class="word">{{Answer}}</div>
                </div>
            </div>
            <div style="font-size: 15px;cursor: pointer" onclick="speakText(this.textContent.trim())">{{Explanation}}</div>
            <div>{{Audio}}</div>
        </div>
    </div>
</div>

<style>
    /* ===== 核心容器 #answer =====
         深色玻璃质感 · 无动画/过渡/变换 */
    #answer {
        width:75%;
        min-width:600px;
        margin-left: auto;
        margin-right: auto;
        background: rgba(18, 28, 40, 0.78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: #16222e;
        background: linear-gradient(145deg, #1b2a3a 0%, #14212e 100%);
        border-radius: 8px;
        padding: 1rem 1rem;
        box-shadow:
                0 12px 12px -12px rgba(0, 0, 0, 0.8),
                0 8px 20px -6px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 -1px 0 rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        /* 移除所有 transition 和 transform */
    }

    /* 内部文字继承 */
    #answer * {
        font-family: inherit;
    }

    /* ----- 段落 & 文本 ----- */
    #answer p {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #d6e3f0;
        letter-spacing: 0.01em;
        margin: 0 0 1.2rem 0;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    #answer p:last-child {
        margin-bottom: 0;
    }

    /* ===== 深色华美 blockquote =====
         冷光边框 + 渐变背景 + 发光引号 · 无动画 */
    #answer blockquote {
        position: relative;
        margin: 1rem 0 1rem 0;
        padding: 2rem 1rem 1.5rem 1rem;
        background: linear-gradient(145deg, #1f3142 0%, #172636 100%);
        border-radius: 28px 8px 28px 8px;
        border-left: 6px solid #4b8cff;
        box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                0 8px 20px -8px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(75, 140, 255, 0.06);
        color: #dce8f5;
        font-size: 0.8rem;
        line-height: 1.7;
        /* 移除所有 transition */
    }

    /* 装饰引号 — 冷色发光 */
    #answer blockquote::before {
        content: '\201C';
        position: absolute;
        left: 0.8rem;
        top: -0.2rem;
        font-size: 4.6rem;
        font-family: 'Georgia', 'Times New Roman', serif;
        color: #4b8cff;
        opacity: 0.20;
        text-shadow: 0 0 18px rgba(75, 140, 255, 0.15);
        line-height: 1;
        pointer-events: none;
    }

    #answer blockquote::after {
        content: '\201D';
        position: absolute;
        bottom: -0.4rem;
        right: 1.2rem;
        font-size: 3.8rem;
        font-family: 'Georgia', 'Times New Roman', serif;
        color: #4b8cff;
        opacity: 0.12;
        text-shadow: 0 0 16px rgba(75, 140, 255, 0.10);
        transform: rotate(4deg);
        pointer-events: none;
        line-height: 1;
        background: none;
        width: auto;
        height: auto;
        border-radius: 0;
    }

    /* blockquote 内部段落 */
    #answer blockquote p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: #dce8f5;
        margin: 0 0 0.6rem 0;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    #answer blockquote p:last-child {
        margin-bottom: 0;
    }

    /* 强调色 */
    #answer blockquote strong,
    #answer blockquote em {
        color: #7aafff;
        font-weight: 600;
    }

    /* 引用来源 (footer / cite) */
    #answer blockquote footer,
    #answer blockquote cite {
        display: block;
        margin-top: 0.8rem;
        font-size: 0.9rem;
        font-style: normal;
        color: #8aa9cc;
        text-align: right;
        opacity: 0.8;
        letter-spacing: 0.02em;
        border-top: 1px solid rgba(75, 140, 255, 0.10);
        padding-top: 0.6rem;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* 相邻元素间距 */
    #answer blockquote + p {
        margin-top: 1.6rem;
    }

    /* 滚动条 (深色适配) */
    #answer ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    #answer ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
    }
    #answer ::-webkit-scrollbar-thumb {
        background: #2d4a6a;
        border-radius: 12px;
    }
    #answer ::-webkit-scrollbar-thumb:hover {
        background: #3f6a92;
    }

    /* ===== 顶部装饰线 (静态) ===== */
    #answer::before {
        content: '';
        display: block;
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, #4b8cff, #7ab0ff);
        border-radius: 8px;
        margin-bottom: 1.6rem;
        opacity: 0.5;
        box-shadow: 0 0 12px rgba(75, 140, 255, 0.15);
        /* 移除 transition */
    }

    /* 首尾元素边距重置 */
    #answer > :first-child {
        margin-top: 0;
    }
    #answer > :last-child {
        margin-bottom: 0;
    }

    /* blockquote 内微光 */
    #answer blockquote {
        background-image:
                radial-gradient(circle at 10% 20%, rgba(75, 140, 255, 0.04) 0%, transparent 40%),
                linear-gradient(145deg, #1f3142 0%, #172636 100%);
    }

    /* code 标签深色适配 */
    #answer code {
        background: rgba(75, 140, 255, 0.08);
        padding: 0.2rem 0.5rem;
        border-radius: 12px;
        font-size: 0.9em;
        color: #8fc4ff;
        border: 1px solid rgba(75, 140, 255, 0.10);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

</style>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

<script>
    document.getElementById("answer").innerHTML =  document.getElementById("answer")
        .innerHTML.replaceAll("({", " <small>").replaceAll("})", "</small> ").replaceAll("。", "。<br>")
    document.getElementById("answer1").innerHTML = document.getElementById("answer1").innerHTML.replaceAll("<hr>", "<br>")
        .replaceAll("[{", "<b>").replaceAll("}]", "</b>").replaceAll("~~", "</b>").replaceAll("~", "<b>").replaceAll(". ", ".<br>")

    document.getElementById("answer").innerHTML = document.getElementById("answer").innerHTML
        .replaceAll("~~", "</big>")
        .replaceAll("~", "<big>")
        .replaceAll(">-", ">")
        .replaceAll("；", "<br>")
        .replace(/[（(]/g, '<small>')
        .replace(/[）)]/g, '</small>')

    document.getElementById("front").addEventListener("click", (e) => {
        let text = document.getElementById("front").textContent.replaceAll("~", "").replaceAll("(", "").replaceAll(")", "")

        let content = document.getElementById("rawAnswer").textContent.trim()
        if(!content.includes("~~")){
            content = "~"+content+"~~"
        }
        copyToClipboard(text.trim()+"|"+content.trim()+"|")//
    })

    function copyToClipboard(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand("copy");
            console.log("Copied to clipboard");
        } catch (err) {
            console.error("Failed to copy:", err);
        }
        document.body.removeChild(textarea);
    }

    function speakText(text, isEn = false) {
        if (!text) return;

        // 停止当前播放（防止堆积）
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            return;
        }

        const filteredText = text // filterText(text);
        const utterance = new SpeechSynthesisUtterance(filteredText);
        utterance.rate = isEn ? 3 : 1.5;

        function findVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v =>
                v.name === (isEn ? "Microsoft David - English (United States)" : "Microsoft Yaoyao - Chinese (Simplified, PRC)") &&
                v.lang === (isEn ? "en-US" : "zh-CN")
            );
        }

        // 尝试找到指定语音
        let voice = findVoice();
        if (voice) {
            utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        } else {
            // 等待语音加载
            window.speechSynthesis.onvoiceschanged = () => {
                voice = findVoice();
                utterance.voice = voice || null;
                utterance.lang = voice ? voice.lang : "zh-CN";
                window.speechSynthesis.speak(utterance);
                // 移除监听器，防止多次触发
                window.speechSynthesis.onvoiceschanged = null;
            };
        }
    }

    hljs.highlightAll();
</script>
