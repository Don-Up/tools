<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        ruby.ruby-wrap {
            position: relative;
            display: inline-block;
            cursor: help;
            border-bottom: 1px dashed #999;
        }

        #global-tip {
            position: fixed;
            background: #222;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 260px;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
            opacity: 0;
            visibility: hidden;
            transition: opacity .15s;
            pointer-events: none;
            z-index: 9999;
        }
        #global-tip.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

<ruby class="ruby-wrap"
      data-tip="<b>staples</b><br>n. 订书钉；主要产品<br>音标：/ˈsteɪplz/">
    staples<rt>ˈsteɪplz</rt>
</ruby>

&nbsp;&nbsp;

<ruby class="ruby-wrap"
      data-tip="<b>apple</b><br>n. 苹果<br>音标：/ˈæp.əl/">
    apple<rt>ˈæp.əl</rt>
</ruby>

&nbsp;&nbsp;

<ruby class="ruby-wrap"
      data-tip="<b>computer</b><br>n. 计算机<br>音标：/kəmˈpjuː.tər/">
    computer<rt>kəmˈpjuː.tər</rt>
</ruby>

<div id="global-tip"></div>

<script>
    const tip = document.getElementById('global-tip');

    document.querySelectorAll('ruby.ruby-wrap').forEach(el => {
        el.addEventListener('mouseenter', () => {
            tip.innerHTML = el.dataset.tip;
            tip.classList.add('show');
            positionTip(el);
        });

        el.addEventListener('mousemove', () => {
            positionTip(el);
        });

        el.addEventListener('mouseleave', () => {
            tip.classList.remove('show');
        });
    });

    function positionTip(target) {
        const rect = target.getBoundingClientRect();
        const tipRect = tip.getBoundingClientRect();

        let left = rect.left + rect.width / 2 - tipRect.width / 2;
        let top = rect.top - tipRect.height - 10;

        // 防止超出左右边界
        left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));

        // 上方空间不够时显示在下方
        if (top < 8) {
            top = rect.bottom + 10;
        }

        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
    }
</script>

</body>
</html>
