<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-class</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
        }

        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: auto;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 16px;
            text-align: left;
            white-space: pre-wrap;
            max-width: 80%;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 16px 20px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .mermaid-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .mermaid-container > svg {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
        }

        .full-layout {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .class-box {
            flex-shrink: 0;
            display: inline-block;
            min-width: 384px;
            max-width: min(1152px, 92vw);
            background: #252525;
            border: 3px solid #4fc3f7;
            border-radius: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #e0e0e0;
        }

        .class-box-header {
            padding: 22px 34px 17px;
            text-align: center;
            border-bottom: 1px solid #4fc3f7;
        }

        .class-box-title {
            font-size: 34px;
            font-weight: 700;
            color: #e0e0e0;
            word-break: break-word;
        }

        .class-box-stereotype {
            font-size: 19px;
            font-style: italic;
            color: #b0bec5;
            margin-top: 10px;
        }

        .class-box-members {
            padding: 8px 0;
        }

        .class-box-item {
            padding: 14px 34px;
        }

        .class-box-item + .class-box-item {
            border-top: 1px dashed #3a3a3a;
        }

        .class-box-member {
            font-size: 24px;
            color: #ff9800;
            font-weight: 600;
            word-break: break-word;
        }

        .class-box-brief {
            font-size: 22px;
            color: #ffffff;
            margin-top: 7px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 4px;
            padding: 2px 4px;
            margin-left: -4px;
            margin-right: -4px;
        }

        .class-box-brief:hover {
            background: rgba(79, 195, 247, 0.12);
        }

        .class-box-brief:active {
            background: rgba(79, 195, 247, 0.2);
        }

        .class-box-example {
            font-size: 22px;
            font-style: italic;
            color: #9e9e9e;
            margin-top: 7px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .class-box-empty {
            padding: 22px 34px;
            color: #888;
            font-style: italic;
            font-size: 22px;
        }

        .status {
            position: fixed;
            bottom: 16px;
            right: 20px;
            color: #666;
            font-size: 13px;
            font-family: 'Consolas', 'Monaco', monospace;
            pointer-events: none;
        }

        #closeBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            padding: 0;
            background: rgba(40, 40, 40, 0.85);
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            display: none;
            z-index: 100;
            font-family: inherit;
        }
        #closeBtn:hover {
            background: rgba(60, 60, 60, 0.95);
            color: #fff;
            border-color: #00BFFF;
        }
        #closeBtn.visible { display: block; }

        #ttsPanel {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 12px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 6px;
            min-width: 240px;
        }

        #ttsPanel.visible { display: flex; }

        .tts-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tts-row label {
            color: #888;
            font-size: 12px;
            min-width: 36px;
        }

        .tts-row select {
            flex: 1;
            background: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            padding: 2px 4px;
            min-width: 0;
        }

        .tts-row input[type="range"] {
            flex: 1;
            accent-color: #4fc3f7;
            min-width: 0;
        }

        #ttsRateValue {
            color: #b0bec5;
            font-size: 12px;
            min-width: 36px;
            text-align: right;
            font-family: 'Consolas', 'Monaco', monospace;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <button id="closeBtn" title="Close">×</button>
    <div id="ttsPanel">
        <div class="tts-row">
            <label for="ttsVoice">语音</label>
            <select id="ttsVoice"></select>
        </div>
        <div class="tts-row">
            <label for="ttsRate">速度</label>
            <input id="ttsRate" type="range" min="0.5" max="2.0" step="0.1" value="1.0">
            <span id="ttsRateValue">1.0x</span>
        </div>
    </div>
    <div class="stage" id="stage">
        <div class="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴(单 class)<br>按 <kbd>Alt</kbd> + <kbd>V</kbd> 粘贴(带邻居)<br>按 <kbd>V</kbd> 切换模式</div>
    </div>
    <div class="status" id="status"></div>

    <script>
        const stage = document.getElementById('stage');
        const status = document.getElementById('status');
        const closeBtn = document.getElementById('closeBtn');
        const ttsPanel = document.getElementById('ttsPanel');
        const ttsVoiceSelect = document.getElementById('ttsVoice');
        const ttsRateInput = document.getElementById('ttsRate');
        const ttsRateValue = document.getElementById('ttsRateValue');

        let ttsVoices = [];
        let ttsSelectedURI = '';

        const TTS_STORAGE_VOICE = 'focus-class.tts.voiceURI';
        const TTS_STORAGE_RATE = 'focus-class.tts.rate';

        function loadTtsSettings() {
            try {
                const uri = localStorage.getItem(TTS_STORAGE_VOICE);
                if (uri) ttsSelectedURI = uri;
                const rateStr = localStorage.getItem(TTS_STORAGE_RATE);
                if (rateStr) {
                    const rate = parseFloat(rateStr);
                    if (isFinite(rate) && rate >= 0.5 && rate <= 2.0) {
                        ttsRateInput.value = String(rate);
                        ttsRateValue.textContent = `${rate.toFixed(1)}x`;
                    }
                }
            } catch (_) { /* localStorage may be unavailable */ }
        }

        function saveTtsSettings() {
            try {
                localStorage.setItem(TTS_STORAGE_VOICE, ttsSelectedURI);
                localStorage.setItem(TTS_STORAGE_RATE, ttsRateInput.value);
            } catch (_) { /* ignore quota / disabled */ }
        }

        function refreshTtsVoices() {
            ttsVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            if (ttsVoices.length === 0) return; // voices not loaded yet; onvoiceschanged will retry
            ttsVoiceSelect.innerHTML = '';
            let defaultURI = '';
            if (ttsSelectedURI && ttsVoices.some(v => v.voiceURI === ttsSelectedURI)) {
                defaultURI = ttsSelectedURI;
            } else {
                const zh = ttsVoices.find(v => /^zh/i.test(v.lang));
                defaultURI = zh ? zh.voiceURI : (ttsVoices[0] && ttsVoices[0].voiceURI);
            }
            for (const v of ttsVoices) {
                const opt = document.createElement('option');
                opt.value = v.voiceURI;
                opt.textContent = `${v.name} (${v.lang})`;
                if (v.voiceURI === defaultURI) opt.selected = true;
                ttsVoiceSelect.appendChild(opt);
            }
            ttsSelectedURI = defaultURI;
        }

        function speakText(text) {
            if (!window.speechSynthesis || !text) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            const voice = ttsVoices.find(v => v.voiceURI === ttsSelectedURI);
            if (voice) {
                utter.voice = voice;
                utter.lang = voice.lang;
            }
            const rate = parseFloat(ttsRateInput.value);
            utter.rate = isFinite(rate) ? rate : 1.0;
            window.speechSynthesis.speak(utter);
        }

        if (window.speechSynthesis) {
            loadTtsSettings();
            refreshTtsVoices();
            window.speechSynthesis.onvoiceschanged = refreshTtsVoices;
            ttsVoiceSelect.addEventListener('change', () => {
                ttsSelectedURI = ttsVoiceSelect.value;
                saveTtsSettings();
            });
            ttsRateInput.addEventListener('input', () => {
                const rate = parseFloat(ttsRateInput.value);
                ttsRateValue.textContent = `${rate.toFixed(1)}x`;
                saveTtsSettings();
            });
        }

        function parseClassDiagram(text) {
            const lines = text.split('\n');
            const classes = [];
            const edges = [];
            const classByName = new Map();
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                // Skip directives and blanks.
                if (!trimmed || trimmed === 'classDiagram') {
                    i += 1;
                    continue;
                }

                // Class header: `class Foo["Foo (desc)"] {`
                const classHeaderMatch = line.match(/^\s*class\s+([A-Za-z_][\w]*)\s*(\[.*\])?\s*\{\s*$/);
                if (classHeaderMatch) {
                    const name = classHeaderMatch[1];
                    const display = classHeaderMatch[2] || '';
                    const bodyLines = [];
                    i += 1;
                    while (i < lines.length && !/^\s*\}\s*$/.test(lines[i])) {
                        bodyLines.push(lines[i]);
                        i += 1;
                    }
                    // skip the closing `}`
                    if (i < lines.length) i += 1;
                    const entry = { name, display, body: bodyLines.join('\n') };
                    classes.push(entry);
                    classByName.set(name, entry);
                    continue;
                }

                // Relationship line — any line containing an arrow token.
                if (/-->|\.\.>/.test(line)) {
                    // Extract: <from> <arrow> <to> [": label"]
                    const relMatch = line.match(/^\s*([A-Za-z_][\w]*)\s+(--\|>|--\>|-->|\.\.>|\.\.|\.\.\|>)\s+([A-Za-z_][\w]*)\s*(?::\s*(.*?))?\s*$/);
                    if (relMatch) {
                        const [, from, arrow, to, label] = relMatch;
                        edges.push({ from, arrow, to, label: (label || '').trim() });
                    }
                    i += 1;
                    continue;
                }

                // Anything else (comments, etc): skip.
                i += 1;
            }

            return { classes, edges, classByName };
        }

        let model = null;
        let currentIndex = 0;
        let renderCounter = 0;
        let latestRenderId = 0;
        let viewMode = 'with-neighbors';
        let currentMemberBriefs = [];

        function buildClassSource(model, index) {
            const target = model.classes[index];
            if (!target) return '';
            const incidentClassNames = new Set([target.name]);
            const incidentEdges = [];
            for (const e of model.edges) {
                const fromExists = model.classByName.has(e.from);
                const toExists = model.classByName.has(e.to);
                if (!fromExists || !toExists) continue;
                if (e.from === target.name || e.to === target.name) {
                    incidentEdges.push(e);
                    incidentClassNames.add(e.from);
                    incidentClassNames.add(e.to);
                }
            }

            const lines = ['classDiagram', '  direction LR'];
            for (const c of model.classes) {
                if (!incidentClassNames.has(c.name)) continue;
                if (c.display) {
                    lines.push(`  class ${c.name}${c.display} {`);
                } else {
                    lines.push(`  class ${c.name} {`);
                }
                if (c.body) {
                    for (const bl of c.body.split('\n')) lines.push(`    ${bl}`);
                }
                lines.push('  }');
            }
            for (const e of incidentEdges) {
                const labelPart = e.label ? ` : ${e.label}` : '';
                lines.push(`  ${e.from} ${e.arrow} ${e.to}${labelPart}`);
            }
            return lines.join('\n');
        }

        function isStereotypeLine(text) {
            return /^<<.+>>$/.test(text);
        }

        function extractDisplayName(display) {
            if (!display) return null;
            const m = display.match(/^\["([\s\S]+)"\]$/);
            return m ? m[1] : null;
        }

        function parseClassForRender(body) {
            const result = { stereotype: null, members: [] };
            if (!body) return result;
            let pendingBrief = null;
            let pendingExample = null;
            for (const rawLine of body.split('\n')) {
                const line = rawLine.replace(/\s+$/, '');
                if (!line) continue;
                const ann = line.match(/^\s*%%\s*(\{[\s\S]*\})\s*$/);
                if (ann) {
                    try {
                        const obj = JSON.parse(ann[1]);
                        if (obj && typeof obj === 'object') {
                            if (typeof obj.brief === 'string') pendingBrief = obj.brief;
                            if (typeof obj.example === 'string') pendingExample = obj.example;
                        }
                    } catch (_) { /* ignore malformed JSON */ }
                    continue;
                }
                const trimmed = line.trim();
                if (isStereotypeLine(trimmed)) {
                    if (!result.stereotype) {
                        const m = trimmed.match(/^<<([\s\S]+)>>$/);
                        if (m) result.stereotype = m[1];
                    }
                    pendingBrief = null;
                    pendingExample = null;
                    continue;
                }
                result.members.push({
                    text: trimmed,
                    brief: pendingBrief,
                    example: pendingExample,
                });
                pendingBrief = null;
                pendingExample = null;
            }
            return result;
        }

        function buildClassBox(target) {
            const { stereotype, members } = parseClassForRender(target.body);
            const title = extractDisplayName(target.display) || target.name;

            const box = document.createElement('div');
            box.className = 'class-box';

            const header = document.createElement('div');
            header.className = 'class-box-header';
            const titleEl = document.createElement('div');
            titleEl.className = 'class-box-title';
            titleEl.textContent = title;
            header.appendChild(titleEl);
            if (stereotype) {
                const stEl = document.createElement('div');
                stEl.className = 'class-box-stereotype';
                stEl.textContent = `<<${stereotype}>>`;
                header.appendChild(stEl);
            }
            box.appendChild(header);

            if (members.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'class-box-empty';
                empty.textContent = '(无成员)';
                box.appendChild(empty);
                return box;
            }

            const memberList = document.createElement('div');
            memberList.className = 'class-box-members';
            for (const m of members) {
                const item = document.createElement('div');
                item.className = 'class-box-item';
                const textEl = document.createElement('div');
                textEl.className = 'class-box-member';
                textEl.textContent = m.text;
                item.appendChild(textEl);
                if (m.brief) {
                    const b = document.createElement('div');
                    b.className = 'class-box-brief';
                    b.textContent = m.brief;
                    b.title = '点击朗读';
                    b.addEventListener('click', () => speakText(m.brief));
                    item.appendChild(b);
                }
                if (m.example) {
                    const ex = document.createElement('div');
                    ex.className = 'class-box-example';
                    ex.textContent = m.example;
                    item.appendChild(ex);
                }
                memberList.appendChild(item);
            }
            box.appendChild(memberList);
            return box;
        }

        if (window.mermaid) {
            window.mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'strict',
                themeVariables: {
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    background: '#1e1e1e',
                    primaryColor: '#252525',
                    primaryTextColor: '#e0e0e0',
                    primaryBorderColor: '#4fc3f7',
                    lineColor: '#81c784',
                    secondaryColor: '#2c2c2c',
                    tertiaryColor: '#1e1e1e',
                },
            });
        }

        function showHint() {
            latestRenderId = 'mermaid-' + (++renderCounter);
            stage.innerHTML = '';
            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.innerHTML = '按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴(单 class)<br>按 <kbd>Alt</kbd> + <kbd>V</kbd> 粘贴(带邻居)<br>按 <kbd>V</kbd> 切换模式';
            stage.appendChild(hint);
            status.textContent = '';
            model = null;
            currentIndex = 0;
        }

        function showError(msg) {
            latestRenderId = 'mermaid-' + (++renderCounter);
            stage.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = msg;
            stage.appendChild(err);
            status.textContent = '';
        }

        async function renderCurrent() {
            if (!model) return;
            const target = model.classes[currentIndex];
            if (!target) return;
            const myId = 'mermaid-' + (++renderCounter);
            latestRenderId = myId;
            const focusedOnly = viewMode === 'focused-only';

            currentMemberBriefs = parseClassForRender(target.body).members;

            if (focusedOnly) {
                stage.innerHTML = '';
                stage.appendChild(buildClassBox(target));
                status.textContent = `${currentIndex + 1} / ${model.classes.length} · ${target.name} · 单`;
                return;
            }

            const source = buildClassSource(model, currentIndex);
            try {
                const result = await window.mermaid.render(myId, source);
                if (myId !== latestRenderId) return; // a newer render started
                const svg = typeof result === 'string' ? result : result.svg;
                stage.innerHTML = '';
                const layout = document.createElement('div');
                layout.className = 'full-layout';
                const container = document.createElement('div');
                container.className = 'mermaid-container';
                container.innerHTML = svg;
                layout.appendChild(container);
                stage.appendChild(layout);
                status.textContent = `${currentIndex + 1} / ${model.classes.length} · ${target.name}`;
            } catch (err) {
                if (myId !== latestRenderId) return;
                const message = (err && (err.message || err.str || err.toString())) || '未知错误';
                showError('mermaid 语法错误:\n\n' + message);
            }
        }

        function loadAndRender(text, mode) {
            if (!text) return;
            if (!window.mermaid) {
                showError('mermaid.js 未加载,请检查网络');
                return;
            }
            const parsed = parseClassDiagram(text);
            if (parsed.classes.length === 0) {
                showError('未找到任何 class 定义');
                return;
            }
            model = parsed;
            currentIndex = 0;
            if (mode) viewMode = mode;
            renderCurrent();
        }

        function step(delta) {
            if (!model || model.classes.length === 0) return;
            const n = model.classes.length;
            currentIndex = (currentIndex + delta + n) % n;
            renderCurrent();
        }

        document.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            const mode = e.altKey ? 'with-neighbors' : 'focused-only';
            loadAndRender(text.trim(), mode);
        });

        document.addEventListener('keydown', (e) => {
            if (e.altKey && (e.key === 'h' || e.key === 'H')) {
                e.preventDefault();
                ttsPanel.classList.toggle('visible');
                return;
            }
            if (e.key === 'Escape') {
                showHint();
                return;
            }
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                step(+1);
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                step(-1);
                return;
            }
            if (!e.altKey && !e.ctrlKey && !e.metaKey && /^[1-9]$/.test(e.key)) {
                if (!model) return;
                const member = currentMemberBriefs[parseInt(e.key, 10) - 1];
                if (member && member.brief) {
                    e.preventDefault();
                    speakText(member.brief);
                }
                return;
            }
            if (!e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'v' || e.key === 'V')) {
                e.preventDefault();
                if (!model) return;
                if (viewMode === 'focused-only') {
                    viewMode = 'with-neighbors';
                    status.textContent = '已切换到带邻居模式';
                } else {
                    viewMode = 'focused-only';
                    status.textContent = '已切换到单 class 模式';
                }
                renderCurrent();
            }
        });

        closeBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'focus-class-close' }, '*');
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type !== 'focus-class-load') return;
            if (typeof data.content !== 'string' || !data.content) return;
            loadAndRender(data.content.trim());
            closeBtn.classList.add('visible');
        });
    </script>
</body>
</html>
