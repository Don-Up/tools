<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-class</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
        }

        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 16px;
            text-align: left;
            white-space: pre-wrap;
            max-width: 80%;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 16px 20px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .mermaid-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .mermaid-container > svg {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
        }

        .status {
            position: fixed;
            bottom: 16px;
            right: 20px;
            color: #666;
            font-size: 13px;
            font-family: 'Consolas', 'Monaco', monospace;
            pointer-events: none;
        }

        #closeBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            padding: 0;
            background: rgba(40, 40, 40, 0.85);
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            display: none;
            z-index: 100;
            font-family: inherit;
        }
        #closeBtn:hover {
            background: rgba(60, 60, 60, 0.95);
            color: #fff;
            border-color: #00BFFF;
        }
        #closeBtn.visible { display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <button id="closeBtn" title="Close">×</button>
    <div class="stage" id="stage">
        <div class="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴(带邻居)<br>按 <kbd>Alt</kbd> + <kbd>V</kbd> 粘贴(单 class)</div>
    </div>
    <div class="status" id="status"></div>

    <script>
        const stage = document.getElementById('stage');
        const status = document.getElementById('status');
        const closeBtn = document.getElementById('closeBtn');

        function parseClassDiagram(text) {
            const lines = text.split('\n');
            const classes = [];
            const edges = [];
            const classByName = new Map();
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                // Skip directives and blanks.
                if (!trimmed || trimmed === 'classDiagram') {
                    i += 1;
                    continue;
                }

                // Class header: `class Foo["Foo (desc)"] {`
                const classHeaderMatch = line.match(/^\s*class\s+([A-Za-z_][\w]*)\s*(\[.*\])?\s*\{\s*$/);
                if (classHeaderMatch) {
                    const name = classHeaderMatch[1];
                    const display = classHeaderMatch[2] || '';
                    const bodyLines = [];
                    i += 1;
                    while (i < lines.length && !/^\s*\}\s*$/.test(lines[i])) {
                        bodyLines.push(lines[i]);
                        i += 1;
                    }
                    // skip the closing `}`
                    if (i < lines.length) i += 1;
                    const entry = { name, display, body: bodyLines.join('\n') };
                    classes.push(entry);
                    classByName.set(name, entry);
                    continue;
                }

                // Relationship line — any line containing an arrow token.
                if (/-->|\.\.>/.test(line)) {
                    // Extract: <from> <arrow> <to> [": label"]
                    const relMatch = line.match(/^\s*([A-Za-z_][\w]*)\s+(--\|>|--\>|-->|\.\.>|\.\.|\.\.\|>)\s+([A-Za-z_][\w]*)\s*(?::\s*(.*?))?\s*$/);
                    if (relMatch) {
                        const [, from, arrow, to, label] = relMatch;
                        edges.push({ from, arrow, to, label: (label || '').trim() });
                    }
                    i += 1;
                    continue;
                }

                // Anything else (comments, etc): skip.
                i += 1;
            }

            return { classes, edges, classByName };
        }

        let model = null;
        let currentIndex = 0;
        let renderCounter = 0;
        let latestRenderId = 0;
        let viewMode = 'with-neighbors';

        function buildClassSource(model, index) {
            const target = model.classes[index];
            if (!target) return '';
            const incidentClassNames = new Set([target.name]);
            const incidentEdges = [];
            for (const e of model.edges) {
                const fromExists = model.classByName.has(e.from);
                const toExists = model.classByName.has(e.to);
                if (!fromExists || !toExists) continue;
                if (e.from === target.name || e.to === target.name) {
                    incidentEdges.push(e);
                    incidentClassNames.add(e.from);
                    incidentClassNames.add(e.to);
                }
            }

            const lines = ['classDiagram', '  direction LR'];
            for (const c of model.classes) {
                if (!incidentClassNames.has(c.name)) continue;
                if (c.display) {
                    lines.push(`  class ${c.name}${c.display} {`);
                } else {
                    lines.push(`  class ${c.name} {`);
                }
                if (c.body) {
                    for (const bl of c.body.split('\n')) lines.push(`    ${bl}`);
                }
                lines.push('  }');
            }
            for (const e of incidentEdges) {
                const labelPart = e.label ? ` : ${e.label}` : '';
                lines.push(`  ${e.from} ${e.arrow} ${e.to}${labelPart}`);
            }
            return lines.join('\n');
        }

        function buildFocusedClassOnlySource(model, index) {
            const target = model.classes[index];
            if (!target) return '';
            const lines = ['classDiagram', '  direction LR'];
            if (target.display) {
                lines.push(`  class ${target.name}${target.display} {`);
            } else {
                lines.push(`  class ${target.name} {`);
            }
            if (target.body) {
                for (const bl of target.body.split('\n')) lines.push(`    ${bl}`);
            }
            lines.push('  }');
            return lines.join('\n');
        }

        if (window.mermaid) {
            window.mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'strict',
                themeVariables: {
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    background: '#1e1e1e',
                    primaryColor: '#252525',
                    primaryTextColor: '#e0e0e0',
                    primaryBorderColor: '#4fc3f7',
                    lineColor: '#81c784',
                    secondaryColor: '#2c2c2c',
                    tertiaryColor: '#1e1e1e',
                },
            });
        }

        function showHint() {
            latestRenderId = 'mermaid-' + (++renderCounter);
            stage.innerHTML = '';
            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.innerHTML = '按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴(带邻居)<br>按 <kbd>Alt</kbd> + <kbd>V</kbd> 粘贴(单 class)';
            stage.appendChild(hint);
            status.textContent = '';
            model = null;
            currentIndex = 0;
        }

        function showError(msg) {
            latestRenderId = 'mermaid-' + (++renderCounter);
            stage.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = msg;
            stage.appendChild(err);
            status.textContent = '';
        }

        async function renderCurrent() {
            if (!model) return;
            const target = model.classes[currentIndex];
            if (!target) return;
            const myId = 'mermaid-' + (++renderCounter);
            latestRenderId = myId;
            const source = viewMode === 'focused-only'
                ? buildFocusedClassOnlySource(model, currentIndex)
                : buildClassSource(model, currentIndex);
            try {
                const result = await window.mermaid.render(myId, source);
                if (myId !== latestRenderId) return; // a newer render started
                const svg = typeof result === 'string' ? result : result.svg;
                stage.innerHTML = '';
                const container = document.createElement('div');
                container.className = 'mermaid-container';
                container.innerHTML = svg;
                stage.appendChild(container);
                status.textContent = `${currentIndex + 1} / ${model.classes.length} · ${target.name}`;
            } catch (err) {
                if (myId !== latestRenderId) return;
                const message = (err && (err.message || err.str || err.toString())) || '未知错误';
                showError('mermaid 语法错误:\n\n' + message);
            }
        }

        function loadAndRender(text, mode) {
            if (!text) return;
            if (!window.mermaid) {
                showError('mermaid.js 未加载,请检查网络');
                return;
            }
            const parsed = parseClassDiagram(text);
            if (parsed.classes.length === 0) {
                showError('未找到任何 class 定义');
                return;
            }
            model = parsed;
            currentIndex = 0;
            if (mode) viewMode = mode;
            renderCurrent();
        }

        function step(delta) {
            if (!model || model.classes.length === 0) return;
            const n = model.classes.length;
            currentIndex = (currentIndex + delta + n) % n;
            renderCurrent();
        }

        document.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            const mode = e.altKey ? 'focused-only' : 'with-neighbors';
            loadAndRender(text.trim(), mode);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                showHint();
                return;
            }
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                step(+1);
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                step(-1);
                return;
            }
            if (e.altKey && (e.key === 'v' || e.key === 'V')) {
                e.preventDefault();
                if (!model) return;
                if (viewMode === 'focused-only') {
                    viewMode = 'with-neighbors';
                    status.textContent = '已切换到带邻居模式';
                } else {
                    viewMode = 'focused-only';
                    status.textContent = '已切换到单 class 模式';
                }
                renderCurrent();
            }
        });

        closeBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'focus-class-close' }, '*');
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type !== 'focus-class-load') return;
            if (typeof data.content !== 'string' || !data.content) return;
            loadAndRender(data.content.trim());
            closeBtn.classList.add('visible');
        });
    </script>
</body>
</html>
