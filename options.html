<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Options</title>

    <!-- Prism 暗黑主题 -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #121212;
            color: #e0e0e0;
            padding: 0 25% 30px;
        }

        h2 {
            text-align: center;
            color: #90caf9;
            font-size: 40px;
        }

        .paste-hint {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-style: italic;
        }

        .options {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            transition: background 0.3s;
        }

        .options:hover {
            background: #252525;
        }

        pre {
            background: #1e1e1e;
            border-radius: 4px;
            padding: 12px;
            overflow-x: auto;
            position: relative; /* Ensure parent has relative positioning */
        }

        select {
            background-color: #1e1e1e; /* Dark background */
            color: #e0e0e0; /* Light text */
            border: 1px solid #333; /* Subtle border */
            border-radius: 4px; /* Slightly rounded corners */
            padding: 5px; /* Internal spacing */
        }

        /* Optionally, style the options within the dropdown if needed */
        /* Note: Styling options can be limited in some browsers */
        select option {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        #rate-slider {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
            /* Basic dark theme styles for range input */
            background-color: #121212; /* Background of the track */
        }

        #rate-slider::-webkit-slider-runnable-track { /* Chrome, Safari, Opera */
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            height: 8px;
        }

        #rate-slider::-moz-range-track { /* Firefox */
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            height: 8px;
        }

        #rate-slider::-webkit-slider-thumb { /* Chrome, Safari, Opera */
            -webkit-appearance: none;
            appearance: none;
            background: #90caf9; /* Blue thumb */
            border-radius: 50%;
            width: 18px;
            height: 18px;
            margin-top: -5px; /* Center vertically */
        }

        #rate-slider::-moz-range-thumb { /* Firefox */
            background: #90caf9; /* Blue thumb */
            border-radius: 50%;
            width: 18px;
            height: 18px;
            border: none;
        }

        #rate-value {
            margin-left: 10px;
            color: #90caf9;
        }

        button { /* Or a more specific selector like #content button if needed */
            margin-left: 10px;
            background-color: #66afe9;
            color: white;
            border: none;
            width: 42px;
            text-align: center;
            height: 22px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 12px;
        }

        .copy-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #66afe9;
            color: white;
            border: none;
            border-radius: 4px;
            width: 55px;
            height: 22px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 10px;
            margin-top: 10px;
        }

        .copy-button:hover {
            background-color: #4d9fe0; /* Slightly darker on hover */
        }

        b {
            color: gold;
        }

        /* 对话框遮罩层 */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .dialog-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        /* 代码块自动换行 */
        pre {
            white-space: pre-wrap; /* 保留换行符并允许自动换行 */
            word-break: break-all; /* 允许在任意字符处换行 */
            overflow-x: auto; /* 水平滚动条（当内容过宽时） */
        }

        /* 代码片段:默认藏着,选了答案才显示 */
        pre.snippet {
            margin-top: 14px;
            border: 1px solid #333;
            background: #171717;
        }

        small {
            color: red;
        }

        /* 关闭按钮(被 reader.html 以 iframe 打开时显示) */
        .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #252525;
            color: #e0e0e0;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            z-index: 200;
        }

        .close-btn:hover {
            background: #3a3a3a;
        }

        .close-btn[hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

<button id="closeBtn" class="close-btn" hidden>×</button>

<h2 onclick="reset()" style="cursor: pointer">🌙 Options</h2>
<div style="display: flex;height: 30px;align-items: center;">
    <select id="voice-select">
    </select>
    <div style="margin-left: 20px; display: flex;margin-top: 10px;">
        <label for="rate-slider">Speed:</label>
        <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1" style="margin-left: 10px;">
        <span id="rate-value">1.0</span>
    </div>
</div>
<div id="content"></div>
<!-- 对话框遮罩层 -->
<div class="dialog-overlay" id="dialog-overlay">
            <pre style="height: 90vh;overflow:auto;min-width: 80vw;">
                <code class="language-jsx" id="dialogCode"
                      style="white-space: pre-wrap;word-break: break-all;padding: 0 20px">
                </code>
            </pre>
</div>

<!-- Prism Core -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>

<!-- Prism Language Packs -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script> <!-- HTML -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>    <!-- CSS -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script> <!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script> <!-- TS -->

<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-tsx.min.js"></script>  <!-- TSX -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-kotlin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<script>
    const dialogOverlay = document.getElementById('dialog-overlay');
    const dialogCode = document.getElementById('dialogCode');
    dialogCode.style.fontSize = "22px"

    // 关闭对话框的函数
    function closeDialog() {
        dialogOverlay.style.visibility = 'hidden';
    }

    // 点击遮罩层关闭对话框
    dialogOverlay.addEventListener('click', function (e) {
        if (e.target === dialogOverlay) {
            closeDialog();
        }
    });

    // ESC键关闭对话框
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && dialogOverlay.classList.contains('show')) {
            closeDialog();
        }
    });

    // 监听快捷键(k)
    document.addEventListener('keydown', function (e) {
        if (e.key === 'q') {
            dialogOverlay.style.visibility = dialogOverlay.style.visibility === 'visible' ? 'hidden' : 'visible';
            if (dialogOverlay.style.visibility === 'visible') {
                // 获取选中的文本
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const text = selection.toString().replaceAll("<", "&lt;").replaceAll(">", "&gt;");
                    dialogCode.innerHTML = `<pre><code class="language-javascript">

${text}
</code></pre>`;
                    Prism.highlightAll();
                }
            }
        }
    })
</script>

<script>
    mermaid.initialize({startOnLoad: false, theme: "dark"});

    // 默认发音人名称
    const defaultVoiceName = localStorage.getItem('selectedVoice') || "Microsoft Brian Online (Natural) - English (United States)";

    // --- JSON 粘贴 ---
    // 剪贴板里是 JSON 时,转成 .options 那套 html 再显示
    function escapeHtmlText(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&' + 'amp;')
            .replace(/</g, '&' + 'lt;')
            .replace(/>/g, '&' + 'gt;')
            .replace(/"/g, '&' + 'quot;');
    }

    // 依次找第一个有的字段
    function pickField(obj, names) {
        for (const n of names) {
            const v = obj[n];
            if (v !== undefined && v !== null && v !== '') return v;
        }
        return '';
    }

    // 一条题目 -> <div class="options" data-answer="1"> ... </div>
    // snippet: 这道题对应的代码片段 { lang, code },渲染成 <pre><code> 放在题目下方
    function jsonItemToHtml(item, snippet) {
        const question = pickField(item, ['question', 'title', 'stem', 'q']);
        const answer = pickField(item, ['data-answer', 'dataAnswer', 'answer', 'correct']);
        const explain = pickField(item, ['explain', 'explanation', 'analysis']);
        const shuffle = item['data-shuffle'] !== undefined ? item['data-shuffle'] : item.shuffle;

        let options = pickField(item, ['options', 'choices', 'items']);
        if (!Array.isArray(options)) options = [];

        const attrs = [`data-answer="${escapeHtmlText(String(answer === '' ? 1 : answer))}"`];
        if (shuffle !== undefined && String(shuffle) === 'false') attrs.push('data-shuffle="false"');

        const lines = [`<div class="options" ${attrs.join(' ')}>`];
        lines.push(`<p>${escapeHtmlText(question)}</p>`);
        options.forEach(opt => {
            const text = (opt && typeof opt === 'object')
                ? pickField(opt, ['text', 'content', 'label', 'value'])
                : opt;
            lines.push(`<p>${escapeHtmlText(text)}</p>`);
        });
        if (explain !== '') lines.push(`<p class="explain">${escapeHtmlText(explain)}</p>`);

        // 代码片段:默认藏着,用户选了答案才显示出来
        if (snippet && snippet.code) {
            const lang = String(snippet.lang || '').replace(/[^A-Za-z0-9_+#.-]/g, '') || 'plaintext';
            lines.push(`<pre class="snippet" hidden><code class="language-${lang}">${escapeHtmlText(snippet.code)}</code></pre>`);
        }

        lines.push('</div>');
        return lines.join('\n');
    }

    function jsonToOptionsHtml(data, snippets) {
        const list = Array.isArray(data) ? data : [data];
        const map = snippets instanceof Map ? snippets : new Map();
        const parts = [];
        // 索引和代码片段的编号一一对应(1 = 第一题),所以要按原位置取
        list.forEach((item, index) => {
            if (!item || typeof item !== 'object' || Array.isArray(item)) return;
            parts.push(jsonItemToHtml(item, map.get(index + 1)));
        });
        return parts.join('\n');
    }

    // --- 粘贴内容里的代码片段 ---------------------------------------------
    // 格式:JSON 数组,后面接若干段代码,每段前面有一行
    //       "// 索引-编程语言"(如 // 1-typescript),索引从 1 开始(1 = 第一题)
    // 不需要 "---" 分隔线;有的话也会认(当成分隔线去掉)
    const SNIPPET_MARKER = /^\s*\/\/\s*(\d+)\s*-\s*([A-Za-z0-9_+#.-]+)\s*$/;

    function splitCodeSnippets(text) {
        const lines = String(text == null ? '' : text).split(/\r?\n/);

        // 1) 找第一行 "// 索引-编程语言";它之前是 JSON,之后是代码
        let first = -1;
        for (let i = 0; i < lines.length; i++) {
            if (SNIPPET_MARKER.test(lines[i])) { first = i; break; }
        }
        if (first === -1) return {jsonText: lines.join('\n'), snippets: new Map()};

        // JSON 部分:去掉结尾可能存在的 "---" 分隔线和空行
        const head = lines.slice(0, first);
        while (head.length && head[head.length - 1].trim() === '') head.pop();
        if (head.length && head[head.length - 1].trim() === '---') head.pop();
        const jsonText = head.join('\n');

        // 2) 逐行找 "// 索引-编程语言",把它下面的内容存成第 索引 道的代码片段
        const snippets = new Map();
        let cur = null;
        let buf = [];
        const flush = () => {
            if (!cur) return;
            const code = buf.join('\n').replace(/^\n+/, '').replace(/\n+$/, '');
            snippets.set(cur.index, {lang: cur.lang, code: code});
        };
        for (const line of lines.slice(first)) {
            const m = line.match(SNIPPET_MARKER);
            if (m) {
                flush();
                cur = {index: Number(m[1]), lang: m[2]};
                buf = [];
            } else if (cur) {
                buf.push(line);
            }
        }
        flush();

        return {jsonText: jsonText, snippets: snippets};
    }

    // text[pos] 处的引号是不是某个 key 的开头(key 后面跟着冒号)
    function isKeyStart(text, pos) {
        let j = pos + 1;
        while (j < text.length) {
            const c = text[j];
            if (c === '\\') { j += 2; continue; }
            if (c === '"') {
                let k = j + 1;
                while (k < text.length && /\s/.test(text[k])) k++;
                return text[k] === ':';
            }
            j++;
        }
        return false;
    }

    // 手写 JSON 常犯两种毛病:字符串里的引号没转义、条目之间漏了逗号。
    // 先按标准 JSON 解析,不行就修一修再试
    function repairJsonText(text) {
        let out = '';
        let i = 0;
        const n = text.length;
        let lastSig = '';        // 上一个有意义的字符
        const stack = [];        // 容器:obj / arr
        while (i < n) {
            const ch = text[i];
            if (ch !== '"') {
                out += ch;
                if (ch === '{') stack.push('obj');
                else if (ch === '}') stack.pop();
                else if (ch === '[') stack.push('arr');
                else if (ch === ']') stack.pop();
                if (!/\s/.test(ch)) lastSig = ch;
                i++;
                continue;
            }
            // key 读到第一个引号就结束;value 要看引号后面是什么:
            // 后面是 , } ] 才算这个字符串完了,否则是内容里的引号,补个转义
            const isKey = stack[stack.length - 1] === 'obj' && (lastSig === '{' || lastSig === ',');
            let j = i + 1;
            let buf = '"';
            while (j < n) {
                const c = text[j];
                if (c === '\\') {
                    buf += text.slice(j, j + 2);
                    j += 2;
                    continue;
                }
                if (c === '"') {
                    if (isKey) {
                        buf += '"';
                        j++;
                        break;
                    }
                    let k = j + 1;
                    while (k < n && /\s/.test(text[k])) k++;
                    const next = text[k];
                    const endsHere = next === ',' || next === '}' || next === ']' || next === undefined
                        // 少了个逗号:后面直接就是下一个 key
                        || (next === '"' && isKeyStart(text, k));
                    if (endsHere) {
                        buf += '"';
                        j++;
                        break;
                    }
                    buf += '\\"';
                    j++;
                    continue;
                }
                buf += c;
                j++;
            }
            out += buf;
            i = j;
            lastSig = '"';
        }
        // 漏写的逗号:"值" 换行 "key":  或者  } 换行 {
        out = out.replace(/("(?:[^"\\]|\\.)*")(\s*\r?\n\s*)("(?:[^"\\]|\\.)*"\s*:)/g, '$1,$2$3');
        out = out.replace(/(\})(\s*\r?\n\s*)(\{)/g, '$1,$2$3');
        return out;
    }

    function parseJsonLoose(text) {
        try {
            return JSON.parse(text);
        } catch (err) {
            try {
                return JSON.parse(repairJsonText(text));
            } catch (err2) {
                throw err;   // 报原文的错,位置更好找
            }
        }
    }

    // 文本看起来像 JSON 就走 JSON 那条路
    function looksLikeJson(text) {
        const t = String(text || '').trim();
        return t.startsWith('[') || t.startsWith('{');
    }

    // 把一段 .options html 渲染到页面上
    function renderOptionsContent(html) {
        const container = document.getElementById('content');
        container.innerHTML = '';
        container.innerHTML = html.replaceAll("**", "").replaceAll("<{", "《").replaceAll("}>", "》").trim();
        initializeQuestions();
        Prism.highlightAll();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // JSON 文本 -> 题目(可以带 "---" + 代码片段)
    function loadJsonText(text) {
        const {jsonText, snippets} = splitCodeSnippets(text);
        let data;
        try {
            data = parseJsonLoose(jsonText);
        } catch (err) {
            alert('JSON 解析失败: ' + (err.message || err));
            return false;
        }
        const jsonHtml = jsonToOptionsHtml(data, snippets);
        if (!jsonHtml) {
            alert('JSON 里没找到题目(需要 question / options)');
            return false;
        }
        renderOptionsContent(jsonHtml);
        return true;
    }

    document.addEventListener('paste', e => {
        const textData = e.clipboardData.getData('text/plain') || '';
        const htmlData = e.clipboardData.getData('text/html') || '';

        if (looksLikeJson(textData)) {
            loadJsonText(textData);
            return;
        }

        const raw = htmlData || textData;
        if (!raw) return;

        renderOptionsContent(raw);
    });

    // --- iframe integration (parent = reader.html) ---
    const closeBtn = document.getElementById('closeBtn');
    // 在 reader.html 的 iframe 里打开时,关闭按钮一直显示(万一题目没加载出来也能退出去)
    if (window.parent && window.parent !== window) {
        closeBtn.hidden = false;
    }
    closeBtn.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({type: 'focus-options-close'}, '*');
        }
    });

    window.addEventListener('message', (e) => {
        const data = e.data;
        if (!data || typeof data !== 'object') return;
        if (data.type !== 'focus-options-load') return;
        const content = data.content;
        let ok = false;
        if (typeof content === 'string' && content.trim()) {
            ok = loadJsonText(content);
        } else if (content && typeof content === 'object') {
            // 直接发来一个对象/数组也行
            const jsonHtml = jsonToOptionsHtml(content);
            if (jsonHtml) {
                renderOptionsContent(jsonHtml);
                ok = true;
            }
        }
        if (ok) closeBtn.hidden = false;
    });

    let isSpeaking = false;
    const select = document.getElementById('voice-select');
    select.innerHTML = '<option value="">Loading...</option>';
    // Event listener for when the user manually selects a voice from the dropdown
    select.addEventListener('change', () => {
        const selectedVoiceName = select.value;
        localStorage.setItem('selectedVoice', selectedVoiceName);
        const voices = window.speechSynthesis.getVoices();
        const voice = voices.find(voice => voice.name === selectedVoiceName);
        if (voice) {
            selectVoice = voice;
        }
    });

    document.addEventListener("keydown", (e) => {
        console.log(e.key)
        if (e.keyCode === 32) {
            e.preventDefault();
            window.speechSynthesis.cancel();
            isSpeaking = false;
        } else if (e.key === 'd') {
            e.preventDefault();
            // 暂停/继续
            if (!isSpeaking) {
                isSpeaking = true;
                window.speechSynthesis.resume();
            } else {
                isSpeaking = false;
                window.speechSynthesis.pause();
            }
        }
    })

    let selectVoice = null
    let currentRate = parseFloat(localStorage.getItem('speechRate')) || 1.0; // Load saved rate or default to 1.0

    document.addEventListener('DOMContentLoaded', () => {
        const rateSlider = document.getElementById('rate-slider');
        const rateValueSpan = document.getElementById('rate-value');

        if (rateSlider && rateValueSpan) {
            rateSlider.value = currentRate;
            rateValueSpan.textContent = currentRate.toFixed(1);

            rateSlider.addEventListener('input', () => {
                currentRate = parseFloat(rateSlider.value);
                rateValueSpan.textContent = currentRate.toFixed(1);
                localStorage.setItem('speechRate', currentRate); // Save the preference
            });
        }
    });

    window.speechSynthesis.onvoiceschanged = () => {
        const voices = window.speechSynthesis.getVoices();

        // Clear any existing options (like the "Loading..." one)
        select.innerHTML = '';

        // Populate the select element with available voices
        voices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.name;
            option.textContent = voice.name; // Or voice.name + ' (' + voice.lang + ')'
            select.appendChild(option);

            // Check if this is the default voice and store it
            if (voice.name === defaultVoiceName) {
                selectVoice = voice;
            }
        });

        // Set the default selected option in the dropdown if the default voice was found
        if (selectVoice) {
            select.value = selectVoice.name;
        }
    };

    function speak(text, event) {
        window.speechSynthesis.cancel();
        text = event.altKey ? text.replaceAll("_", " ").replace(/《([^》]+)》/g, '$1, $1') : text.replaceAll("_", " ")
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = currentRate; // 使用当前语速
        utterance.voice = selectVoice;
        utterance.onstart = () => {
            isSpeaking = true;
        };
        utterance.onend = () => {
            isSpeaking = false;
        }
        speechSynthesis.speak(utterance);
    }


    // 代码片段(<pre class="snippet">):不是选项,不参与乱序和判分
    function isSnippet(el) {
        return !!(el && el.classList && el.classList.contains('snippet'));
    }

    function initializeQuestions() {
        document.querySelectorAll('.options').forEach((container, qIndex) => {
            if (container.dataset.processed === 'true') return;
            container.dataset.processed = 'true';

            container.style.marginTop = "30px"

            const originalAnswer = Number(container.dataset.answer);
            if (isNaN(originalAnswer) || originalAnswer < 1) return;

            const children = Array.from(container.children);
            if (children.length < 2) return;

            const question = children[0];

            const explainDiv = container.querySelector(".explain")
            if (explainDiv) {
                explainDiv.style.display = "none"
            }

            // 代码片段:默认藏着,选了答案才显示(不算选项,也不参与乱序)
            const snippetEl = container.querySelector(".snippet")
            if (snippetEl) {
                snippetEl.hidden = true
            }

            let optionElements = children.filter(child => !child.classList.contains('explain') && !isSnippet(child)).slice(1);
            if (optionElements.length === 0) return;   // 没有选项的题不算题目
            optionElements.forEach((opt, i) => {
                opt.dataset.origIndex = i;
                opt.textContent = opt.textContent.replace(/^\d+\.\s*/, '').trim();
            });

            const shouldShuffle = container.dataset.shuffle !== 'false';
            if (shouldShuffle) {
                for (let i = optionElements.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionElements[i], optionElements[j]] = [optionElements[j], optionElements[i]];
                }
                optionElements.forEach(opt => container.appendChild(opt));
            }

            if (explainDiv) {
                // explainDiv.style.fontStyle = "italic"
                explainDiv.style.fontFamily = "Corbel"
                container.appendChild(explainDiv);
            }

            // 代码片段挪到最后:题目 → 选项 → 解析 → 代码
            if (snippetEl) {
                container.appendChild(snippetEl);
            }

            const displayOptions = Array.from(container.children).filter(child => !isSnippet(child)).slice(1);

            const correctOrigIndex = originalAnswer - 1;
            const newAnswerIndex = displayOptions.findIndex(opt =>
                Number(opt.dataset.origIndex) === correctOrigIndex
            ) + 1;
            container.dataset.answer = String(newAnswerIndex);

            displayOptions.forEach((opt, i) => {
                const cleanText = opt.textContent.trim();
                opt.innerHTML = opt.className === 'explain' ? cleanText.replace("2.", "<br>2.").replace("3.", "<br>3.").replace("4.", "<br>4.") : `${i + 1}. ${cleanText}`;
            });

            question.style.fontWeight = 'bold';
            question.style.margin = '5px 0px 15px 0';
            question.style.color = '#bbdefb';
            question.style.fontSize = '25px';
            question.style.cursor = 'pointer';
            question.style.display = 'flex'
            question.style.alignItems = 'center';

            question.addEventListener("click", (event) => {
                event.stopPropagation();
                speak(questionText, event)
            })

            // 创建一个button
            const copyButton = document.createElement('button');
            copyButton.textContent = 'Copy';
            const questionText = question.textContent.trim();
            const optionsText = displayOptions.map((opt, displayIdx) => {
                const cleanText = opt.textContent.trim();
                return opt.className === "explain" ? "" : `${cleanText}`;// ${displayIdx + 1}.
            }).join('\n');
            const textToCopy = `${questionText}\n${optionsText}`;

            question.textContent = `${qIndex + 1}. ${questionText}`;

            copyButton.addEventListener("click", (event) => {
                event.stopPropagation();
                // 复制问题和选项
                navigator.clipboard.writeText(textToCopy).then(() => {
                }).catch(err => {
                    alert("Failed to copy: " + err)
                });
            })
            question.appendChild(copyButton);

            const exportButton = document.createElement('button');
            exportButton.textContent = 'Export';
            exportButton.addEventListener("click", (event) => {
                event.stopPropagation();
                let result = `${questionText}</div>|${container.dataset.answer}|`
                displayOptions.forEach((opt, displayIdx) => {
                    if (opt.className !== "explain") {
                        result += `<div class="option">${opt.textContent.trim()}</div>`
                    }
                })
                result += `|${explainDiv.textContent.trim()}`
                navigator.clipboard.writeText(result).then(() => {
                }).catch(err => {
                    alert("Failed to copy: " + err)
                });
            })
            question.appendChild(exportButton);

            displayOptions.forEach((opt, displayIdx) => {
                opt.style.padding = '8px 12px';
                opt.style.margin = opt.className === "explain" ? "15px 4px 0 0" : '4px 0';
                opt.style.border = '1px solid #333';
                opt.style.borderRadius = '6px';
                opt.style.cursor = 'pointer';
                opt.style.transition = 'all 0.3s';
                opt.style.userSelect = 'none';
                opt.style.backgroundColor = '#1e1e1e';
                opt.style.color = '#e0e0e0';
                opt.dataset.selected = "false";

                // Hover 效果：仅在未被选中时生效
                opt.addEventListener('mouseenter', () => {
                    if (opt.dataset.selected === "false") {
                        opt.style.backgroundColor = '#2c2c2c';
                    }
                });
                opt.addEventListener('mouseleave', () => {
                    if (opt.dataset.selected === "false") {
                        opt.style.backgroundColor = '#1e1e1e';
                    }
                });

                // 点击选项
                opt.addEventListener('click', (event) => {
                    if (opt.className === "explain") {
                        speak(opt.textContent, event)
                        return
                    }

                    window.speechSynthesis.cancel();

                    displayOptions.forEach(o => {
                        o.style.backgroundColor = '#1e1e1e';
                        o.style.color = '#e0e0e0';
                        o.dataset.selected = "false";
                    });

                    const currentAnswer = Number(container.dataset.answer);
                    const isCorrect = (displayIdx + 1) === currentAnswer;

                    if (isCorrect) {
                        opt.style.backgroundColor = '#1b5e20';
                        opt.style.color = '#a5d6a7';
                        speak(opt.textContent, event)
                        // 判断text是否只由字母, 数字，逗号,句号, -, 空格组成
                        // const lastContent = displayOptions[displayOptions.length-1].textContent
                        // if (/^[a-zA-Z0-9,.()’+@"':/;`→—\[\]\-\s]+$/.test(lastContent)) {
                        //     speak(lastContent)
                        // }
                    } else {
                        opt.style.backgroundColor = '#b71c1c';
                        opt.style.color = '#ffcccb';
                        const correctOpt = displayOptions[currentAnswer - 1];
                        if (correctOpt) {
                            correctOpt.style.backgroundColor = '#1b5e20';
                            correctOpt.style.color = '#a5d6a7';
                            correctOpt.dataset.selected = "true";
                        }
                        // if(/^[a-zA-Z0-9,.()‘+@"':/;`→—\[\]\-\s]+$/.test(correctOpt.textContent)){
                        //     const lastContent = displayOptions[displayOptions.length-1].textContent
                        //     if (/^[a-zA-Z0-9,.()’+@"':/;`→—\[\]\-\s]+$/.test(lastContent)) {
                        //         speak("The correct answer is "+ correctOpt.textContent.slice(2)+". "+lastContent)
                        //     } else {
                        //         speak("The correct answer is "+ correctOpt.textContent.slice(2))
                        //     }
                        // }
                    }

                    opt.dataset.selected = "true"; // 标记被选中
                    explainDiv.style.display = 'block';
                    if (snippetEl) snippetEl.hidden = false;   // 选了答案,代码片段露出来
                });
            });

        });
        document.querySelectorAll('code').forEach(code => {
            // Ensure the parent 'pre' element has position: relative for absolute positioning of the button
            const pre = code.parentElement;
            if (pre && pre.tagName.toLowerCase() === 'pre') {
                pre.style.position = 'relative';

                // Create the copy button
                const copyButton = document.createElement('button');
                copyButton.textContent = 'Copy';
                copyButton.className = 'copy-button'; // Optional: for easier CSS targeting

                // Add click event to copy code content
                copyButton.addEventListener('click', () => {
                    const textToCopy = code.textContent;
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        // Optional: Provide feedback (e.g., change button text temporarily)
                        const originalText = copyButton.textContent;
                        copyButton.textContent = 'Copied';
                        setTimeout(() => {
                            copyButton.textContent = originalText;
                        }, 1000);
                    }).catch(err => {
                        console.error('Failed to copy code: ', err);
                        alert('Failed to copy code.');
                    });
                });

                // Append the button to the 'pre' element
                pre.appendChild(copyButton);
            }
        });
        const codeBlocks = document.querySelectorAll('.mermaid');
        const diagramIds = [];
        codeBlocks.forEach((block, index) => {
            const text = block.textContent.trim();
            // Check if the content looks like a Mermaid diagram
            // if (text.startsWith('flowchart') || text.startsWith('graph') || text.startsWith('sequenceDiagram') || text.startsWith('classDiagram')) {
            // Create a div to hold the rendered diagram
            const diagramDiv = block;
            diagramDiv.id = `mermaid-diagram-${index}`;
            diagramIds.push(diagramDiv.id)
            diagramDiv.style.backgroundColor = '#282c34';
            // 内容居中
            diagramDiv.style.display = 'flex';
            diagramDiv.style.justifyContent = 'center';
            diagramDiv.textContent = text;

            // Render the diagram
            // mermaid.init(undefined, `#mermaid-diagram-${index}`);
            // }
        });
        if (typeof mermaid !== 'undefined' && diagramIds.length > 0) {
            mermaid.run({
                nodes: diagramIds.map(id => document.getElementById(id))
            });
        }
    }

    function reset() {
        document.querySelectorAll('.options').forEach(container => {
            const options = Array.from(container.children).slice(1).filter(el => !isSnippet(el));
            options.forEach(opt => {
                opt.style.backgroundColor = '';
                opt.style.color = '';
            });
            // 代码片段重新藏起来
            const snippet = container.querySelector('.snippet');
            if (snippet) snippet.hidden = true;
        });
    }

</script>

</body>
</html>
