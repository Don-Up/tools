<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-text</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 48px 5vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 20px;
            text-align: center;
        }

        .card {
            background: #252525;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 60px 72px;
        }

        .en {
            font-size: 38px;
            line-height: 1.55;
            color: #e0e0e0;
            font-weight: 500;
            word-break: break-word;
        }

        .en .word {
            transition: background-color 0.1s;
        }

        .en .word.word-active {
            background: #4fc3f7;
            color: #1e1e1e;
            border-radius: 3px;
            padding: 0 2px;
            margin: 0 -2px;
        }

        .divider {
            margin: 36px 0;
            border-top: 1px solid #333;
        }

        .cn {
            font-size: 30px;
            line-height: 1.6;
            color: #b0bec5;
            word-break: break-word;
        }

        .status {
            margin-top: 32px;
            text-align: center;
            color: #888;
            font-size: 18px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .status kbd {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            color: #b0bec5;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding: 10px 16px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #b0bec5;
        }

        .controls select {
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px;
            font-size: 12px;
            max-width: 280px;
        }

        .controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4fc3f7;
        }

        .controls button {
            padding: 6px 14px;
            font-size: 13px;
            color: #fff;
            background: #3a86ff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #2a6edc;
        }

        .controls button.speaking {
            background: #ff5252;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="controls hidden" id="controls">
        <label>
            <input type="checkbox" id="ttsToggle"> TTS
        </label>
        <label>
            <input type="checkbox" id="highlightToggle"> Highlight
        </label>
        <label id="voiceLabel" class="hidden">
            Voice:
            <select id="voiceSelect"></select>
        </label>
        <button id="stopBtn" class="hidden">Stop</button>
    </div>

    <div class="stage" id="stage">
        <div class="hint" id="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴中英文本</div>
    </div>

    <script>
        'use strict';

        let groups = [];
        let currentIndex = 0;
        let currentWordSpans = [];
        let ttsEnabled = localStorage.getItem('focusTextTtsEnabled') === 'true';
        let highlightEnabled = localStorage.getItem('focusTextHighlightEnabled') !== 'false';
        let controlsVisible = localStorage.getItem('focusTextControlsVisible') === 'true';
        let selectedVoice = null;
        let selectedVoiceName = localStorage.getItem('focusTextVoiceName') || '';
        let availableVoices = [];
        let isSpeaking = false;
        const stage = document.getElementById('stage');
        const controls = document.getElementById('controls');
        const ttsToggle = document.getElementById('ttsToggle');
        const highlightToggle = document.getElementById('highlightToggle');
        const voiceLabel = document.getElementById('voiceLabel');
        const voiceSelect = document.getElementById('voiceSelect');
        const stopBtn = document.getElementById('stopBtn');

        const SPLIT_BY = /[.?!;。？；]/;
        const WORD_RE = /[A-Za-z][A-Za-z']*|[^A-Za-z]+/g;

        function splitKeeping(s) {
            if (!s) return [];
            const out = [];
            let buf = '';
            for (const ch of s) {
                buf += ch;
                if (SPLIT_BY.test(ch)) {
                    out.push(buf);
                    buf = '';
                }
            }
            if (buf.trim().length > 0) out.push(buf);
            return out;
        }

        function parseText(text) {
            const openIdx = text.indexOf('【');
            const closeIdx = text.indexOf('】', openIdx);
            let englishRaw, chineseRaw;
            if (openIdx >= 0 && closeIdx > openIdx) {
                englishRaw = text.slice(0, openIdx) + text.slice(closeIdx + 1);
                chineseRaw = text.slice(openIdx + 1, closeIdx);
            } else {
                englishRaw = text;
                chineseRaw = '';
            }

            const enSegs = splitKeeping(englishRaw).map(s => s.trim()).filter(Boolean);
            const cnSegs = splitKeeping(chineseRaw).map(s => s.trim()).filter(Boolean);

            if (chineseRaw && closeIdx > openIdx && cnSegs.length > 0) {
                cnSegs[cnSegs.length - 1] += '】';
            }

            const n = Math.max(enSegs.length, cnSegs.length);
            const result = [];
            for (let i = 0; i < n; i++) {
                result.push({ en: enSegs[i] || '', cn: cnSegs[i] || '' });
            }
            return result;
        }

        function buildEnFragment(enText) {
            WORD_RE.lastIndex = 0;
            const fragment = document.createDocumentFragment();
            const wordSpans = [];
            let lastEnd = 0;
            let m;
            while ((m = WORD_RE.exec(enText)) !== null) {
                if (m.index > lastEnd) {
                    fragment.appendChild(document.createTextNode(enText.slice(lastEnd, m.index)));
                }
                const isWord = /^[A-Za-z]/.test(m[0]);
                if (isWord) {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = m[0];
                    fragment.appendChild(span);
                    wordSpans.push({ span, start: m.index, end: m.index + m[0].length });
                } else {
                    fragment.appendChild(document.createTextNode(m[0]));
                }
                lastEnd = m.index + m[0].length;
            }
            if (lastEnd < enText.length) {
                fragment.appendChild(document.createTextNode(enText.slice(lastEnd)));
            }
            return { fragment, wordSpans };
        }

        function render() {
            stage.innerHTML = '';
            if (groups.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'hint';
                hint.innerHTML = '按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴中英文本';
                stage.appendChild(hint);
                currentWordSpans = [];
                return;
            }
            const card = document.createElement('div');
            card.className = 'card';
            const g = groups[currentIndex];
            const en = document.createElement('div');
            en.className = 'en';
            const { fragment, wordSpans } = buildEnFragment(g.en);
            en.appendChild(fragment);
            currentWordSpans = wordSpans;
            card.appendChild(en);
            if (g.cn) {
                const divider = document.createElement('div');
                divider.className = 'divider';
                card.appendChild(divider);
                const cn = document.createElement('div');
                cn.className = 'cn';
                cn.textContent = g.cn;
                card.appendChild(cn);
            }
            stage.appendChild(card);

            const status = document.createElement('div');
            status.className = 'status';
            status.innerHTML = `${currentIndex + 1} / ${groups.length}&nbsp;&nbsp;<kbd>←</kbd><kbd>→</kbd> 切换&nbsp;&nbsp;<kbd>Alt</kbd>+<kbd>H</kbd> 设置`;
            stage.appendChild(status);
        }

        function clearHighlight() {
            currentWordSpans.forEach(({ span }) => span.classList.remove('word-active'));
        }

        function highlightAt(charIndex) {
            for (let i = 0; i < currentWordSpans.length; i++) {
                const w = currentWordSpans[i];
                if (charIndex >= w.start && charIndex < w.end) {
                    w.span.classList.add('word-active');
                } else {
                    w.span.classList.remove('word-active');
                }
            }
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            isSpeaking = false;
            stopBtn.classList.remove('speaking');
            clearHighlight();
        }

        function speakCurrentGroup() {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            if (groups.length === 0) return;
            const g = groups[currentIndex];
            if (!g || !g.en) return;
            stopSpeaking();
            const utterance = new SpeechSynthesisUtterance(g.en);
            utterance.lang = 'en-US';
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.onboundary = (event) => {
                if (!highlightEnabled) return;
                if (event.name !== 'word' || typeof event.charIndex !== 'number') return;
                highlightAt(event.charIndex);
            };
            utterance.onend = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
            };
            utterance.onerror = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
            };
            speechSynthesis.speak(utterance);
            isSpeaking = true;
            stopBtn.classList.add('speaking');
        }

        function loadText(text) {
            const parsed = parseText(text);
            if (parsed.length === 0) {
                stage.innerHTML = '';
                const err = document.createElement('div');
                err.className = 'error';
                err.textContent = '没有解析到任何句子';
                stage.appendChild(err);
                currentWordSpans = [];
                return;
            }
            groups = parsed;
            currentIndex = 0;
            render();
            if (ttsEnabled) speakCurrentGroup();
        }

        function updateControlsVisibility() {
            voiceLabel.classList.toggle('hidden', !ttsEnabled);
            stopBtn.classList.toggle('hidden', !ttsEnabled);
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = 'Default';
            voiceSelect.appendChild(defaultOpt);
            availableVoices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);
            });
            if (selectedVoiceName) {
                const idx = availableVoices.findIndex(v => v.name === selectedVoiceName);
                if (idx >= 0) {
                    voiceSelect.value = String(idx);
                    selectedVoice = availableVoices[idx];
                }
            }
        }

        ttsToggle.checked = ttsEnabled;
        highlightToggle.checked = highlightEnabled;
        controls.classList.toggle('hidden', !controlsVisible);
        updateControlsVisibility();

        ttsToggle.addEventListener('change', (e) => {
            ttsEnabled = e.target.checked;
            localStorage.setItem('focusTextTtsEnabled', String(ttsEnabled));
            updateControlsVisibility();
            if (ttsEnabled) {
                if (groups.length > 0) speakCurrentGroup();
            } else {
                stopSpeaking();
            }
        });

        highlightToggle.addEventListener('change', (e) => {
            highlightEnabled = e.target.checked;
            localStorage.setItem('focusTextHighlightEnabled', String(highlightEnabled));
            if (!highlightEnabled) clearHighlight();
        });

        voiceSelect.addEventListener('change', (e) => {
            const idx = parseInt(e.target.value, 10);
            if (Number.isFinite(idx) && idx >= 0 && availableVoices[idx]) {
                selectedVoice = availableVoices[idx];
                localStorage.setItem('focusTextVoiceName', selectedVoice.name);
            } else {
                selectedVoice = null;
                localStorage.removeItem('focusTextVoiceName');
            }
        });

        stopBtn.addEventListener('click', () => {
            stopSpeaking();
        });

        document.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            loadText(text);
        });

        document.addEventListener('keydown', (e) => {
            if (groups.length === 0) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (currentIndex < groups.length - 1) {
                    currentIndex++;
                    render();
                    if (ttsEnabled) speakCurrentGroup();
                }
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    render();
                    if (ttsEnabled) speakCurrentGroup();
                }
            }
        });

        if ('speechSynthesis' in window) {
            loadVoices();
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        window.addEventListener('keydown', (e) => {
            if (e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey && (e.key === 'h' || e.key === 'H')) {
                e.preventDefault();
            }
        }, true);

        window.addEventListener('keyup', (e) => {
            if (e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey && (e.key === 'h' || e.key === 'H')) {
                e.preventDefault();
                controlsVisible = !controlsVisible;
                localStorage.setItem('focusTextControlsVisible', String(controlsVisible));
                controls.classList.toggle('hidden', !controlsVisible);
            }
        }, true);
    </script>
</body>
</html>
