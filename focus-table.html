<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-table</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 5vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stage {
            width: 100%;
            max-width: 1400px;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 20px;
            text-align: center;
        }

        .vtable {
            display: flex;
            flex-direction: column;
        }

        .vrow {
            padding: 24px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .vrow:last-child {
            border-bottom: none;
        }

        .vheader {
            font-size: 18px;
            font-weight: 600;
            color: #4fc3f7;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4fc3f7;
        }

        .vcell {
            padding: 12px 0;
            font-size: 32px;
            line-height: 1.5;
            word-break: break-word;
            cursor: pointer;
        }

        .vcell.cell-name {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #ffd54f;
            font-size: 30px;
        }

        .vcell.cell-value {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #e0e0e0;
            font-size: 30px;
        }

        .vcell.cell-text {
            font-size: 32px;
            color: #e0e0e0;
        }

        .vcell .cell-cn {
            display: block;
            margin-top: 10px;
            font-size: 16px;
            line-height: 1.6;
            color: #9aa5b1;
            font-family: "华文细黑", "PingFang SC", "Microsoft YaHei", sans-serif;
            word-break: break-word;
        }

        /* [[基词]]注音}} → <ruby>基词<rt>注音</rt></ruby>:注音浮在基词上方,后面的
           后置修饰整个变成注音,所以 rt 给小一号、灰一点,免得跟正文抢视线 */
        .vcell ruby {
            ruby-position: over;
            ruby-align: center;
        }
        .vcell rt {
            font-size: 0.6em;
            color: #b0bec5;
        }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #2c2c2c;
            color: #b0bec5;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            word-break: break-all;
        }

        .status {
            margin-top: 32px;
            text-align: center;
            color: #888;
            font-size: 18px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .status kbd {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            color: #b0bec5;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            padding: 12px 20px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 6px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b0bec5;
            font-size: 14px;
        }

        .controls select,
        .controls input[type="text"] {
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 14px;
            outline: none;
        }

        .controls input[type="text"] {
            width: 240px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .controls input[type="text"]:focus,
        .controls select:focus {
            border-color: #4fc3f7;
        }

        .controls input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .controls input[type="range"] {
            width: 120px;
            cursor: pointer;
            accent-color: #4fc3f7;
        }

        .controls.hidden {
            display: none;
        }

        #closeBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            padding: 0;
            background: rgba(40, 40, 40, 0.85);
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            display: none;
            z-index: 100;
            font-family: inherit;
        }
        #closeBtn:hover {
            background: rgba(60, 60, 60, 0.95);
            color: #fff;
            border-color: #00BFFF;
        }
        #closeBtn.visible { display: block; }

        .ai-panel {
            left: 10px;
            bottom: 10px;
            margin: 0;
            padding: 10px;
            background: rgba(30, 30, 30, 0.45);
            border: 1px solid rgba(42, 42, 42, 0.45);
            border-radius: 8px;

            display: flex;
            flex-direction: column;
            position: fixed;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 20;
        }
        .ai-panel-title {
            font-size: 18px;
            color: #888;
            width: 100%;
            text-align: center;
            cursor: pointer;
        }
        .ai-panel-title:hover { color: #cfd8dc; }
        .ai-panel-toolbar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 4px 1px;
            font-size: 12px;
            color: #aaa;
        }
        .ai-full-context-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }
        .ai-full-context-toggle input { margin: 0; cursor: pointer; }
        .ai-answer {
            position: fixed;
            bottom: 10px;
            left: calc(20% + 20px);
            width: 36vw;
            min-height: 220px;
            max-height: 90vh;

        .ai-answer[hidden] { display: none; }
        .ai-answer {
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a transparent;
        }
        .ai-answer::-webkit-scrollbar { width: 8px; }
        .ai-answer::-webkit-scrollbar-track { background: transparent; }
        .ai-answer::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }
        .ai-answer::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
        /* 分句朗读时高亮当前分句(直接用原生选区做高亮,不用拆 cell 的 DOM 结构) */
        .vcell::selection { background: #4fc3f7; color: #10202b; }
        .ai-input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .ai-button-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .ai-textarea {
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            background: rgba(37, 37, 37, 0.92);
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            font-size: 14px;
            font-family: inherit;
            min-height: 90px;
            margin-top: 10px;
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a transparent;
        }
        .ai-textarea::-webkit-scrollbar { width: 8px; }
        .ai-textarea::-webkit-scrollbar-track { background: transparent; }
        .ai-textarea::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }
        .ai-textarea::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
        .ai-textarea:disabled { opacity: 0.6; }
        .ai-send {
            flex: 1;
            box-sizing: border-box;

        .ai-toggle {
            flex: 1;
            box-sizing: border-box;
            padding: 6px 16px;
            background: #2c2c2c;
            color: #cfd8dc;
            border: 1px solid #444;

            color: #fff;
            border-color: #7f1d1d;
        }
        .ai-bubble {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 6px 0;
        }
        .ai-bubble-label {
            font-size: 11px;
            color: #888;
            padding: 0 4px;
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 11px;
            color: #b0bec5;
            background: transparent;
            border: 1px solid #444;

            font-family: inherit;

            border-color: #ff5252;
        }

            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;

        .ai-bubble-user .ai-bubble-label { align-self: flex-end; }
        .ai-bubble-user .ai-bubble-body {
            background: #2a3a4a;
            align-self: flex-end;
            max-width: 80%;
            color: #e0e0e0;
        }
        .ai-bubble-assistant .ai-bubble-body {
            background: #2a2a2a;
            color: #e0e0e0;
        }
        .ai-cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background: #4fc3f7;
            margin-left: 2px;
            vertical-align: -2px;
            animation: ai-blink 1s step-start infinite;
        }
        @keyframes ai-blink { 50% { opacity: 0; } }
        .ai-bubble-body h1, .ai-bubble-body h2, .ai-bubble-body h3 {
            margin: 8px 0 4px;
            color: #e0e0e0;
        }
        .ai-bubble-body h1 { font-size: 18px; }
        .ai-bubble-body h2 { font-size: 16px; }

            background: #1a1a1a;
            padding: 8px 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 6px 0;

        .ai-bubble-body pre code { background: transparent; padding: 0; }
        .ai-bubble-body blockquote {
            border-left: 3px solid #4fc3f7;

        .fav-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fav-modal[hidden] { display: none; }
        .fav-modal-backdrop {

        .fav-modal-panel {
            position: relative;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 8px;

            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid #444;

        }

        .fav-modal-actions button {

        .fav-input.note-textarea {
            width: 380px;
            max-width: 100%;
            box-sizing: border-box;
            min-height: 220px;
            max-height: 60vh;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
            padding: 10px 12px;
            margin: 0 auto;
            display: block;
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a transparent;
        }
        .fav-input.note-textarea::-webkit-scrollbar { width: 8px; }
        .fav-input.note-textarea::-webkit-scrollbar-track { background: transparent; }
        .fav-input.note-textarea::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }
        .fav-input.note-textarea::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
    </style>

<body>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <button id="closeBtn" title="Close">×</button>
    <div class="stage" id="stage">
        <div class="hint" id="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 markdown 表格</div>
    </div>

    <div id="aiPanel" class="ai-panel">
        <div class="ai-panel-title">AI 问答</div>
        <div class="ai-panel-toolbar">
            <label class="ai-full-context-toggle" title="关闭后只发送当前行 + 选区，不发送整篇表格">
                <input type="checkbox" id="aiFullContext" checked>
                Full Context
            </label>
        </div>
        <div class="ai-input-row">
            <textarea id="aiQuestion" class="ai-textarea" placeholder="向 AI 提问当前表格...（Ctrl+Enter 发送,Esc 中止/清空）"></textarea>
            <div class="ai-button-row">
                <button id="aiToggle" class="ai-toggle" type="button">▲ 显示</button>
                <button id="aiSend" class="ai-send" type="button">发送</button>
            </div>
        </div>
    </div>
    <div id="aiAnswer" class="ai-answer" hidden></div>
    <div id="systemPromptModal" class="fav-modal" hidden>
        <div id="systemPromptBackdrop" class="fav-modal-backdrop"></div>
        <div class="fav-modal-panel">
            <div class="fav-modal-title">编辑 AI 角色设定</div>
            <textarea id="systemPromptInput" class="fav-input note-textarea" placeholder="自定义 system prompt...(留空 = 不发送 system 消息)"></textarea>
            <div class="fav-modal-actions">
                <button id="systemPromptReset">清空</button>
                <button id="systemPromptOk">保存</button>
                <button id="systemPromptCancel">取消</button>
            </div>
        </div>
    </div>
    <div id="viewContextModal" class="fav-modal" hidden>
        <div id="viewContextBackdrop" class="fav-modal-backdrop"></div>
        <div class="fav-modal-panel">
            <div class="fav-modal-title">当前背景上下文</div>
            <pre id="viewContextBody" class="fav-input note-textarea" style="white-space: pre-wrap; overflow: auto; cursor: text;"></pre>
            <div class="fav-modal-actions">
                <button id="viewContextCopy">复制</button>
                <button id="viewContextClose">关闭</button>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        let headers = [];
        let rows = [];
        let currentIndex = 0;
        let autoEnabled = localStorage.getItem('focusTableAutoEnabled') === 'true';
        let columnsConfig = localStorage.getItem('focusTableColumns') || '';
        let selectedVoiceName = localStorage.getItem('focusTableVoiceName') || '';
        let controlsVisible = localStorage.getItem('focusTableControlsVisible') === 'true';
        let speechSpeed = parseFloat(localStorage.getItem('focusTableSpeechSpeed')) || 1.0;
        let availableVoices = [];
        let columnsInputEl = null;   // 当前那次的 Columns 输入框,给键盘处理用
        const stage = document.getElementById('stage');

        function splitRow(line) {
            let s = line.trim();
            if (s.startsWith('|')) s = s.slice(1);
            if (s.endsWith('|')) s = s.slice(0, -1);
            return s.split('|').map(c => c.trim());
        }

        function isSeparatorRow(line) {
            const t = line.trim();
            return /^\|?[\s:|-]+\|?$/.test(t) && t.includes('---');
        }

        function parseTable(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const tableLines = lines.filter(l => l.startsWith('|'));
            if (tableLines.length < 3) return null;
            const headerLine = tableLines[0];
            const sepIdx = tableLines.findIndex((l, i) => i > 0 && isSeparatorRow(l));
            if (sepIdx < 0) return null;
            const headerCells = splitRow(headerLine);
            const dataLines = tableLines.slice(sepIdx + 1);
            const dataRows = dataLines.map(splitRow);
            if (headerCells.length < 1 || dataRows.length < 1) return null;
            return { headers: headerCells, rows: dataRows };
        }

        // === rubyCore 开始 ===
        // 一段单元格文本拆成 token:[[基词]]注音}} → ruby,`code` → code,其余原样。
        // 纯函数,不碰 DOM,tests/focus-table-ruby.test.js 直接测这段。
        const CELL_RUBY_RE = /\[\[([^\[\]]+)\]\]([\s\S]*?)\}\}/g;

        function pushPlainTokens(tokens, text) {
            text.split('`').forEach((part, i) => {
                if (i % 2 === 0) {
                    if (part.length > 0) tokens.push({ type: 'text', text: part });
                } else {
                    tokens.push({ type: 'code', text: part });
                }
            });
        }

        function tokenizeCellText(text) {
            const tokens = [];
            let last = 0;
            let m;
            CELL_RUBY_RE.lastIndex = 0;   // 带 g 的正则复用前归零
            while ((m = CELL_RUBY_RE.exec(text)) !== null) {
                if (m.index > last) pushPlainTokens(tokens, text.slice(last, m.index));
                tokens.push({ type: 'ruby', base: m[1], annot: m[2] });
                last = m.index + m[0].length;
            }
            if (last < text.length) pushPlainTokens(tokens, text.slice(last));
            return tokens;
        }
        // === rubyCore 结束 ===

        function renderCellTokens(tokens, parent) {
            tokens.forEach(tok => {
                if (tok.type === 'text') {
                    parent.appendChild(document.createTextNode(tok.text));
                } else if (tok.type === 'code') {
                    const code = document.createElement('code');
                    code.textContent = tok.text;
                    parent.appendChild(code);
                } else if (tok.annot) {
                    const ruby = document.createElement('ruby');
                    ruby.appendChild(document.createTextNode(tok.base));
                    const rt = document.createElement('rt');
                    rt.textContent = tok.annot;
                    ruby.appendChild(rt);
                    parent.appendChild(ruby);
                } else {
                    // 没写注音(只有 [[基词]]}})就当普通文字,别塞一个空 rt
                    parent.appendChild(document.createTextNode(tok.base));
                }
            });
        }

        function renderCell(text, td) {
            // 先按【】切分,中文注释作为独立小字 div,其余 text 再按 ` 渲染 code span
            // CN 末尾若带句末标点(。？！.?!),直接删掉,避免换行后单独成行
            // 如果最后一个 fragment 是 text(出现在 CN 之后),其末尾标点也会换行孤悬,一并删
            const cnRegex = /【([^】]*)】/g;
            const TRAILING_PUNCT = /[\s。？！.?!]+$/;
            const fragments = [];
            let lastIdx = 0;
            let m;
            while ((m = cnRegex.exec(text)) !== null) {
                if (m.index > lastIdx) fragments.push({ type: 'text', value: text.slice(lastIdx, m.index) });
                const cnText = m[1].replace(TRAILING_PUNCT, '').trim();
                if (cnText.length > 0) fragments.push({ type: 'cn', value: cnText });
                lastIdx = m.index + m[0].length;
            }
            if (lastIdx < text.length) fragments.push({ type: 'text', value: text.slice(lastIdx) });
            if (fragments.length > 0 && fragments[fragments.length - 1].type === 'text') {
                const last = fragments[fragments.length - 1];
                const before = last.value;
                const stripped = last.value.replace(TRAILING_PUNCT, '');
                // 只在前面出现过 CN 时才剥,避免误删普通结尾标点
                const hadCn = fragments.slice(0, -1).some(f => f.type === 'cn');
                if (hadCn && stripped !== before) {
                    last.value = stripped;
                }
            }

            fragments.forEach(frag => {
                if (frag.type === 'cn') {
                    const cnDiv = document.createElement('div');
                    cnDiv.className = 'cell-cn';
                    renderCellTokens(tokenizeCellText(frag.value), cnDiv);
                    td.appendChild(cnDiv);
                } else {
                    renderCellTokens(tokenizeCellText(frag.value), td);
                }
            });
        }

        function columnClass(index, total) {
            if (total === 1) return 'cell-text';
            if (index === 0) return 'cell-name';
            const last = total - 1;
            if (last > 0 && index === last) return 'cell-value';
            return 'cell-text';
        }

        function render() {
            stage.innerHTML = '';
            if (headers.length > 0) {
                const controls = document.createElement('div');
                controls.className = controlsVisible ? 'controls' : 'controls hidden';

                const voiceLabel = document.createElement('label');
                const voiceText = document.createElement('span');
                voiceText.textContent = 'Voice';
                voiceLabel.appendChild(voiceText);
                const voiceSelect = document.createElement('select');
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = 'Default';
                voiceSelect.appendChild(defaultOpt);
                availableVoices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.textContent = `${v.name} (${v.lang})`;
                    voiceSelect.appendChild(opt);
                });
                if (selectedVoiceName && availableVoices.some(v => v.name === selectedVoiceName)) {
                    voiceSelect.value = selectedVoiceName;
                }
                voiceSelect.addEventListener('change', () => {
                    selectedVoiceName = voiceSelect.value;
                    localStorage.setItem('focusTableVoiceName', selectedVoiceName);
                });
                voiceLabel.appendChild(voiceSelect);
                controls.appendChild(voiceLabel);

                const autoLabel = document.createElement('label');
                const autoCheckbox = document.createElement('input');
                autoCheckbox.type = 'checkbox';
                autoCheckbox.checked = autoEnabled;
                autoCheckbox.addEventListener('change', () => {
                    autoEnabled = autoCheckbox.checked;
                    localStorage.setItem('focusTableAutoEnabled', String(autoEnabled));
                    if (!autoEnabled) stopSpeaking();
                });
                autoLabel.appendChild(autoCheckbox);
                autoLabel.appendChild(document.createTextNode(' Auto'));
                controls.appendChild(autoLabel);

                const colsLabel = document.createElement('label');
                const colsText = document.createElement('span');
                colsText.textContent = 'Columns';
                colsLabel.appendChild(colsText);
                const colsInput = document.createElement('input');
                colsInput.type = 'text';
                colsInput.value = columnsConfig;
                colsInput.placeholder = 'column numbers, comma-separated';
                // 改一下就存,不能只等失焦:render() 会把整个设置栏重建,输入框被换掉时
                // blur 根本不会触发(元素从 DOM 移除不发 blur),只在 blur 里存就等于没存
                const saveColumns = () => {
                    columnsConfig = colsInput.value;
                    localStorage.setItem('focusTableColumns', columnsConfig);
                };
                colsInput.addEventListener('input', saveColumns);
                colsInput.addEventListener('change', saveColumns);
                colsInput.addEventListener('blur', saveColumns);
                colsInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveColumns();
                        colsInput.blur();
                    }
                });
                columnsInputEl = colsInput;
                colsLabel.appendChild(colsInput);
                controls.appendChild(colsLabel);

                const speedLabel = document.createElement('label');
                const speedText = document.createElement('span');
                speedText.textContent = `Speed: ${speechSpeed.toFixed(1)}`;
                speedLabel.appendChild(speedText);
                const speedSlider = document.createElement('input');
                speedSlider.type = 'range';
                speedSlider.min = '0.5';
                speedSlider.max = '2';
                speedSlider.step = '0.1';
                speedSlider.value = String(speechSpeed);
                speedSlider.addEventListener('input', () => {
                    speechSpeed = parseFloat(speedSlider.value);
                    speedText.textContent = `Speed: ${speechSpeed.toFixed(1)}`;
                    localStorage.setItem('focusTableSpeechSpeed', String(speechSpeed));
                });
                speedLabel.appendChild(speedSlider);
                controls.appendChild(speedLabel);

                stage.appendChild(controls);
            }
            const vtable = document.createElement('div');
            vtable.className = 'vtable';
            const row = rows[currentIndex] || [];
            const answerCol = getAnswerColumnIndex();
            answerCellEl = null;
            for (let i = 0; i < headers.length; i++) {
                const vrow = document.createElement('div');
                vrow.className = 'vrow';

                const h = document.createElement('div');
                h.className = 'vheader';
                h.textContent = headers[i];
                vrow.appendChild(h);

                const cell = document.createElement('div');
                cell.className = 'vcell ' + columnClass(i, headers.length);
                renderCell(row[i] || '', cell);
                cell.addEventListener('click', (e) => { if (!e.altKey) return; speakCellByIndex(i); });
                vrow.appendChild(cell);
                // 分句朗读只认这一格,renderCell 跑完再存,里面才有文本节点可用
                if (i === answerCol) answerCellEl = cell;

                vtable.appendChild(vrow);
            }
            stage.appendChild(vtable);

            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = `${currentIndex + 1} / ${rows.length}`;
            stage.appendChild(status);

            const keys = document.createElement('div');
            keys.className = 'status';
            keys.innerHTML = '<kbd>C</kbd> 设置栏 &nbsp;·&nbsp; Answer: <kbd>PgDn</kbd> 整段 <kbd>PgUp</kbd> 分句 <kbd>Del</kbd> 重读';
            stage.appendChild(keys);
        }

        function showError(msg) {
            stage.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'error';
            div.textContent = msg;
            stage.appendChild(div);
        }

        function loadTable(text) {
            const parsed = parseTable(text);
            if (!parsed) {
                showError('不是有效的 markdown 表格');
                return;
            }
            headers = parsed.headers;
            rows = parsed.rows;
            currentIndex = 0;
            resetFollow();
            // 只在从没设过时给个默认 1,2。已经设过的就保留,别被新粘贴的表格冲掉
            if (localStorage.getItem('focusTableColumns') === null) {
                columnsConfig = '1,2';
                localStorage.setItem('focusTableColumns', columnsConfig);
            }
            lastPastedText = text;
            render();
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        }

        function speakCurrentRow() {
            if (!autoEnabled || rows.length === 0) return;
            const row = rows[currentIndex] || [];
            const wanted = columnsConfig.split(',')
                .map(s => parseInt(s.trim(), 10))
                .filter(n => Number.isFinite(n) && n >= 1);
            if (wanted.length === 0) return;
            const parts = [];
            wanted.forEach(num => {
                const idx = num - 1;
                if (idx >= headers.length) return;
                const cell = (row[idx] || '')
                    .replace(/【[^】]*】/g, '')
                    .replace(/_/g, ' ')
                    .replace(/`([^`]+)`/g, '$1')
                    .trim();
                if (cell.length > 0) parts.push(cell);
            });
            if (parts.length === 0) return;
            const text = parts.join(', ');
            stopSpeaking();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = speechSpeed;
            if (selectedVoiceName) {
                const voice = availableVoices.find(v => v.name === selectedVoiceName);
                if (voice) utterance.voice = voice;
            }
            speechSynthesis.speak(utterance);
        }

        function getCellSpeakable(cellText) {
            return (cellText || '')
                .replace(/【[^】]*】/g, '')
                .replace(/_/g, ' ')
                .replace(/`([^`]+)`/g, '$1')
                .trim();
        }

        function speakCellByIndex(idx) {
            if (idx < 0 || idx >= headers.length) return;
            const row = rows[currentIndex] || [];
            speakText(getCellSpeakable(row[idx]));
        }

        // 朗读统一走这里,分句朗读和 Alt+点格子共用同一套语速 / 音色
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            const t = String(text || '').trim();
            if (!t) return;
            stopSpeaking();
            const utterance = new SpeechSynthesisUtterance(t);
            utterance.rate = speechSpeed;
            if (selectedVoiceName) {
                const voice = availableVoices.find(v => v.name === selectedVoiceName);
                if (voice) utterance.voice = voice;
            }
            speechSynthesis.speak(utterance);
        }

        // --- Answer 分句朗读(跟 cn2en-json 的 Alt+A / A 一个路子) ---
        let answerCellEl = null;
        let followRowIndex = -1;
        let followChunkIndex = 0;
        let lastFollowChunk = null;

        // 和 cn2en-json 同一套分句点:分句点算进本句末尾,点后面的空格留给下一句开头
        function splitChunksWithPositions(text) {
            const chunks = [];
            const re = /, |—|: |; |\. |\? |"\. /g;
            let lastEnd = 0;
            let m;
            while ((m = re.exec(text)) !== null) {
                if (m.index > lastEnd) {
                    const punct = m[0].replace(/\s+$/, '');
                    const end = m.index + punct.length;
                    chunks.push({ start: lastEnd, end: end, text: text.slice(lastEnd, end) });
                }
                lastEnd = m.index + m[0].length;
            }
            if (lastEnd < text.length) {
                chunks.push({ start: lastEnd, end: text.length, text: text.slice(lastEnd) });
            }
            return chunks;
        }

        // 表头里叫 Answer 的那一列就是"下方那部分";找不到就当最后一列(Q/A 表格的惯例)
        function getAnswerColumnIndex() {
            const idx = headers.findIndex(h => /answer/i.test(h || ''));
            return idx >= 0 ? idx : headers.length - 1;
        }

        // 朗读和高亮都以 cell 里已经渲染出来的字为准:跳过 .cell-cn(【】里的中文小字),
        // 其余文本节点按顺序拼起来。分句偏移量直接建在这串文本上,选中时才不会错位
        function collectCellTextNodes(cellEl) {
            const nodes = [];
            let text = '';
            const walker = document.createTreeWalker(cellEl, NodeFilter.SHOW_TEXT);
            let n;
            while ((n = walker.nextNode())) {
                const parent = n.parentElement;
                if (parent && parent.closest('.cell-cn')) continue;
                const len = n.nodeValue.length;
                if (len === 0) continue;
                nodes.push({ node: n, start: text.length, end: text.length + len });
                text += n.nodeValue;
            }
            return { text: text, nodes: nodes };
        }

        function clearFollowHighlight() {
            const sel = window.getSelection && window.getSelection();
            if (sel) sel.removeAllRanges();
        }

        // 拿原生选区当高亮:Range 两端只要落在文本节点上,跨 <code>、跨嵌套标签都能选中,
        // 不用为了高亮去拆 markdown / code 结构
        function selectInCell(nodes, start, end) {
            if (nodes.length === 0 || start >= end) return;
            const first = nodes.find(s => start >= s.start && start < s.end);
            const last = nodes.find(s => end > s.start && end <= s.end);
            if (!first || !last) return;
            const range = document.createRange();
            range.setStart(first.node, start - first.start);
            range.setEnd(last.node, end - last.start);
            const sel = window.getSelection();
            if (!sel) return;
            sel.removeAllRanges();
            sel.addRange(range);
            const anchor = first.node.parentElement;
            if (anchor && anchor.scrollIntoView) anchor.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }

        function resetFollow() {
            followRowIndex = -1;
            followChunkIndex = 0;
            lastFollowChunk = null;
            answerCellEl = null;
            clearFollowHighlight();
        }

        // 只跟当前这一行:换了行分句游标就从头开始
        function ensureFollowContext() {
            if (rows.length === 0 || !answerCellEl) return null;
            if (followRowIndex !== currentIndex) {
                followRowIndex = currentIndex;
                followChunkIndex = 0;
                lastFollowChunk = null;
                clearFollowHighlight();
            }
            return answerCellEl;
        }

        // PgDn:完整读一遍回答
        function followReadWhole() {
            const cellEl = ensureFollowContext();
            if (!cellEl) return;
            const text = collectCellTextNodes(cellEl).text.replace(/\s+/g, ' ').trim();
            if (!text) return;
            followChunkIndex = 0;
            lastFollowChunk = null;
            clearFollowHighlight();
            speakText(text);
        }

        // PgUp:依次选中当前分句并朗读(走到末尾再按就绕回第一句)
        function followNextChunk() {
            const cellEl = ensureFollowContext();
            if (!cellEl) return;
            const collected = collectCellTextNodes(cellEl);
            const chunks = splitChunksWithPositions(collected.text);
            if (chunks.length === 0) return;
            if (followChunkIndex >= chunks.length) followChunkIndex = 0;
            const chunk = chunks[followChunkIndex];
            selectInCell(collected.nodes, chunk.start, chunk.end);
            speakText(chunk.text);
            lastFollowChunk = chunk;
            followChunkIndex++;
        }

        // Del:当前选中的分句再读一遍
        function followRepeatChunk() {
            const cellEl = ensureFollowContext();
            if (!cellEl || !lastFollowChunk) return;
            const nodes = collectCellTextNodes(cellEl).nodes;
            selectInCell(nodes, lastFollowChunk.start, lastFollowChunk.end);
            speakText(lastFollowChunk.text);
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = speechSynthesis.getVoices();
            if (headers.length > 0) render();
        }

        document.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            loadTable(text);
        });

        const closeBtn = document.getElementById('closeBtn');
        closeBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'focus-table-close' }, '*');
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type !== 'focus-table-load') return;
            if (typeof data.content !== 'string' || !data.content) return;
            loadTable(data.content);
            closeBtn.classList.add('visible');
        });

        document.addEventListener('keydown', (e) => {
            // 设置栏:不带修饰键的 C。原来绑的是 Alt+H,那个键是 Chrome 的"历史记录"菜单,
            // 浏览器在页面之外处理,preventDefault 拦不住。放最前面,焦点在 AI 输入框里也能切
            if (e.code === 'KeyC' && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) {
                // 在 Columns 输入框里打字时别把设置栏关了(AI 输入框不受影响,那里就是要能切)
                if (columnsInputEl && document.activeElement === columnsInputEl) return;
                e.preventDefault();
                controlsVisible = !controlsVisible;
                localStorage.setItem('focusTableControlsVisible', String(controlsVisible));
                if (headers.length > 0) {
                    render();
                }
                return;
            }
            if (document.activeElement === aiQuestion) return;
            if (e.key === ' ' || e.code === 'Space') {
                const tag = e.target && e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                e.preventDefault();
                stopSpeaking();
                return;
            }
            if ((e.key === 's' || e.key === 'S') && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) {
                const tag = e.target && e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                const sel = window.getSelection && window.getSelection().toString().trim();
                if (!sel) return;
                e.preventDefault();
                insertSelectionIntoAi(sel);
                return;
            }
            // Answer 分句朗读:PgDn 整段、PgUp 分句、Del 重读当前分句
            if (e.code === 'PageDown' || e.code === 'PageUp' || e.code === 'Delete') {
                const tag = e.target && e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                if (!e.ctrlKey && !e.altKey && !e.metaKey) {
                    e.preventDefault();
                    if (e.code === 'PageDown') followReadWhole();
                    else if (e.code === 'PageUp') followNextChunk();
                    else followRepeatChunk();
                    return;
                }
            }
            if (rows.length === 0) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                // 焦点在输入框里时方向键挪光标,别翻页(翻页会把输入框重建掉)
                const tag = e.target && e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                e.preventDefault();
                if (currentIndex < rows.length - 1) {
                    currentIndex++;
                    render();
                    speakCurrentRow();
                }
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                const tag = e.target && e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    render();
                    speakCurrentRow();
                }
            }
        });

        // --- AI 问答 ---
        const AI_BASE_URL = 'https://next-reader-psi.vercel.app/api/minimax';
        const AI_MODEL = 'MiniMax-M3';
        const AI_MAX_TOKENS = 4096;
        let AI_SYSTEM_PROMPT = '';
        let aiMessages = [];
        let aiAbortController = null;
        let isAiStreaming = false;
        let lastPastedText = '';

        const aiPanelTitle = document.querySelector('.ai-panel-title');
        const systemPromptModal = document.getElementById('systemPromptModal');
        const systemPromptBackdrop = document.getElementById('systemPromptBackdrop');
        const systemPromptInput = document.getElementById('systemPromptInput');
        const systemPromptOk = document.getElementById('systemPromptOk');
        const systemPromptCancel = document.getElementById('systemPromptCancel');
        const systemPromptReset = document.getElementById('systemPromptReset');
        const viewContextModal = document.getElementById('viewContextModal');
        const viewContextBackdrop = document.getElementById('viewContextBackdrop');
        const viewContextBody = document.getElementById('viewContextBody');
        const viewContextCopy = document.getElementById('viewContextCopy');
        const viewContextClose = document.getElementById('viewContextClose');
        const aiPanel = document.getElementById('aiPanel');
        const aiAnswer = document.getElementById('aiAnswer');
        const aiQuestion = document.getElementById('aiQuestion');
        const aiSend = document.getElementById('aiSend');
        const aiToggle = document.getElementById('aiToggle');
        const aiFullContextToggle = document.getElementById('aiFullContext');

        const STORAGE_KEY_AI_SYSTEM_PROMPT = 'focus-table:aiSystemPrompt';
        const STORAGE_KEY_AI_FULL_CONTEXT = 'focus-table:aiFullContext';

        let aiFullContext = true;
        (function loadAiFullContext() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_AI_FULL_CONTEXT);
                if (saved !== null) aiFullContext = saved === '1';
            } catch (e) {}
            aiFullContextToggle.checked = aiFullContext;
        })();
        aiFullContextToggle.addEventListener('change', () => {
            aiFullContext = aiFullContextToggle.checked;
            try {
                localStorage.setItem(STORAGE_KEY_AI_FULL_CONTEXT, aiFullContext ? '1' : '0');
            } catch (e) {}
        });

        (function loadAiSystemPrompt() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_AI_SYSTEM_PROMPT);
                if (saved !== null) AI_SYSTEM_PROMPT = saved;
            } catch (e) {}
        })();

        function openSystemPromptModal() {
            systemPromptInput.value = AI_SYSTEM_PROMPT;
            systemPromptModal.hidden = false;
        }
        function closeSystemPromptModal() {
            systemPromptModal.hidden = true;
        }
        function saveSystemPrompt() {
            const v = systemPromptInput.value;
            if (!v.trim()) {
                localStorage.removeItem(STORAGE_KEY_AI_SYSTEM_PROMPT);
                AI_SYSTEM_PROMPT = '';
            } else {
                localStorage.setItem(STORAGE_KEY_AI_SYSTEM_PROMPT, v);
                AI_SYSTEM_PROMPT = v;
            }
            closeSystemPromptModal();
        }
        function resetSystemPrompt() {
            systemPromptInput.value = '';
        }

        function openViewContextModal() {
            const parts = buildAiContextParts();
            viewContextBody.textContent = parts.length > 0
                ? parts.join('\n\n---\n\n')
                : '(页面暂无内容)';
            viewContextModal.hidden = false;
        }
        function closeViewContextModal() {
            viewContextModal.hidden = true;
        }
        async function copyViewContext() {
            const text = viewContextBody.textContent || '';
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    viewContextBody.focus();
                    document.execCommand('copy');
                }
            } catch (e) {
                viewContextBody.focus();
                document.execCommand('copy');
            }
        }

        aiPanelTitle.addEventListener('click', (e) => {
            if (e.altKey) openViewContextModal();
            else openSystemPromptModal();
        });
        systemPromptOk.addEventListener('click', saveSystemPrompt);
        systemPromptCancel.addEventListener('click', closeSystemPromptModal);
        systemPromptReset.addEventListener('click', resetSystemPrompt);
        systemPromptBackdrop.addEventListener('click', closeSystemPromptModal);
        viewContextBackdrop.addEventListener('click', closeViewContextModal);
        viewContextClose.addEventListener('click', closeViewContextModal);
        viewContextCopy.addEventListener('click', copyViewContext);
        systemPromptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                systemPromptOk.click();
            }
        });

        function getCurrentSelectionText() {
            try {
                const sel = window.getSelection && window.getSelection();
                if (!sel) return '';
                return sel.toString().trim();
            } catch (e) {
                return '';
            }
        }

        function buildAiContextParts() {
            const ctxParts = [];
            if (aiFullContext && lastPastedText) {
                ctxParts.push(`【当前表格(markdown 原文)】\n${lastPastedText}`);
            }
            if (headers.length > 0) {
                const headerLine = headers.join(' | ');
                ctxParts.push(`【表头】\n${headerLine}`);
            }
            const row = rows[currentIndex] || [];
            if (row.length > 0) {
                const rowText = row.map((cell, i) => `${headers[i] || `列 ${i + 1}`}: ${cell}`).join('\n');
                ctxParts.push(`【用户当前正在查看的行(第 ${currentIndex + 1} / 共 ${rows.length} 行)】\n${rowText}`);
            }
            const selection = getCurrentSelectionText();
            if (selection) {
                ctxParts.push(`【用户当前选中的内容】\n${selection}`);
            }
            return ctxParts;
        }

        function buildAiMessages(userQuestion) {
            const ctxParts = buildAiContextParts();
            const ctxUser = ctxParts.length > 0
                ? ctxParts.join('\n\n---\n\n')
                : '(页面暂无内容)';
            const msgs = [
                { role: 'user', content: ctxUser },
                { role: 'assistant', content: '好的,我已了解当前表格。请提问。' },
                ...aiMessages,
                { role: 'user', content: userQuestion }
            ];
            return AI_SYSTEM_PROMPT
                ? [{ role: 'system', content: AI_SYSTEM_PROMPT }, ...msgs]
                : msgs;
        }

        function appendAiBubble(role, markdown = '') {
            const wrap = document.createElement('div');
            wrap.className = `ai-bubble ai-bubble-${role}`;
            const label = document.createElement('div');
            label.className = 'ai-bubble-label';
            label.textContent = role === 'user' ? '我' : '助手';
            const body = document.createElement('div');
            body.className = 'ai-bubble-body';
            if (role !== 'user') {
                body.dataset.markdown = markdown;
                const readBtn = document.createElement('button');
                readBtn.className = 'ai-bubble-read-btn';
                readBtn.type = 'button';
                readBtn.textContent = '朗读';
                readBtn.title = '朗读本条回复(过滤代码块)';
                readBtn.addEventListener('click', () => toggleAiRead(body, readBtn));
                label.appendChild(readBtn);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'ai-bubble-read-btn';
                copyBtn.type = 'button';
                copyBtn.textContent = '复制';
                copyBtn.title = '复制 markdown 原文';
                copyBtn.addEventListener('click', () => copyAiMarkdown(body, copyBtn));
                label.appendChild(copyBtn);
            }
            wrap.appendChild(label);
            wrap.appendChild(body);
            aiAnswer.appendChild(wrap);
            aiAnswer.scrollTop = aiAnswer.scrollHeight;
            return body;
        }

        function copyAiMarkdown(body, btn) {
            const md = body.dataset.markdown || '';
            if (!md) return;
            const onCopied = () => {
                const original = btn.textContent;
                btn.textContent = '已复制';
                setTimeout(() => { btn.textContent = original; }, 1000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(md).then(onCopied).catch(() => {
                    legacyCopy(md);
                    onCopied();
                });
            } else {
                legacyCopy(md);
                onCopied();
            }
        }

        function legacyCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (_) {}
            document.body.removeChild(ta);
        }

        function toggleAiRead(body, btn) {
            if (!('speechSynthesis' in window)) return;
            if (body.dataset.reading === 'true') {
                stopSpeaking();
                finishAiRead(body, btn);
                return;
            }
            let text = body.textContent.replace(/```[\s\S]*?```/g, ' ');
            text = text.replace(/\s+/g, ' ').trim();
            if (!text) return;
            stopSpeaking();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = speechSpeed;
            if (selectedVoiceName) {
                const voice = availableVoices.find(v => v.name === selectedVoiceName);
                if (voice) utterance.voice = voice;
            }
            utterance.onend = () => finishAiRead(body, btn);
            utterance.onerror = () => finishAiRead(body, btn);
            body.dataset.reading = 'true';
            btn.textContent = '停止';
            btn.classList.add('speaking');
            speechSynthesis.speak(utterance);
        }

        function finishAiRead(body, btn) {
            body.dataset.reading = '';
            btn.textContent = '朗读';
            btn.classList.remove('speaking');
        }

        function renderAiHistory() {
            aiAnswer.innerHTML = '';
            aiMessages.forEach(m => {
                const body = appendAiBubble(m.role === 'user' ? 'user' : 'assistant', m.content);
                body.innerHTML = marked.parse(m.content);
            });
            aiAnswer.scrollTop = aiAnswer.scrollHeight;
        }

        function setAiStreaming(enabled) {
            isAiStreaming = enabled;
            aiSend.textContent = enabled ? '停止' : '发送';
            aiSend.classList.toggle('ai-send-stopping', enabled);
            aiQuestion.disabled = enabled;
        }

        async function sendAiQuestion() {
            const q = aiQuestion.value.trim();
            if (!q) return;
            if (isAiStreaming) {
                if (aiAbortController) aiAbortController.abort();
                return;
            }
            const userBody = appendAiBubble('user');
            userBody.textContent = q;
            aiMessages.push({ role: 'user', content: q });
            aiQuestion.value = '';
            showAiAnswer();
            const asstBody = appendAiBubble('assistant');
            asstBody.classList.add('ai-bubble-streaming');
            const asstCursor = document.createElement('span');
            asstCursor.className = 'ai-cursor';
            asstBody.appendChild(asstCursor);
            let buffer = '';
            aiAbortController = new AbortController();
            setAiStreaming(true);
            try {
                const res = await fetch(AI_BASE_URL, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json', 'anthropic-version': '2023-06-01' },
                    body: JSON.stringify({
                        model: AI_MODEL,
                        max_tokens: AI_MAX_TOKENS,
                        stream: true,
                        messages: buildAiMessages(q)
                    }),
                    signal: aiAbortController.signal
                });
                if (!res.ok || !res.body) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8', { stream: true });
                let leftover = '';
                let pending = [];
                const flushBubble = () => {
                    pending.forEach(delta => { buffer += delta; });
                    pending = [];
                    asstBody.textContent = buffer;
                    asstBody.appendChild(asstCursor);
                    aiAnswer.scrollTop = aiAnswer.scrollHeight;
                };
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    leftover += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = leftover.indexOf('\n\n')) !== -1) {
                        const raw = leftover.slice(0, idx);
                        leftover = leftover.slice(idx + 2);
                        const lines = raw.split('\n');
                        let ev = 'message', data = '';
                        for (const line of lines) {
                            if (line.startsWith('event:')) ev = line.slice(6).trim();
                            else if (line.startsWith('data:')) data += line.slice(5).trim();
                        }
                        if (!data) continue;
                        if (data === '[DONE]') continue;
                        let payload;
                        try { payload = JSON.parse(data); } catch { continue; }
                        if (ev === 'content_block_delta' && payload.delta?.type === 'text_delta') {
                            pending.push(payload.delta.text || '');
                        } else if (ev === 'content_block_stop') {
                            flushBubble();
                        }
                    }
                    flushBubble();
                }
                flushBubble();
                asstBody.classList.remove('ai-bubble-streaming');
                asstBody.innerHTML = marked.parse(buffer || '(空响应)');
                asstBody.dataset.markdown = buffer;
                aiMessages.push({ role: 'assistant', content: buffer });
            } catch (err) {
                asstBody.classList.remove('ai-bubble-streaming');
                asstBody.textContent = buffer + (buffer ? '\n\n' : '') + `[错误: ${err.message}]`;
            } finally {
                aiAbortController = null;
                setAiStreaming(false);
            }
        }

        function insertSelectionIntoAi(text) {
            const ta = aiQuestion;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const before = ta.value.slice(0, start);
            const after = ta.value.slice(end);
            ta.value = before + text + after;
            const caret = start + text.length;
            ta.selectionStart = ta.selectionEnd = caret;
            ta.focus();
        }

        aiSend.addEventListener('click', sendAiQuestion);

        aiQuestion.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                sendAiQuestion();
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                if (isAiStreaming && aiAbortController) aiAbortController.abort();
                else aiQuestion.value = '';
                return;
            }
            if (e.key === 's' || e.key === 'S') {
                e.stopPropagation();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
                e.stopPropagation();
                return;
            }
        });

        function showAiAnswer() {
            aiAnswer.hidden = false;
            aiToggle.textContent = '▼ 隐藏';
        }
        function hideAiAnswer() {
            aiAnswer.hidden = true;
            aiToggle.textContent = '▲ 显示';
        }
        function toggleAiAnswer() {
            if (aiAnswer.hidden) showAiAnswer();
            else hideAiAnswer();
        }
        aiToggle.addEventListener('click', toggleAiAnswer);

        document.addEventListener('click', (e) => {
            if (aiAnswer.hidden) return;
            if (aiAnswer.contains(e.target)) return;
            if (e.target === aiToggle || aiToggle.contains(e.target)) return;
            hideAiAnswer();
        });

        // --- /AI 问答 ---

        if ('speechSynthesis' in window) {
            loadVoices();
            speechSynthesis.onvoiceschanged = loadVoices;
        }
    </script>
</body>
