<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-mermaid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
        }

        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* 子窗口里右上角有关闭按钮,给舞台右侧让出位置 */
        body.embedded .stage {
            padding-right: 72px;
        }

        /* 时序图:宽度铺满,高度超出就上下滚动(不缩图) */
        .sequence-layout {
            width: 100%;
            height: 100%;
            padding: 4px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a #262626;
        }

        .sequence-layout > svg {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-width: none !important;
        }

        .sequence-layout::-webkit-scrollbar {
            width: 12px;
        }

        .sequence-layout::-webkit-scrollbar-track {
            background: #262626;
            border-radius: 6px;
        }

        .sequence-layout::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 6px;
        }

        .sequence-layout::-webkit-scrollbar-thumb:hover {
            background: #5c5c5c;
        }

        /* 顶部角色名:不复制 SVG,直接用 HTML 排一行粘住,按 x 坐标落到各自的线上 */
        .actor-bar {
            position: sticky;
            top: 0;
            z-index: 2;
            width: 100%;
            height: 44px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
            box-shadow: 0 8px 12px -8px rgba(0, 0, 0, 0.9);
        }

        .actor-bar > span {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            max-width: 22vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e0e0e0;
            font-size: 20px;
            line-height: 44px;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 16px;
            text-align: left;
            white-space: pre-wrap;
            max-width: 80%;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 16px 20px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .mermaid-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .mermaid-container > svg {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
        }

        .status {
            position: fixed;
            bottom: 16px;
            right: 20px;
            color: #666;
            font-size: 13px;
            font-family: 'Consolas', 'Monaco', monospace;
            pointer-events: none;
        }

        #closeBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            padding: 0;
            background: rgba(40, 40, 40, 0.85);
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            display: none;
            z-index: 100;
            font-family: inherit;
        }
        #closeBtn:hover {
            background: rgba(60, 60, 60, 0.95);
            color: #fff;
            border-color: #00BFFF;
        }
        #closeBtn.visible { display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <button id="closeBtn" title="Close">×</button>
    <div class="stage" id="stage">
        <div class="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 mermaid 代码</div>
    </div>
    <div class="status" id="status"></div>

    <script>
        'use strict';

        const stage = document.getElementById('stage');
        const status = document.getElementById('status');
        let renderCounter = 0;

        if (window.mermaid) {
            window.mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'strict',
                themeVariables: {
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    background: '#1e1e1e',
                    primaryColor: '#252525',
                    primaryTextColor: '#e0e0e0',
                    primaryBorderColor: '#4fc3f7',
                    lineColor: '#81c784',
                    secondaryColor: '#2c2c2c',
                    tertiaryColor: '#1e1e1e',
                },
            });
        }

        function showHint() {
            stage.innerHTML = '';
            const hint = document.createElement('div');
            hint.className = 'hint';
            hint.innerHTML = '按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 mermaid 代码';
            stage.appendChild(hint);
            status.textContent = '';
        }

        function showError(msg) {
            stage.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = msg;
            stage.appendChild(err);
            status.textContent = '';
        }

        // 第一行是 sequenceDiagram 就铺满宽度 + 滚动,其它图照旧缩到屏幕内
        function isSequenceDiagram(code) {
            return String(code || '').trim().split('\n')[0].trim() === 'sequenceDiagram';
        }

        // 时序图很高,滚到中间就看不见最上面那排角色名了。
        // 不复制 SVG(复制来的方框会把样式带跑),直接读 mermaid 画好的 <text class="actor">
        // 的文字和 x 坐标,用普通 HTML 排一行粘在顶部;x 按 viewBox 换算成百分比,
        // 横向正好落在各自的生命线上。取不到就当没这回事,不影响主图。
        function buildActorBar(container, svgEl) {
            const vb = String(svgEl.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
            if (vb.length !== 4 || !(vb[2] > 0)) return;

            // 角色方框(actor-top)量出顶部那一排的下边界 —— 参与者多的时候 mermaid 会折行,
            // 光看 y 会只捞到第一行,所以拿方框当基准。边界都用属性算,不碰 getBBox。
            const boxes = Array.from(svgEl.querySelectorAll('rect.actor-top'));
            let boxBottom = -Infinity;
            boxes.forEach(r => {
                const y = parseFloat(r.getAttribute('y'));
                const h = parseFloat(r.getAttribute('height'));
                if (isFinite(y) && isFinite(h)) boxBottom = Math.max(boxBottom, y + h);
            });
            if (!isFinite(boxBottom)) return;

            // 角色名的 class 也是 actor,靠 y 落在方框那一排来区分顶部/底部
            const names = Array.from(svgEl.querySelectorAll('text.actor'))
                .map(t => ({
                    x: parseFloat(t.getAttribute('x')),
                    y: parseFloat(t.getAttribute('y')),
                    text: (t.textContent || '').trim(),
                }))
                .filter(n => isFinite(n.x) && isFinite(n.y) && n.text && n.y < boxBottom);
            if (names.length === 0) return;
            names.sort((a, b) => a.x - b.x);

            const bar = document.createElement('div');
            bar.className = 'actor-bar';
            names.forEach(n => {
                const el = document.createElement('span');
                el.textContent = n.text;
                el.title = n.text;
                el.style.left = (((n.x - vb[0]) / vb[2]) * 100).toFixed(3) + '%';
                bar.appendChild(el);
            });
            container.insertBefore(bar, svgEl);
        }

        async function renderMermaid(code) {
            if (!window.mermaid) {
                showError('mermaid.js 未加载,请检查网络');
                return;
            }
            const id = 'mermaid-' + (++renderCounter);
            try {
                const result = await window.mermaid.render(id, code);
                const svg = typeof result === 'string' ? result : result.svg;
                stage.innerHTML = '';
                const sequence = isSequenceDiagram(code);
                const container = document.createElement('div');
                container.className = sequence ? 'sequence-layout' : 'mermaid-container';
                container.innerHTML = svg;
                stage.appendChild(container);
                if (sequence) {
                    const svgEl = container.querySelector('svg');
                    if (svgEl) buildActorBar(container, svgEl);
                }
                const lines = code.split('\n').length;
                status.textContent = `${lines} 行 · 按 Ctrl+V 重新粘贴`;
            } catch (err) {
                const message = (err && (err.message || err.str || err.toString())) || '未知错误';
                showError('mermaid 语法错误:\n\n' + message);
            }
        }

        document.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            renderMermaid(text.trim());
        });

        const closeBtn = document.getElementById('closeBtn');
        closeBtn.addEventListener('click', () => {
            window.parent.postMessage({ type: 'focus-mermaid-close' }, '*');
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type !== 'focus-mermaid-load') return;
            if (typeof data.content !== 'string' || !data.content) return;
            renderMermaid(data.content.trim());
            closeBtn.classList.add('visible');
            document.body.classList.add('embedded');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                showHint();
            }
        });
    </script>
</body>
</html>
