<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mask</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --muted: #aaa;
            --mask-bg: #454545;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }
        .app {
            max-width: 880px;
            width: 100%;
        }
        h1 {
            margin: 0 0 4px;
            font-size: 22px;
        }
        .hint {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 16px;
        }
        .result {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px 24px;
            min-height: 220px;
            font-size: 20px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .result:empty::before {
            content: "Press Ctrl+V to paste text. Words inside ( ... ) will be masked.";
            color: var(--muted);
            font-size: 16px;
        }
        .word {
            display: inline-block;
            position: relative;
        }
        .word-first {
            color: inherit;
        }
        .word-rest {
            display: inline-block;
            background: var(--mask-bg);
            color: transparent;
            user-select: none;
            border-radius: 2px;
            transition: background-color .15s ease, color .15s ease;
        }
        .word:hover .word-rest {
            background: transparent;
            color: inherit;
        }
        body.reveal-all .word-rest {
            background: transparent;
            color: inherit;
        }
        .fallback {
            margin-top: 16px;
        }
        .fallback textarea {
            width: 100%;
            min-height: 80px;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            background: #2a2a2a;
            color: var(--text);
            padding: 10px 16px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
        }
        .toast.visible { opacity: 1; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <h1>English Mask</h1>
        <p class="hint">Press <kbd>Ctrl</kbd>+<kbd>V</kbd> (or <kbd>&#x2318;</kbd>+<kbd>V</kbd>) to paste. Press <kbd>S</kbd> to toggle masks.</p>
        <div id="result" class="result"></div>
        <div id="fallback" class="fallback" hidden>
            <p class="hint">Clipboard API unavailable. Paste here instead:</p>
            <textarea id="fallback-input" placeholder="Paste with Ctrl+V..."></textarea>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script>
        const resultEl = document.getElementById('result');
        const fallbackEl = document.getElementById('fallback');
        const fallbackInput = document.getElementById('fallback-input');
        const toastEl = document.getElementById('toast');
        // Must match the .toast `transition: opacity .2s ease` in <style>.
        // 250ms is slightly above the 200ms transition to absorb jank.
        const TOAST_FADE_MS = 250;
        let toastTimer = null;
        let toastHideTimer = null;

        function showToast(msg, ms = 1500) {
            clearTimeout(toastTimer);
            clearTimeout(toastHideTimer);
            toastEl.textContent = msg;
            toastEl.hidden = false;
            requestAnimationFrame(() => toastEl.classList.add('visible'));
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('visible');
                toastHideTimer = setTimeout(() => { toastEl.hidden = true; }, TOAST_FADE_MS);
            }, ms);
        }

        function showFallback(msg) {
            if (msg) showToast(msg, 2500);
            fallbackEl.hidden = false;
        }

        function hideFallback() {
            fallbackEl.hidden = true;
        }

        const MaskRenderer = {
            WORD_RE: /^[A-Za-z]{2,}$/,
            RUN_RE: /([A-Za-z]+|\s+|[^A-Za-z\s()])/g,

            tokenize(text) {
                const out = [];
                const len = text.length;
                let i = 0;
                while (i < len) {
                    const ch = text[i];
                    if (ch === '(') {
                        let depth = 1;
                        let j = i + 1;
                        while (j < len && depth > 0) {
                            if (text[j] === '(') depth++;
                            else if (text[j] === ')') depth--;
                            if (depth > 0) j++;
                        }
                        if (depth === 0) {
                            out.push(text.slice(i, j + 1));
                            i = j + 1;
                            continue;
                        }
                        out.push(ch);
                        i++;
                        continue;
                    }
                    this.RUN_RE.lastIndex = i;
                    const m = this.RUN_RE.exec(text);
                    if (m && m.index === i) {
                        out.push(m[0]);
                        i = m.index + m[0].length;
                    } else {
                        out.push(ch);
                        i++;
                    }
                }
                return out;
            },

            renderInsideParens(groupText) {
                const frag = document.createDocumentFragment();
                const parts = groupText.split(/([A-Za-z0-9]+|\s+|[^A-Za-z0-9\s])/g).filter(Boolean);
                for (const part of parts) {
                    if (this.WORD_RE.test(part)) {
                        const wrap = document.createElement('span');
                        wrap.className = 'word';
                        wrap.dataset.w = part;
                        const first = document.createElement('span');
                        first.className = 'word-first';
                        first.textContent = part[0];
                        const rest = document.createElement('span');
                        rest.className = 'word-rest';
                        rest.textContent = part.slice(1);
                        wrap.appendChild(first);
                        wrap.appendChild(rest);
                        frag.appendChild(wrap);
                    } else {
                        frag.appendChild(document.createTextNode(part));
                    }
                }
                return frag;
            },

            render(text) {
                const frag = document.createDocumentFragment();
                const tokens = this.tokenize(text);
                for (const tok of tokens) {
                    if (tok.startsWith('(') && tok.endsWith(')')) {
                        frag.appendChild(document.createTextNode('('));
                        frag.appendChild(this.renderInsideParens(tok.slice(1, -1)));
                        frag.appendChild(document.createTextNode(')'));
                    } else {
                        frag.appendChild(document.createTextNode(tok));
                    }
                }
                return frag;
            },
        };

        function renderText(text) {
            if (!text || text.trim() === '') {
                showToast('Nothing to paste');
                return;
            }
            hideFallback();
            resultEl.replaceChildren(MaskRenderer.render(text));
        }

        async function readClipboard() {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                showFallback('Clipboard API not available. Paste into the box below.');
                return null;
            }
            try {
                return await navigator.clipboard.readText();
            } catch (err) {
                showFallback('Clipboard read failed: ' + (err && err.message ? err.message : err));
                return null;
            }
        }

        async function handlePasteFromClipboard() {
            const text = await readClipboard();
            if (text === null) return;
            renderText(text);
        }

        window.addEventListener('keydown', (e) => {
            if (e.target === fallbackInput) return; // let the textarea's native paste through

            // S toggles reveal-all (no modifiers, not composing)
            if (!e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey && !e.isComposing &&
                (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                document.body.classList.toggle('reveal-all');
                return;
            }

            if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V') && !e.shiftKey && !e.altKey) {
                e.preventDefault();
                handlePasteFromClipboard();
            }
        });

        fallbackInput.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            e.preventDefault();
            renderText(text || '');
        });
    </script>
</body>
</html>
