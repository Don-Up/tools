<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-json</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, blinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stage {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 5vw;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 20px;
            text-align: center;
        }

        .card {
            background: rgba(37, 37, 37, 0.6);
            border: 1px solid rgba(51, 51, 51, 0.6);
            border-radius: 12px;
            padding: 60px 72px 25px 72px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
        }

        .en {
            font-size: 35px;
            line-height: 1.4;
            color: #e0e0e0;
            font-weight: 500;
            word-break: break-word;
            font-family: var(--en-font-family, "DejaVu Math TeX Gyre");
            margin-top: 20px;
        }

        .card.is-last .en {
            color: #9ccc65;
        }

        .divider {
            margin: 28px 0;
            border-top: 1px solid #555;
        }

        .cn {
            font-size: 25px;
            line-height: 1.5;
            color: #b0bec5;
            word-break: break-word;
            font-family: 华文细黑;
        }

        .status {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            margin: 0;
            text-align: center;
            color: #888;
            font-size: 18px;
            font-family: 'Consolas', 'Monaco', monospace;
            z-index: 5;
            pointer-events: none;
        }

        .status kbd {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            color: #b0bec5;
        }

        .en .word {
            transition: background-color 0.1s;
        }

        .en .word.word-active {
            background: #4fc3f7;
            color: #1e1e1e;
            border-radius: 3px;
            padding: 0 2px;
            margin: 0 -2px;
        }

        .card { cursor: pointer; }

        .card-actions {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            padding-bottom: 16px;
            border-bottom: 1px solid #555;
        }
        .copy-btn {
            background: rgba(37, 37, 37, 0.8);
            border: 1px solid #444;
            color: #b0bec5;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .copy-btn:hover { color: #fff; border-color: #666; background: rgba(60, 60, 60, 0.8); }
        .copy-btn.copied, .copy-btn.speaking { color: #4fc3f7; border-color: #4fc3f7; }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding: 10px 16px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #b0bec5;
        }

        .controls select {
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px;
            font-size: 12px;
            max-width: 280px;
        }

        .controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4fc3f7;
        }

        .controls button {
            padding: 6px 14px;
            font-size: 13px;
            color: #fff;
            background: #3a86ff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #2a6edc;
        }

        .controls input[type="range"] {
            width: 120px;
            cursor: pointer;
            accent-color: #4fc3f7;
        }

        .controls button.speaking {
            background: #ff5252;
        }

        .hidden {
            display: none !important;
        }

        .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #252525;
            color: #e0e0e0;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            z-index: 200;
        }
        .close-btn:hover { background: #3a3a3a; }

        .bg-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-modal[hidden] { display: none; }
        .bg-modal-backdrop {
            position: absolute;
            inset: 0;
            background: transparent;
        }
        .bg-modal-panel {
            position: relative;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bg-modal-title {
            font-size: 20px;
            color: #e0e0e0;
            text-align: center;
        }
        .bg-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .bg-modal-actions button {
            padding: 6px 16px;
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .bg-modal-actions button:hover { background: #3a3a3a; }
        body.has-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body.has-bg .stage {
            border-radius: 8px;
            padding: 16px;
        }
        .bg-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
            min-width: 260px;
        }
        .bg-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            color: #e0e0e0;
            font-size: 14px;
            border-radius: 4px;
        }
        .bg-list-item:hover { background: #2c2c2c; }
        .bg-preview-btn {
            background: transparent;
            color: #6cf;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 8px;
            line-height: 1;
        }
        .bg-preview-btn:hover { color: #9df; }
        .bg-delete-btn {
            background: transparent;
            color: #c66;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
            line-height: 1;
        }
        .bg-delete-btn:hover { color: #f88; }
        .bg-list:empty::before {
            content: '暂无背景图片';
            color: #666;
            font-size: 13px;
            display: block;
            text-align: center;
            padding: 8px;
        }

        .ai-box {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .ai-input {
            pointer-events: auto;
            background: rgba(37,37,37,0.9);
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            border-radius: 6px;
            outline: none;
        }
        .ai-input:focus { border-color: #4fc3f7; }
        .ai-input.ai-busy { opacity: 0.5; cursor: wait; }
        .ai-error {
            pointer-events: auto;
            color: #ef5350;
            font-size: 12px;
            background: rgba(37,37,37,0.9);
            border: 1px solid #ef5350;
            padding: 6px 8px;
            border-radius: 4px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .ai-toolbar {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
            color: #aaa;
            font-size: 12px;
        }
        .ai-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }
        .ai-toggle input[type="checkbox"] {
            cursor: pointer;
        }
        .ai-stats {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-clear-btn {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
        }
        .ai-clear-btn:hover { background: #444; }
        .ai-clear-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        body.has-code {
            padding: 48px 20px;
        }

        .stage.split {
            flex-direction: row;
            align-items: center;
            gap: 20px;
            max-width: none;
            width: 100%;
            padding: 0;
        }

        .left-col {
            flex: 3;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .code-panel {
            flex: 2;
            min-width: 0;
            background: #252525;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .code-block {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .code-block:last-child {
            border-bottom: none;
        }

        .code-lang {
            background: #1a1a1a;
            color: #888;
            font-size: 11px;
            padding: 6px 14px;
            font-family: 'Consolas', 'Monaco', monospace;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .code-pre {
            margin: 0;
            padding: 14px 18px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.55;
            color: #e0e0e0;
            white-space: pre;
            overflow: auto;
            flex: 1;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: #4a4a4a #1a1a1a;
        }
        .code-pre::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .code-pre::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .code-pre::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }
        .code-pre::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }
        .code-pre::-webkit-scrollbar-corner {
            background: #1a1a1a;
        }

        .code-pre code {
            background: transparent;
        }

        .stage.split .en {
            font-size: 34px;
        }
        .stage.split .cn {
            font-size: 19px;
        }
        .stage.split .divider {
            margin: 24px 0;
        }

        .translate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .translate-overlay.hidden { display: none; }
        .translate-text {
            color: #fff;
            font-size: 2rem;
            font-style: italic;
            letter-spacing: 0.05em;
            animation: translate-pulse 1.6s ease-in-out infinite;
        }
        @keyframes translate-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <button id="closeBtn" class="close-btn" hidden>×</button>

    <div class="ai-box">
        <div class="ai-toolbar">
            <label class="ai-toggle">
                <input type="checkbox" id="multiTurnToggle">
                <span>多轮</span>
            </label>
            <label class="ai-toggle">
                <input type="checkbox" id="autoFullscreenToggle">
                <span>auto</span>
            </label>
            <span id="aiStats" class="ai-stats" hidden>
                <span id="aiRoundCount">0</span> 轮
                <button id="aiClearBtn" type="button" class="ai-clear-btn">清空</button>
            </span>
        </div>
        <input id="aiInput" class="ai-input" type="text" autocomplete="off"
               placeholder="向 AI 提问… (Enter 发送)">
        <div id="aiError" class="ai-error" hidden></div>
    </div>

    <div class="controls hidden" id="controls">
        <label>
            <input type="checkbox" id="ttsToggle"> TTS
        </label>
        <label>
            <input type="checkbox" id="highlightToggle"> Highlight
        </label>
        <label id="voiceLabel" class="hidden">
            Voice:
            <select id="voiceSelect"></select>
        </label>
        <label id="speedLabel" class="hidden">
            Speed: <span id="speedValue">1.0</span>
            <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1.0">
        </label>
        <label>
            字体:
            <select id="enFontSelect">
                <option value='"DejaVu Math TeX Gyre"'>DejaVu</option>
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Helvetica">Helvetica</option>
                <option value='"Times New Roman"'>Times</option>
                <option value="Verdana">Verdana</option>
                <option value='"Courier New"'>Courier</option>
                <option value="sans-serif">Sans-serif</option>
            </select>
        </label>
        <button id="stopBtn" class="hidden">Stop</button>
    </div>

    <div class="stage" id="stage">
        <div class="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 JSON</div>
    </div>

    <div id="bgModal" class="bg-modal" hidden>
        <div id="bgModalBackdrop" class="bg-modal-backdrop"></div>
        <div id="bgModalPanel" class="bg-modal-panel">
            <div class="bg-modal-title">背景图片</div>
            <ul id="bgList" class="bg-list"></ul>
            <div class="bg-modal-actions">
                <button id="bgAddBtn">选择图片</button>
                <button id="bgCloseBtn">关闭</button>
            </div>
        </div>
        <input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>
    </div>

    <div id="translateOverlay" class="translate-overlay hidden">
        <div class="translate-text">translating...</div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>
        'use strict';

        let entries = [];
        let currentIndex = 0;
        let currentWordSpans = [];
        const AI_BASE_URL = 'https://next-reader-psi.vercel.app/api/minimax';
        const AI_MODEL = 'MiniMax-M3';
        const AI_MAX_TOKENS = 4096;
        const AI_SYSTEM_PROMPT = `回答用户的问题或解释用户提出的概念,按以下要求返回 JSON:

1. 你用英文作答(英文由你生成,不是用户的输入),中文作为对应翻译,两者一一对应。
2. **最小切分单位**:以分割意群的逗号（,）、破折号（— / ——）、分号（;）等作为最小 entry 单位切分;用于列举名词的逗号（如 \`columns, create, list, detail, retry\`）不切分,保留在同一 entry 内。
3. **中文必须与英文严格对应**:英文 entry 中的每部分内容,中文翻译都必须完整对应,不得省略、漏译、合并或自行简化。
4. **JSON 格式**:
   - key 为你用英文作答的片段。
   - value 为对应的中文翻译。
   - 保持你用英文作答的顺序。
5. **只返回 JSON**,不要额外解释或包裹代码块以外的文字。

**示例输出**:
{
    "The export tasks finally have a home in the UI": "导出任务终于在前端有自己的页面了",
    "Users can now open /exports": "用户现在可以打开 /exports",
    "see a paginated table of export jobs filtered by status": "看到按状态筛选的导出任务分页表",
    "switch status from a dropdown": "从下拉框切换状态",
    "and paginate through results — all read-only": "并翻页浏览结果 —— 全部只读",
    "no retry / download / create yet": "暂不支持重试 / 下载 / 创建",
    "Stage 1.10 wired up exportApi.{columns, create, list, detail, retry} and 7 domain types": "Stage 1.10 打通了 exportApi.{columns, create, list, detail, retry} 和 7 个领域类型",
    "those contracts are now consumed end-to-end inside the browser for the first time": "这些契约现在首次在浏览器内被端到端消费"
}`;
        let isAiBusy = false;
        let aiAbort = null;
        let aiErrorTimer = null;
        let multiTurnEnabled = localStorage.getItem('focusJsonAiMultiTurn') === 'true';
        let aiMessages = [];
        let autoFullscreenRead = localStorage.getItem('focusJsonAutoFullscreenRead') === 'true';
        let ttsEnabled = localStorage.getItem('focusJsonTtsEnabled') === 'true';
        let speechSpeed = parseFloat(localStorage.getItem('focusJsonSpeechSpeed')) || 1.0;
        let highlightEnabled = localStorage.getItem('focusJsonHighlightEnabled') !== 'false';
        let controlsVisible = false;
        let selectedVoice = null;
        let selectedVoiceName = localStorage.getItem('focusJsonVoiceName') || '';
        let availableVoices = [];
        let isSpeaking = false;
        let pendingAutoRead = false;
        let readingFromIndex = null;
        let currentCode = [];
        const stage = document.getElementById('stage');
        const controls = document.getElementById('controls');
        const ttsToggle = document.getElementById('ttsToggle');
        const highlightToggle = document.getElementById('highlightToggle');
        const voiceLabel = document.getElementById('voiceLabel');
        const voiceSelect = document.getElementById('voiceSelect');
        const speedLabel = document.getElementById('speedLabel');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const stopBtn = document.getElementById('stopBtn');

        const WORD_RE = /[A-Za-z][A-Za-z']*|[^A-Za-z]+/g;

        function parseJson(text) {
            let obj;
            try {
                obj = JSON.parse(text);
            } catch (err) {
                throw new Error('JSON 解析失败: ' + err.message);
            }
            if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) {
                throw new Error('输入不是 JSON 对象');
            }
            entries = Object.entries(obj).map(([en, cn]) => ({
                en: String(en),
                cn: String(cn),
            }));
            return entries.length;
        }

        function parsePlainText(text) {
            const trimmed = text.trim();
            if (!trimmed) return 0;
            const segments = trimmed.split(/(?<=[.?!])\s+/);
            entries = segments
                .map(s => s.replace(/\s+/g, ' ').trim())
                .filter(s => s.length > 0)
                .map(en => ({ en, cn: '' }));
            return entries.length;
        }

        function showError(message) {
            stage.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = message;
            stage.appendChild(err);
            stopSpeaking();
            entries = [];
            currentIndex = 0;
            currentWordSpans = [];
            readingFromIndex = null;
            currentCode = [];
            document.body.classList.remove('has-code');
            stage.classList.remove('split');
        }

        function buildEnFragment(enText) {
            WORD_RE.lastIndex = 0;
            const fragment = document.createDocumentFragment();
            const wordSpans = [];
            let lastEnd = 0;
            let m;
            while ((m = WORD_RE.exec(enText)) !== null) {
                if (m.index > lastEnd) {
                    fragment.appendChild(document.createTextNode(enText.slice(lastEnd, m.index)));
                }
                if (/^[A-Za-z]/.test(m[0])) {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = m[0];
                    fragment.appendChild(span);
                    wordSpans.push({ span, start: m.index, end: m.index + m[0].length });
                } else {
                    fragment.appendChild(document.createTextNode(m[0]));
                }
                lastEnd = m.index + m[0].length;
            }
            if (lastEnd < enText.length) {
                fragment.appendChild(document.createTextNode(enText.slice(lastEnd)));
            }
            return { fragment, wordSpans };
        }

        function clearHighlight() {
            currentWordSpans.forEach(({ span }) => span.classList.remove('word-active'));
        }

        function highlightAt(charIndex) {
            for (let i = 0; i < currentWordSpans.length; i++) {
                const w = currentWordSpans[i];
                if (charIndex >= w.start && charIndex < w.end) {
                    w.span.classList.add('word-active');
                } else {
                    w.span.classList.remove('word-active');
                }
            }
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            isSpeaking = false;
            stopBtn.classList.remove('speaking');
            document.querySelectorAll('.copy-btn.speaking').forEach(b => b.classList.remove('speaking'));
            clearHighlight();
            readingFromIndex = null;
        }

        function speakCurrentEntry({ force = false } = {}) {
            if (!force && !ttsEnabled) return;
            if (!('speechSynthesis' in window)) return;
            if (entries.length === 0) return;
            const e = entries[currentIndex];
            if (!e || !e.en) return;
            const utterance = new SpeechSynthesisUtterance(e.en);
            utterance.lang = 'en-US';
            utterance.rate = speechSpeed;
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.onboundary = (event) => {
                if (!highlightEnabled) return;
                if (event.name !== 'word' || typeof event.charIndex !== 'number') return;
                highlightAt(event.charIndex);
            };
            utterance.onend = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                document.querySelectorAll('.copy-btn.speaking').forEach(b => b.classList.remove('speaking'));
                clearHighlight();
            };
            utterance.onerror = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                document.querySelectorAll('.copy-btn.speaking').forEach(b => b.classList.remove('speaking'));
                clearHighlight();
            };
            speechSynthesis.speak(utterance);
            isSpeaking = true;
            stopBtn.classList.add('speaking');
        }

        function speakCombined(fromIndex, { force = false, onEnd = null } = {}) {
            if (!('speechSynthesis' in window)) return;
            if (!force && !ttsEnabled) return;
            if (entries.length === 0) return;
            if (fromIndex < 0 || fromIndex >= entries.length) return;

            const offsets = [];
            const parts = [];
            let cursor = 0;
            for (let k = fromIndex; k < entries.length; k++) {
                const en = entries[k] && entries[k].en;
                if (!en) continue;
                offsets.push({ entryIndex: k, start: cursor });
                parts.push(en);
                cursor += en.length + 2;
            }
            if (parts.length === 0) return;
            const text = parts.join('. ');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = speechSpeed;
            if (selectedVoice) utterance.voice = selectedVoice;

            utterance.onboundary = (event) => {
                if (!highlightEnabled) return;
                if (event.name !== 'word' || typeof event.charIndex !== 'number') return;
                const charIdx = event.charIndex;
                let targetEntry = offsets[0].entryIndex;
                let targetStart = offsets[0].start;
                for (let k = 0; k < offsets.length; k++) {
                    if (charIdx >= offsets[k].start) {
                        targetEntry = offsets[k].entryIndex;
                        targetStart = offsets[k].start;
                    } else {
                        break;
                    }
                }
                if (targetEntry !== currentIndex) {
                    currentIndex = targetEntry;
                    render();
                }
                highlightAt(charIdx - targetStart);
            };

            const finalOnEnd = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
                readingFromIndex = null;
                if (onEnd) onEnd();
            };
            utterance.onend = finalOnEnd;
            utterance.onerror = finalOnEnd;

            speechSynthesis.speak(utterance);
            isSpeaking = true;
            stopBtn.classList.add('speaking');
        }

        async function runAutoFullscreenRead() {
            if (entries.length === 0) return;
            let enteredFullscreen = false;
            if (document.documentElement.requestFullscreen) {
                try {
                    await document.documentElement.requestFullscreen();
                    enteredFullscreen = true;
                } catch (err) {
                    enteredFullscreen = false;
                }
            }
            speakCombined(0, {
                force: true,
                onEnd: () => {
                    if (enteredFullscreen && document.fullscreenElement) {
                        document.exitFullscreen().catch(() => {});
                    }
                }
            });
        }

        function loadInput(text) {
            const json = extractFirstJsonBlock(text);
            const code = extractCodeBlock(text);
            if (json) {
                loadJson(json, code);
                return;
            }
            const count = parsePlainText(text);
            if (count === 0) {
                showError('没有解析到任何条目');
                return;
            }
            stopSpeaking();
            currentIndex = 0;
            currentCode = code || [];
            render();

        function extractFirstJsonBlock(text) {
            const explicitFence = text.match(/```(?:bilingual-json|json)\s*([\s\S]*?)```/);
            if (explicitFence) return explicitFence[1].trim();
            const fenceRegex = /```(\w+)?\s*\n?([\s\S]*?)```/g;
            let m;
            while ((m = fenceRegex.exec(text)) !== null) {
                const content = m[2].trim();
                if (!content.startsWith('{')) continue;
                try {
                    JSON.parse(content);
                    return content;
                } catch (e) { /* try next fence */ }
            }
            const start = text.indexOf('{');
            if (start < 0) return null;
            let depth = 0, inStr = false, esc = false;
            for (let i = start; i < text.length; i++) {
                const c = text[i];
                if (inStr) {
                    if (esc) esc = false;
                    else if (c === '\\') esc = true;
                    else if (c === '"') inStr = false;
                } else {
                    if (c === '"') inStr = true;
                    else if (c === '{') depth++;
                    else if (c === '}') { depth--; if (depth === 0) return text.slice(start, i + 1); }
                }
            }
            return null;
        }

        function extractCodeBlock(text) {
            const regex = /```(\w+)\s*\n([\s\S]*?)```/g;
            const blocks = [];
            let m;
            while ((m = regex.exec(text)) !== null) {
                const lang = m[1].toLowerCase();
                if (lang === 'json' || lang === 'bilingual-json') continue;
                blocks.push({ lang: m[1], code: m[2] });
            }
            return blocks;
        }

        async function askAi() {
            if (isAiBusy) { aiAbort?.abort(); return; }
            const question = aiInput.value.trim();
            if (!question) return;
            aiInput.value = '';
            const userMsg = { role: 'user', content: question };
            if (multiTurnEnabled) {
                aiMessages.push(userMsg);
                aiRoundCount.textContent = aiMessages.filter(m => m.role === 'user').length;
            }
            isAiBusy = true;
            aiInput.classList.add('ai-busy');
            aiInput.placeholder = 'AI 思考中…';
            aiClearBtn.disabled = true;
            hideAiError();
            aiAbort = new AbortController();
            const messagesToSend = multiTurnEnabled ? [...aiMessages] : [userMsg];
            try {
                const res = await fetch(AI_BASE_URL, {
                    method: 'POST',
                    headers: {
                        'content-type': 'application/json',
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: AI_MODEL,
                        max_tokens: AI_MAX_TOKENS,
                        stream: false,
                        system: AI_SYSTEM_PROMPT,
                        messages: messagesToSend
                    }),
                    signal: aiAbort.signal
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const text = data.content?.[0]?.text ?? '';
                if (!text) throw new Error('AI 返回为空');
                const json = extractFirstJsonBlock(text);
                if (!json) throw new Error('响应中找不到 JSON 块');
                if (multiTurnEnabled) {
                    aiMessages.push({ role: 'assistant', content: text });
                }
                const code = extractCodeBlock(text);
                loadJson(json, code);
                if (autoFullscreenRead) {
                    runAutoFullscreenRead();
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    if (multiTurnEnabled) {
                        aiMessages.pop();
                        aiRoundCount.textContent = aiMessages.filter(m => m.role === 'user').length;
                    }
                    return;
                }
                if (multiTurnEnabled) {
                    aiMessages.push({ role: 'assistant', content: `[错误: ${err.message}]` });
                }
                showAiError(err.message);
            } finally {
                isAiBusy = false;
                aiInput.classList.remove('ai-busy');
                aiInput.placeholder = '向 AI 提问… (Enter 发送)';
                aiClearBtn.disabled = false;
                aiAbort = null;
            }
        }

        const bgModal = document.getElementById('bgModal');

        const bgCloseBtn = document.getElementById('bgCloseBtn');

        let bgImages = [];
        let currentBgId = -1;

        const DB_NAME = 'focus-json-bg';
        const DB_VERSION = 1;
        const BG_STORE = 'images';

        function openBgDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(BG_STORE)) {
                        db.createObjectStore(BG_STORE, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadAllBg() {
            const db = await openBgDb();
            return new Promise((resolve) => {
                const tx = db.transaction(BG_STORE, 'readonly');
                const req = tx.objectStore(BG_STORE).getAll();
                req.onsuccess = () => resolve((req.result || []).sort((a, b) => a.id - b.id));
                req.onerror = () => resolve([]);
            });
        }

        async function addBg(dataUrl) {
            const db = await openBgDb();
            const all = await loadAllBg();
            const name = `image${all.length + 1}`;
            return new Promise((resolve, reject) => {
                const tx = db.transaction(BG_STORE, 'readwrite');
                const store = tx.objectStore(BG_STORE);
                const req = store.add({ name, dataUrl });
                req.onsuccess = () => resolve({ id: req.result, name, dataUrl });
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteBg(id) {
            const db = await openBgDb();
            return new Promise((resolve) => {
                const tx = db.transaction(BG_STORE, 'readwrite');
                tx.objectStore(BG_STORE).delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            });
        }

        function applyBg(dataUrl, id) {
            if (dataUrl) {
                document.body.style.backgroundImage = `url(${dataUrl})`;
                document.body.classList.add('has-bg');
                currentBgId = id;
                localStorage.setItem('focusJsonCurrentBgId', String(id));

                document.body.style.backgroundImage = '';
                document.body.classList.remove('has-bg');
                currentBgId = -1;
                localStorage.removeItem('focusJsonCurrentBgId');
            }
        }

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type !== 'focus-json-load') return;
            if (typeof data.content !== 'string' || !data.content) return;
            loadInput(data.content);
            closeBtn.hidden = false;
            if (ttsEnabled && entries.length > 0) {
                if (selectedVoiceName && !selectedVoice) {
                    pendingAutoRead = true;
                } else {
                    speakCombined(0);
                }
            }
        });

        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const autoclose = urlParams.get('autoclose') === '1';
            const autotranslate = urlParams.get('autotranslate') === '1';
            if (!location.hash || location.hash.length < 2) return;
            const hashTextRaw = decodeURIComponent(location.hash.slice(1));
            if (!hashTextRaw) return;
            history.replaceState(null, '', location.pathname + location.search);
            const hashText = hashTextRaw.replace(/["“”]/g, '').replace(/查看中文翻译/g, '');

            const inIframe = window.parent && window.parent !== window;
            const onEnd = autoclose
                ? (inIframe
                    ? () => { try { window.parent.postMessage({ type: 'focus-json-close' }, '*'); } catch (e) {} }
                    : () => window.close())
                : null;

            let played = false;
            function playOnce() {
                if (played) return;
                if (entries.length === 0) return;
                played = true;
                speakCombined(0, { force: true, onEnd });
            }

            function prepareVoiceAndPlay() {
                if (selectedVoice || !selectedVoiceName) {
                    playOnce();
                    return;
                }
                let done = false;
                const onVoices = () => {
                    if (done) return;
                    done = true;
                    speechSynthesis.removeEventListener('voiceschanged', onVoices);
                    const found = availableVoices.find(v => v.name === selectedVoiceName);
                    if (found) {
                        selectedVoice = found;
                        if (voiceSelect) voiceSelect.value = String(availableVoices.indexOf(found));
                    }
                    playOnce();
                };
                speechSynthesis.addEventListener('voiceschanged', onVoices);
                loadVoices();
                setTimeout(() => {
                    if (done) return;
                    done = true;
                    speechSynthesis.removeEventListener('voiceschanged', onVoices);
                    playOnce();
                }, 1500);
            }

            function loadAndPlay(text) {
                loadInput(text);
                if (entries.length === 0) {
                    hideTranslateOverlay();
                    return;
                }
                if (inIframe && closeBtn) closeBtn.hidden = false;
                if (document.readyState === 'complete') {
                    prepareVoiceAndPlay();
                } else {
                    window.addEventListener('load', prepareVoiceAndPlay, { once: true });
                }
            }

            const overlay = document.getElementById('translateOverlay');
            function showTranslateOverlay() {
                if (overlay) overlay.classList.remove('hidden');
            }
            function hideTranslateOverlay() {
                if (overlay) overlay.classList.add('hidden');
            }

            if (autotranslate) {
                async function runTranslate() {
                    const enSentences = hashText.trim()
                        .split(/(?<=[.?!])\s+/)
                        .map(s => s.replace(/\s+/g, ' ').trim())
                        .filter(s => s.length > 0);
                    if (enSentences.length === 0) {
                        hideTranslateOverlay();
                        showError('没有识别到英文句子');
                        return;
                    }
                    showTranslateOverlay();
                    try {
                        const resp = await fetch('https://next-reader-psi.vercel.app/api/translate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                text: enSentences.join('\n'),
                                targetLang: 'ZH'
                            })
                        });
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const data = await resp.json();
                        const cnText = (data && typeof data.text === 'string' ? data.text : '').trim();
                        const cnSentences = cnText
                            .split(/(?<=[。？])\s*/)
                            .map(s => s.replace(/[""]/g, '').replace(/\s+/g, ' ').trim())
                            .filter(s => s.length > 0);
                        const pairCount = Math.min(enSentences.length, cnSentences.length);
                        if (pairCount === 0) {
                            hideTranslateOverlay();
                            showError('翻译结果为空');
                            return;
                        }
                        const result = {};
                        for (let i = 0; i < pairCount; i++) {
                            result[enSentences[i]] = cnSentences[i];
                        }
                        hideTranslateOverlay();
                        loadAndPlay(JSON.stringify(result, null, 2));
                    } catch (err) {
                        hideTranslateOverlay();
                        showError('翻译失败: ' + (err && err.message ? err.message : String(err)));
                    }
                }
                runTranslate();
                return;
            }

            hideTranslateOverlay();
            loadAndPlay(hashText);
        })();
    </script>
</body>
</html>
