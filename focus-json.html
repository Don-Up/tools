<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus-json</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, blinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 48px 5vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .hint {
            color: #888;
            font-size: 24px;
            text-align: center;
            line-height: 1.8;
        }

        .hint kbd {
            display: inline-block;
            font-family: inherit;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 2px 8px;
            color: #b0bec5;
        }

        .error {
            color: #ef5350;
            font-size: 20px;
            text-align: center;
        }

        .card {
            background: rgba(37, 37, 37, 0.6);
            border: 1px solid rgba(51, 51, 51, 0.6);
            border-radius: 12px;
            padding: 60px 72px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .en {
            font-size: 72px;
            line-height: 1.4;
            color: #e0e0e0;
            font-weight: 500;
            word-break: break-word;
        }

        .divider {
            margin: 36px 0;
            border-top: 1px solid #333;
        }

        .cn {
            font-size: 40px;
            line-height: 1.5;
            color: #b0bec5;
            word-break: break-word;
        }

        .status {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            margin: 0;
            text-align: center;
            color: #888;
            font-size: 18px;
            font-family: 'Consolas', 'Monaco', monospace;
            z-index: 5;
            pointer-events: none;
        }

        .status kbd {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            color: #b0bec5;
        }

        .en .word {
            transition: background-color 0.1s;
        }

        .en .word.word-active {
            background: #4fc3f7;
            color: #1e1e1e;
            border-radius: 3px;
            padding: 0 2px;
            margin: 0 -2px;
        }

        .card { cursor: pointer; }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding: 10px 16px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #b0bec5;
        }

        .controls select {
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px;
            font-size: 12px;
            max-width: 280px;
        }

        .controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4fc3f7;
        }

        .controls button {
            padding: 6px 14px;
            font-size: 13px;
            color: #fff;
            background: #3a86ff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #2a6edc;
        }

        .controls button.speaking {
            background: #ff5252;
        }

        .hidden {
            display: none !important;
        }

        .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #252525;
            color: #e0e0e0;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            z-index: 200;
        }
        .close-btn:hover { background: #3a3a3a; }

        .bg-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-modal[hidden] { display: none; }
        .bg-modal-backdrop {
            position: absolute;
            inset: 0;
            background: transparent;
        }
        .bg-modal-panel {
            position: relative;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bg-modal-title {
            font-size: 20px;
            color: #e0e0e0;
            text-align: center;
        }
        .bg-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .bg-modal-actions button {
            padding: 6px 16px;
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .bg-modal-actions button:hover { background: #3a3a3a; }
        body.has-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body.has-bg .stage {
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 8px;
            padding: 16px;
        }
        .bg-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
            min-width: 260px;
        }
        .bg-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            color: #e0e0e0;
            font-size: 14px;
            border-radius: 4px;
        }
        .bg-list-item:hover { background: #2c2c2c; }
        .bg-preview-btn {
            background: transparent;
            color: #6cf;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 8px;
            line-height: 1;
        }
        .bg-preview-btn:hover { color: #9df; }
        .bg-delete-btn {
            background: transparent;
            color: #c66;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
            line-height: 1;
        }
        .bg-delete-btn:hover { color: #f88; }
        .bg-list:empty::before {
            content: '暂无背景图片';
            color: #666;
            font-size: 13px;
            display: block;
            text-align: center;
            padding: 8px;
        }
    </style>
</head>
<body>
    <button id="closeBtn" class="close-btn" hidden>×</button>

    <div class="controls hidden" id="controls">
        <label>
            <input type="checkbox" id="ttsToggle"> TTS
        </label>
        <label>
            <input type="checkbox" id="highlightToggle"> Highlight
        </label>
        <label id="voiceLabel" class="hidden">
            Voice:
            <select id="voiceSelect"></select>
        </label>
        <button id="stopBtn" class="hidden">Stop</button>
    </div>

    <div class="stage" id="stage">
        <div class="hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 JSON</div>
    </div>

    <div id="bgModal" class="bg-modal" hidden>
        <div id="bgModalBackdrop" class="bg-modal-backdrop"></div>
        <div id="bgModalPanel" class="bg-modal-panel">
            <div class="bg-modal-title">背景图片</div>
            <ul id="bgList" class="bg-list"></ul>
            <div class="bg-modal-actions">
                <button id="bgAddBtn">选择图片</button>
                <button id="bgCloseBtn">关闭</button>
            </div>
        </div>
        <input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>
    </div>
    <script>
        'use strict';

        let entries = [];
        let currentIndex = 0;
        let currentWordSpans = [];
        let ttsEnabled = localStorage.getItem('focusJsonTtsEnabled') === 'true';
        let highlightEnabled = localStorage.getItem('focusJsonHighlightEnabled') !== 'false';
        let controlsVisible = false;
        let selectedVoice = null;
        let selectedVoiceName = localStorage.getItem('focusJsonVoiceName') || '';
        let availableVoices = [];
        let isSpeaking = false;
        let pendingAutoRead = false;
        let readingFromIndex = null;
        const stage = document.getElementById('stage');
        const controls = document.getElementById('controls');
        const ttsToggle = document.getElementById('ttsToggle');
        const highlightToggle = document.getElementById('highlightToggle');
        const voiceLabel = document.getElementById('voiceLabel');
        const voiceSelect = document.getElementById('voiceSelect');
        const stopBtn = document.getElementById('stopBtn');

        const WORD_RE = /[A-Za-z][A-Za-z']*|[^A-Za-z]+/g;

        function parseJson(text) {
            let obj;
            try {
                obj = JSON.parse(text);
            } catch (err) {
                throw new Error('JSON 解析失败: ' + err.message);
            }
            if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) {
                throw new Error('输入不是 JSON 对象');
            }
            entries = Object.entries(obj).map(([en, cn]) => ({
                en: String(en),
                cn: String(cn),
            }));
            return entries.length;
        }

        function showError(message) {
            stage.innerHTML = '';
            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = message;
            stage.appendChild(err);
            stopSpeaking();
            entries = [];
            currentIndex = 0;
            currentWordSpans = [];
            readingFromIndex = null;
        }

        function buildEnFragment(enText) {
            WORD_RE.lastIndex = 0;
            const fragment = document.createDocumentFragment();
            const wordSpans = [];
            let lastEnd = 0;
            let m;
            while ((m = WORD_RE.exec(enText)) !== null) {
                if (m.index > lastEnd) {
                    fragment.appendChild(document.createTextNode(enText.slice(lastEnd, m.index)));
                }
                if (/^[A-Za-z]/.test(m[0])) {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = m[0];
                    fragment.appendChild(span);
                    wordSpans.push({ span, start: m.index, end: m.index + m[0].length });
                } else {
                    fragment.appendChild(document.createTextNode(m[0]));
                }
                lastEnd = m.index + m[0].length;
            }
            if (lastEnd < enText.length) {
                fragment.appendChild(document.createTextNode(enText.slice(lastEnd)));
            }
            return { fragment, wordSpans };
        }

        function clearHighlight() {
            currentWordSpans.forEach(({ span }) => span.classList.remove('word-active'));
        }

        function highlightAt(charIndex) {
            for (let i = 0; i < currentWordSpans.length; i++) {
                const w = currentWordSpans[i];
                if (charIndex >= w.start && charIndex < w.end) {
                    w.span.classList.add('word-active');
                } else {
                    w.span.classList.remove('word-active');
                }
            }
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            isSpeaking = false;
            stopBtn.classList.remove('speaking');
            clearHighlight();
            readingFromIndex = null;
        }

        function speakCurrentEntry() {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            if (entries.length === 0) return;
            const e = entries[currentIndex];
            if (!e || !e.en) return;
            const utterance = new SpeechSynthesisUtterance(e.en);
            utterance.lang = 'en-US';
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.onboundary = (event) => {
                if (!highlightEnabled) return;
                if (event.name !== 'word' || typeof event.charIndex !== 'number') return;
                highlightAt(event.charIndex);
            };
            utterance.onend = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
            };
            utterance.onerror = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
            };
            speechSynthesis.speak(utterance);
            isSpeaking = true;
            stopBtn.classList.add('speaking');
        }

        function speakCombined(fromIndex) {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            if (entries.length === 0) return;
            if (fromIndex < 0 || fromIndex >= entries.length) return;

            const offsets = [];
            const parts = [];
            let cursor = 0;
            for (let k = fromIndex; k < entries.length; k++) {
                const en = entries[k] && entries[k].en;
                if (!en) continue;
                offsets.push({ entryIndex: k, start: cursor });
                parts.push(en);
                cursor += en.length + 2;
            }
            if (parts.length === 0) return;
            const text = parts.join('. ');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            if (selectedVoice) utterance.voice = selectedVoice;

            utterance.onboundary = (event) => {
                if (!highlightEnabled) return;
                if (event.name !== 'word' || typeof event.charIndex !== 'number') return;
                const charIdx = event.charIndex;
                let targetEntry = offsets[0].entryIndex;
                let targetStart = offsets[0].start;
                for (let k = 0; k < offsets.length; k++) {
                    if (charIdx >= offsets[k].start) {
                        targetEntry = offsets[k].entryIndex;
                        targetStart = offsets[k].start;
                    } else {
                        break;
                    }
                }
                if (targetEntry !== currentIndex) {
                    currentIndex = targetEntry;
                    render();
                }
                highlightAt(charIdx - targetStart);
            };

            utterance.onend = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
                readingFromIndex = null;
            };

            utterance.onerror = () => {
                isSpeaking = false;
                stopBtn.classList.remove('speaking');
                clearHighlight();
                readingFromIndex = null;
            };

            speechSynthesis.speak(utterance);
            isSpeaking = true;
            stopBtn.classList.add('speaking');
        }

        function speakFromIndex(i) {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            if (entries.length === 0) return;
            if (i < 0 || i >= entries.length) return;
            if (!entries[i] || !entries[i].en) return;
            stopSpeaking();
            readingFromIndex = i;
            currentIndex = i;
            render();
            speakCombined(i);
        }

        function render() {
            stage.innerHTML = '';
            if (entries.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'hint';
                hint.innerHTML = '按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴 JSON';
                stage.appendChild(hint);
                currentWordSpans = [];
                return;
            }
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = String(currentIndex);
            const en = document.createElement('div');
            en.className = 'en';
            const { fragment, wordSpans } = buildEnFragment(entries[currentIndex].en);
            en.appendChild(fragment);
            currentWordSpans = wordSpans;
            card.appendChild(en);
            const divider = document.createElement('div');
            divider.className = 'divider';
            card.appendChild(divider);
            const cn = document.createElement('div');
            cn.className = 'cn';
            cn.textContent = entries[currentIndex].cn;
            card.appendChild(cn);
            stage.appendChild(card);

            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = `${currentIndex + 1} / ${entries.length}`;
            stage.appendChild(status);

            card.addEventListener('click', () => {
                speakFromIndex(parseInt(card.dataset.index, 10));
            });
        }

        function loadJson(text) {
            try {
                parseJson(text);
            } catch (err) {
                showError(err.message);
                return;
            }
            if (entries.length === 0) {
                showError('没有解析到任何条目');
                return;
            }
            stopSpeaking();
            currentIndex = 0;
            render();
        }

        function updateControlsVisibility() {
            voiceLabel.classList.toggle('hidden', !ttsEnabled);
            stopBtn.classList.toggle('hidden', !ttsEnabled);
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = 'Default';
            voiceSelect.appendChild(defaultOpt);
            availableVoices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);
            });
            if (selectedVoiceName) {
                const idx = availableVoices.findIndex(v => v.name === selectedVoiceName);
                if (idx >= 0) {
                    voiceSelect.value = String(idx);
                    selectedVoice = availableVoices[idx];
                }
            }
            if (pendingAutoRead && ttsEnabled && entries.length > 0 && !isSpeaking) {
                pendingAutoRead = false;
                speakCombined(0);
            }
        }

        ttsToggle.checked = ttsEnabled;
        highlightToggle.checked = highlightEnabled;
        controls.classList.add('hidden');
        updateControlsVisibility();

        ttsToggle.addEventListener('change', (e) => {
            ttsEnabled = e.target.checked;
            localStorage.setItem('focusJsonTtsEnabled', String(ttsEnabled));
            updateControlsVisibility();
            if (!ttsEnabled) stopSpeaking();
        });

        highlightToggle.addEventListener('change', (e) => {
            highlightEnabled = e.target.checked;
            localStorage.setItem('focusJsonHighlightEnabled', String(highlightEnabled));
            if (!highlightEnabled) clearHighlight();
        });

        voiceSelect.addEventListener('change', (e) => {
            const idx = parseInt(e.target.value, 10);
            if (Number.isFinite(idx) && idx >= 0 && availableVoices[idx]) {
                selectedVoice = availableVoices[idx];
                localStorage.setItem('focusJsonVoiceName', selectedVoice.name);
            } else {
                selectedVoice = null;
                localStorage.removeItem('focusJsonVoiceName');
            }
        });

        stopBtn.addEventListener('click', () => {
            stopSpeaking();
        });

        document.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            e.preventDefault();
            loadJson(text);
        });

        document.addEventListener('keydown', (e) => {
            if (entries.length === 0) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                readingFromIndex = null;
                stopSpeaking();
                currentIndex = (currentIndex + 1) % entries.length;
                render();
                if (ttsEnabled) speakCurrentEntry();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                readingFromIndex = null;
                stopSpeaking();
                currentIndex = (currentIndex - 1 + entries.length) % entries.length;
                render();
                if (ttsEnabled) speakCurrentEntry();
            }
        });

        if ('speechSynthesis' in window) {
            loadVoices();
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        window.addEventListener('keydown', (e) => {
            if (e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey && (e.key === 'h' || e.key === 'H')) {
                e.preventDefault();
            }
        }, true);

        window.addEventListener('keyup', (e) => {
            if (e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey && (e.key === 'h' || e.key === 'H')) {
                e.preventDefault();
                controlsVisible = !controlsVisible;
                controls.classList.toggle('hidden', !controlsVisible);
            }
        }, true);

        // --- Background image (Ctrl+I) ---
        const bgModal = document.getElementById('bgModal');
        const bgModalBackdrop = document.getElementById('bgModalBackdrop');
        const bgList = document.getElementById('bgList');
        const bgAddBtn = document.getElementById('bgAddBtn');
        const bgCloseBtn = document.getElementById('bgCloseBtn');
        const bgFileInput = document.getElementById('bgFileInput');

        let bgImages = [];
        let currentBgId = -1;

        const DB_NAME = 'focus-json-bg';
        const DB_VERSION = 1;
        const BG_STORE = 'images';

        function openBgDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(BG_STORE)) {
                        db.createObjectStore(BG_STORE, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadAllBg() {
            const db = await openBgDb();
            return new Promise((resolve) => {
                const tx = db.transaction(BG_STORE, 'readonly');
                const req = tx.objectStore(BG_STORE).getAll();
                req.onsuccess = () => resolve((req.result || []).sort((a, b) => a.id - b.id));
                req.onerror = () => resolve([]);
            });
        }

        async function addBg(dataUrl) {
            const db = await openBgDb();
            const all = await loadAllBg();
            const name = `image${all.length + 1}`;
            return new Promise((resolve, reject) => {
                const tx = db.transaction(BG_STORE, 'readwrite');
                const store = tx.objectStore(BG_STORE);
                const req = store.add({ name, dataUrl });
                req.onsuccess = () => resolve({ id: req.result, name, dataUrl });
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteBg(id) {
            const db = await openBgDb();
            return new Promise((resolve) => {
                const tx = db.transaction(BG_STORE, 'readwrite');
                tx.objectStore(BG_STORE).delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            });
        }

        function applyBg(dataUrl, id) {
            if (dataUrl) {
                document.body.style.backgroundImage = `url(${dataUrl})`;
                document.body.classList.add('has-bg');
                currentBgId = id;
                localStorage.setItem('focusJsonCurrentBgId', String(id));
            } else {
                document.body.style.backgroundImage = '';
                document.body.classList.remove('has-bg');
                currentBgId = -1;
                localStorage.removeItem('focusJsonCurrentBgId');
            }
        }

        function renderBgList() {
            bgList.innerHTML = '';
            bgImages.forEach(img => {
                const li = document.createElement('li');
                li.className = 'bg-list-item';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'bg-name';
                nameSpan.textContent = img.name;
                const previewBtn = document.createElement('button');
                previewBtn.className = 'bg-preview-btn';
                previewBtn.textContent = '👁';
                previewBtn.title = '预览';
                previewBtn.addEventListener('click', () => {
                    applyBg(img.dataUrl, img.id);
                });
                const delBtn = document.createElement('button');
                delBtn.className = 'bg-delete-btn';
                delBtn.textContent = '×';
                delBtn.title = '删除';
                delBtn.addEventListener('click', async () => {
                    await deleteBg(img.id);
                    bgImages = bgImages.filter(b => b.id !== img.id);
                    if (currentBgId === img.id) applyBg(null);
                    renderBgList();
                });
                li.appendChild(nameSpan);
                li.appendChild(previewBtn);
                li.appendChild(delBtn);
                bgList.appendChild(li);
            });
        }

        bgAddBtn.addEventListener('click', () => bgFileInput.click());

        bgFileInput.addEventListener('change', () => {
            const file = bgFileInput.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                bgFileInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    const rec = await addBg(reader.result);
                    bgImages.push(rec);
                    renderBgList();
                    bgFileInput.value = '';
                } catch (err) {
                    console.error('[bg] addBg error:', err);
                }
            };
            reader.readAsDataURL(file);
        });

        bgCloseBtn.addEventListener('click', () => { bgModal.hidden = true; });
        bgModalBackdrop.addEventListener('click', () => { bgModal.hidden = true; });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyI') {
                e.preventDefault();
                renderBgList();
                bgModal.hidden = false;
            }
        });

        loadAllBg().then(list => {
            bgImages = list;
            const savedId = parseInt(localStorage.getItem('focusJsonCurrentBgId'), 10);
            if (!isNaN(savedId) && bgImages.some(b => b.id === savedId)) {
                const img = bgImages.find(b => b.id === savedId);
                applyBg(img.dataUrl, savedId);
            }
        });

        // --- iframe integration (parent = reader.html) ---
        const closeBtn = document.getElementById('closeBtn');
        closeBtn.addEventListener('click', () => {
            stopSpeaking();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'focus-json-close' }, '*');
            }
        });
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type !== 'focus-json-load') return;
            if (typeof data.content !== 'string' || !data.content) return;
            loadJson(data.content);
            closeBtn.hidden = false;
            if (ttsEnabled && entries.length > 0) {
                if (selectedVoiceName && !selectedVoice) {
                    pendingAutoRead = true;
                } else {
                    speakCombined(0);
                }
            }
        });
    </script>
</body>
</html>
