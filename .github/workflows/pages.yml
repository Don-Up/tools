name: Deploy Pages

on:
  push:
    branches: ["main"]
  # 手动触发:Pages 出问题时可以直接在这里点 "Run workflow" 重新发布
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一个站点只允许一次发布在跑,新的 push 直接顶掉旧的,避免队列堆死
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # enablement: true -> 站点如果被 unpublish 过,这里会重新启用
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
