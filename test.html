<div id="back">
    <div style="display: flex;flex-direction: column;align-items: center">
        <div id="backText" class="mask-container"
             style="font-size:22px;font-family:'SimSun';margin-top:40px;text-align: center;line-height: 1.2;margin-left:15%;margin-right:15%;">
            {{Back}}<br>
            <hr>
            {{Back1}}
            <hr>
        </div>
        <div id="cn" style="margin-top: 10px;font-family:微软雅黑;font-size:18px;color:#ccc;text-align:center">
            {{CN}}
        </div>
        <div class="tip" id="en">{{Back}}</div>
        <div class="tip" id="en1">{{Back1}}</div>
        <div style="margin-top:30px"><span>{{Audio}}<span style="display: none"></span>{{Audio1}}<span
                style="display: none"></span></span></div>
        <div style="display: flex">
            <button id="play1">Sentence 1</button>
            <button id="btnFirstLetter">First Letter</button>
            <button id="play2">Sentence 2</button>
        </div>
    </div>
    <hr>
    {{Plus}}
</div>

<style>
    .tip {
        margin-top: 30px;
    }

    input {
        font-size: 15px;
    }

    .word {
        position: relative;
        display: inline-block; /* 保持伪元素和文本的大小一致 */
    }

    .word::before {
        content: ""; /* 生成伪元素 */
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #454545;
        opacity: 1; /* 默认显示遮罩 */
        pointer-events: none; /* 让鼠标事件穿透到下层元素 */
        border-radius: 1px;
    }

    .word:hover::before {
        opacity: 0; /* 悬停时隐藏遮罩 */
    }
</style>

<script>
    document.getElementById("btnFirstLetter").addEventListener("click", () => {
        document.querySelectorAll(".first").forEach(first => {
            if (first.classList.contains("word")) {
                first.classList.remove("word")
            } else {
                first.classList.add("word")
            }
        })
    })

    document.querySelectorAll(".tip").forEach(textBlock => {
        const tip = textBlock.textContent
            .replaceAll("(：", "")
            .replaceAll(")：", "").trim()
            .replace(/\[.*?\]/g, '')
            .replace(/[\u4e00-\u9fff]/g, "")
            .replace(/、/g, "")
            .split(" ").map(word => {
                const end = (word.endsWith(",") ? "," : (word.endsWith(".") ? "." : (word.endsWith("?") ? "?" : (word.endsWith("!") ? "!" : (word.endsWith("!") ? "!" : (word.endsWith(":") ? ":" : ""))))))
                return ["...", "the", "...,", "and"]
                    .includes(word) ? word : (`<span class="first">${word[0]}</span>` || "") + (word.length === 2 ? (`<span class="first">${word[1]}</span>` || "") : (end ? `<span class="word">${word.slice(1, word.length - 1)}</span>` : `<div class="word">${word.slice(1, word.length)}</div>`) + end)
            })
            .join(" ")
        textBlock.innerHTML = `${tip}`
    })

    // 朗读指定文本
    function speakText(text, isEn = false, stop = true, onEnd = () => {}) {
        if (!text) return;

        // 停止当前播放（防止堆积）
        if (stop) {
            window.speechSynthesis.cancel();
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = isEn ? 2 : 1.5;
        utterance.onend = function(event) {
            onEnd()
        };

        function findVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v =>
                v.name === (isEn ? "Microsoft David - English (United States)" : "Microsoft Yaoyao - Chinese (Simplified, PRC)") &&
                v.lang === (isEn ? "en-US" : "zh-CN")
            );
        }

        // 尝试找到指定语音
        let voice = findVoice();
        if (voice) {
            utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        } else {
            // 等待语音加载
            window.speechSynthesis.onvoiceschanged = () => {
                voice = findVoice();
                utterance.voice = voice || null;
                utterance.lang = voice ? voice.lang : "zh-CN";
                window.speechSynthesis.speak(utterance);
                // 移除监听器，防止多次触发
                window.speechSynthesis.onvoiceschanged = null;
            };
        }

        window.speechSynthesis.on
    }

    document.getElementById("play1").addEventListener("click", () => {
        document.getElementById("backText").classList.remove("mask-container")
        const en = document.getElementById("en").textContent
        const cn = document.getElementById("cn").innerHTML.split("<br>")[0]
        speakText(document.getElementById("cn").innerHTML.split("<br>")[0], false, true, () => {
            document.getElementById("backText").classList.add("mask-container")
        })
        copyToClipboard(cn+"::"+`~${en}~~`)
    })

    document.getElementById("play2").addEventListener("click", () => {
        document.getElementById("backText").classList.remove("mask-container")
        const en = document.getElementById("en1").textContent
        const cn = document.getElementById("cn").innerHTML.split("<br>")[1]
        speakText(document.getElementById("cn").innerHTML.split("<br>")[1], false, true, () => {
            document.getElementById("backText").classList.add("mask-container")
        })
        copyToClipboard(cn+"::"+`~${en}~~`)
    })

    function copyToClipboard(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text.trim();
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand("copy");
            console.log("Copied to clipboard");
        } catch (err) {
            console.error("Failed to copy:", err);
        }
        document.body.removeChild(textarea);
    }
</script>
