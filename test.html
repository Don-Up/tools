<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather-maker 测试</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 32px 48px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.12);
            position: relative;
            z-index: 1;
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 20px; color: #94a3b8; font-size: 14px; }
        button {
            margin: 4px;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
<div class="card">
    <h1>🌧️ weather-maker 测试</h1>
    <p>点击按钮切换效果。声音需先点击页面后才会响。</p>
    <button id="btnRain">下雨</button>
    <button id="btnStorm">雷暴</button>
    <button id="btnClear">清除</button>
</div>

<script type="module">
    // 通过 esm.sh 加载 npm 包，自动处理模块依赖
    import { WeatherMaker } from 'https://esm.sh/@hallencj/weather-maker';

    const fx = new WeatherMaker(document.body, {
        intensity: 'medium',  // 'light' | 'medium' | 'heavy'
        sound: true,
        zIndex: 9999
    });

    document.getElementById('btnRain').onclick = () => fx.rain();
    document.getElementById('btnStorm').onclick = () => fx.storm();
    document.getElementById('btnClear').onclick = () => fx.clear();
</script>
</body>
</html>
