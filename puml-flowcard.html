<div id="source-text">
    {{Front}}
</div>

<style>
#source-text { display: none; }
#flowchart-container {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fefefe;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.flowchart { overflow-x: auto; }
.node-label { font-size: 14px; fill: #333; }
.node-input {
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    width: 120px;
    background: #fff;
}
.node-input:focus { border-color: #3a86ff; outline: none; }
.arrow-line { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
.branch-box { fill: #f5f5f5; stroke: #999; stroke-width: 1; }
</style>

<script>
(function() {
    var sourceEl = document.getElementById('source-text');
    var puml = sourceEl ? sourceEl.textContent.trim() : '';
    if (!puml) return;

    var container = document.createElement('div');
    container.id = 'flowchart-container';
    container.innerHTML = '<div class="flowchart" id="flowchart"></div>';
    sourceEl.parentNode.insertBefore(container, sourceEl.nextSibling);

    function tokenize(puml) {
        var tokens = [];
        var lines = puml.split('\n');
        var i = 0;
        while (i < lines.length) {
            var line = lines[i].trim();
            if (!line || line.startsWith("'") || line.startsWith("/")) {
                i++;
                continue;
            }
            if (line === "start") {
                tokens.push({ type: "START" });
                i++;
            } else if (line === "stop") {
                tokens.push({ type: "STOP" });
                i++;
            } else if (line.startsWith("if(")) {
                var match = line.match(/^if\((.+?)\)\s*then$/);
                if (match) {
                    tokens.push({ type: "IF", condition: match[1] });
                    i++;
                    var thenActions = [];
                    while (i < lines.length && !lines[i].includes("else") && !lines[i].includes("endif")) {
                        var a = lines[i].trim();
                        if (a && !a.startsWith("'") && !a.startsWith("/")) {
                            if (a.startsWith(":")) thenActions.push(a);
                        }
                        i++;
                    }
                    tokens.push({ type: "THEN_ACTIONS", actions: thenActions });
                    if (i < lines.length && lines[i].includes("else")) {
                        tokens.push({ type: "ELSE" });
                        i++;
                        var elseActions = [];
                        while (i < lines.length && !lines[i].includes("endif")) {
                            var a = lines[i].trim();
                            if (a && !a.startsWith("'") && !a.startsWith("/")) {
                                if (a.startsWith(":")) elseActions.push(a);
                            }
                            i++;
                        }
                        tokens.push({ type: "ELSE_ACTIONS", actions: elseActions });
                    }
                    if (i < lines.length && lines[i].includes("endif")) {
                        tokens.push({ type: "ENDIF" });
                        i++;
                    }
                }
            } else if (line.startsWith(":")) {
                tokens.push({ type: "ACTION", raw: line });
                i++;
            } else {
                i++;
            }
        }
        return tokens;
    }

    function parseAction(raw) {
        var match = raw.match(/^:\s*(.+?)~([^~]+)~~;?$/);
        if (match) {
            return { label: match[1].trim(), placeholder: match[2].trim() };
        }
        var simple = raw.match(/^:\s*(.+?)\s*;?$/);
        if (simple) {
            return { label: simple[1].trim(), placeholder: null };
        }
        return { label: raw, placeholder: null };
    }

    function buildAST(tokens) {
        var ast = [];
        var i = 0;
        while (i < tokens.length) {
            var t = tokens[i];
            if (t.type === "START") {
                ast.push({ type: "start" });
                i++;
            } else if (t.type === "STOP") {
                ast.push({ type: "stop" });
                i++;
            } else if (t.type === "IF") {
                var ifNode = { type: "if", condition: t.condition, thenBlock: [], elseBlock: [] };
                i++;
                while (i < tokens.length && tokens[i].type === "THEN_ACTIONS") {
                    tokens[i].actions.forEach(function(a) { ifNode.thenBlock.push(parseAction(a)); });
                    i++;
                }
                if (i < tokens.length && tokens[i].type === "ELSE") {
                    i++;
                    while (i < tokens.length && tokens[i].type === "ELSE_ACTIONS") {
                        tokens[i].actions.forEach(function(a) { ifNode.elseBlock.push(parseAction(a)); });
                        i++;
                    }
                }
                if (i < tokens.length && tokens[i].type === "ENDIF") {
                    i++;
                }
                ast.push(ifNode);
            } else if (t.type === "ACTION") {
                ast.push({ type: "action", label: parseAction(t.raw).label, placeholder: parseAction(t.raw).placeholder });
                i++;
            } else {
                i++;
            }
        }
        return ast;
    }

    function layoutFlowchart(ast) {
        var NODE_W = 180;
        var NODE_H = 60;
        var GAP_Y = 50;
        var GAP_X = 40;
        var y = 20;
        var nodes = [];
        ast.forEach(function(node, idx) {
            if (node.type === "start" || node.type === "stop") {
                nodes.push({ type: node.type, x: 300, y: y, w: NODE_W, h: NODE_H, id: idx });
                y += NODE_H + GAP_Y;
            } else if (node.type === "action") {
                var w = Math.max(NODE_W, node.label.length * 10 + 80);
                nodes.push({ type: "action", label: node.label, placeholder: node.placeholder, x: 300, y: y, w: w, h: NODE_H, id: idx });
                y += NODE_H + GAP_Y;
            } else if (node.type === "if") {
                var ifNode = { type: "if", condition: node.condition, x: 300, y: y, w: NODE_W, h: NODE_H, id: idx };
                nodes.push(ifNode);
                y += NODE_H + GAP_Y;
                var thenMaxW = node.thenBlock.reduce(function(m, a) { return Math.max(m, a.label.length * 10 + 80); }, NODE_W);
                var elseMaxW = node.elseBlock.reduce(function(m, a) { return Math.max(m, a.label.length * 10 + 80); }, NODE_W);
                var totalW = thenMaxW + elseMaxW + GAP_X;
                var startX = 300 + NODE_W / 2 - totalW / 2;
                node.thenBlock.forEach(function(a, ai) {
                    nodes.push({ type: "action", label: a.label, placeholder: a.placeholder, x: startX + thenMaxW / 2, y: y, w: thenMaxW, h: NODE_H, id: idx + "_then_" + ai, branch: "then" });
                });
                y += NODE_H + GAP_Y / 2;
                node.elseBlock.forEach(function(a, ai) {
                    nodes.push({ type: "action", label: a.label, placeholder: a.placeholder, x: startX + thenMaxW + GAP_X + elseMaxW / 2, y: nodes[nodes.length - 1].y || y - NODE_H - GAP_Y / 2, w: elseMaxW, h: NODE_H, id: idx + "_else_" + ai, branch: "else" });
                });
                y += NODE_H + GAP_Y;
            }
        });
        return nodes;
    }

    function renderFlowchart(ast) {
        var nodes = layoutFlowchart(ast);
        var svgW = 700, svgH = nodes.length * 110 + 40;
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '">';
        svg += '<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>';
        var prevY = null, prevX = null;
        var NODE_W = 180, NODE_H = 60;
        nodes.forEach(function(n, i) {
            if (n.type === "start") {
                svg += '<ellipse cx="' + n.x + '" cy="' + (n.y + NODE_H / 2) + '" rx="' + (NODE_W / 2) + '" ry="' + (NODE_H / 2 - 4) + '" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>';
                svg += '<text x="' + n.x + '" y="' + (n.y + NODE_H / 2 + 5) + '" text-anchor="middle" class="node-label" fill="white" font-weight="bold">START</text>';
                if (prevY !== null) {
                    svg += '<line x1="' + prevX + '" y1="' + prevY + '" x2="' + n.x + '" y2="' + n.y + '" class="arrow-line"/>';
                }
                prevX = n.x; prevY = n.y + NODE_H;
            } else if (n.type === "stop") {
                svg += '<ellipse cx="' + n.x + '" cy="' + (n.y + NODE_H / 2) + '" rx="' + (NODE_W / 2) + '" ry="' + (NODE_H / 2 - 4) + '" fill="#f44336" stroke="#c62828" stroke-width="2"/>';
                svg += '<text x="' + n.x + '" y="' + (n.y + NODE_H / 2 + 5) + '" text-anchor="middle" class="node-label" fill="white" font-weight="bold">STOP</text>';
                if (prevY !== null) {
                    svg += '<line x1="' + prevX + '" y1="' + prevY + '" x2="' + n.x + '" y2="' + n.y + '" class="arrow-line"/>';
                }
                prevX = n.x; prevY = n.y + NODE_H;
            } else if (n.type === "if") {
                var condText = n.condition.length > 15 ? n.condition.substring(0, 12) + "..." : n.condition;
                svg += '<polygon points="' + (n.x - NODE_W/2) + ',' + n.y + ' ' + (n.x + NODE_W/2) + ',' + n.y + ' ' + (n.x + NODE_W/2) + ',' + (n.y + NODE_H) + ' ' + (n.x - NODE_W/2) + ',' + (n.y + NODE_H) + '" class="branch-box"/>';
                svg += '<text x="' + n.x + '" y="' + (n.y + 22) + '" text-anchor="middle" class="node-label" font-weight="bold">' + condText + '</text>';
                // Yes arrow - left side (to then branch)
                svg += '<line x1="' + (n.x - NODE_W/2) + '" y1="' + (n.y + NODE_H/3) + '" x2="' + (n.x - NODE_W/2 - 20) + '" y2="' + (n.y + NODE_H/3) + '" class="arrow-line"/>';
                svg += '<text x="' + (n.x - NODE_W/2 - 22) + '" y="' + (n.y + NODE_H/3 + 4) + '" class="node-label" font-size="10" text-anchor="end">是</text>';
                // No arrow - right side (to else branch)
                svg += '<line x1="' + (n.x + NODE_W/2) + '" y1="' + (n.y + NODE_H*2/3) + '" x2="' + (n.x + NODE_W/2 + 20) + '" y2="' + (n.y + NODE_H*2/3) + '" class="arrow-line"/>';
                svg += '<text x="' + (n.x + NODE_W/2 + 22) + '" y="' + (n.y + NODE_H*2/3 + 4) + '" class="node-label" font-size="10">否</text>';
                if (prevY !== null) {
                    svg += '<line x1="' + prevX + '" y1="' + prevY + '" x2="' + n.x + '" y2="' + n.y + '" class="arrow-line"/>';
                }
                prevX = n.x; prevY = n.y + NODE_H;
            } else if (n.type === "action") {
                svg += '<rect x="' + (n.x - n.w/2) + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="8" fill="#fff" stroke="#3a86ff" stroke-width="2"/>';
                var labelText = n.label.length > 14 ? n.label.substring(0, 11) + "..." : n.label;
                svg += '<text x="' + n.x + '" y="' + (n.y + 20) + '" text-anchor="middle" class="node-label">' + labelText + '</text>';
                if (n.placeholder) {
                    var inputW = Math.min(140, n.placeholder.length * 8 + 20);
                    svg += '<foreignObject x="' + (n.x - inputW/2) + '" y="' + (n.y + 28) + '" width="' + inputW + '" height="26">';
                    svg += '<input xmlns="http://www.w3.org/1999/xhtml" class="node-input" placeholder="' + n.placeholder + '" style="width:100%;box-sizing:border-box;"/>';
                    svg += '</foreignObject>';
                }
                if (prevY !== null) {
                    svg += '<line x1="' + prevX + '" y1="' + prevY + '" x2="' + n.x + '" y2="' + n.y + '" class="arrow-line"/>';
                }
                prevX = n.x; prevY = n.y + NODE_H;
            }
        });
        svg += '</svg>';
        return svg;
    }

    var tokens = tokenize(puml);
    var ast = buildAST(tokens);
    var svg = renderFlowchart(ast);
    var flowchartEl = document.getElementById('flowchart');
    if (flowchartEl) flowchartEl.innerHTML = svg;
})();
</script>
