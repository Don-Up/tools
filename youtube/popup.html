<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Shorts Auto Next</title>
  <style>
    body {
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 220px;
      padding: 12px;
      margin: 0;
      color: #222;
      background: #fff;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 60px;
      padding: 2px 4px;
      font: inherit;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Shorts Auto Next</h1>
  <label><input type="checkbox" id="enabled" checked> 启用自动跳转</label>
  <div class="row">提前 <input type="number" id="lead" min="0" max="5" step="0.5" value="0"> 秒</div>
  <div class="hint">Alt+N 立即跳过当前</div>
  <script src="popup.js"></script>
</body>
</html>
