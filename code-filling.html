<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style/code-filling.css"></link>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css">
    <style>
        select {
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 2px;
        }
        select option {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        /* Tab styles */
        .tab-container {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: #252525;
            border-bottom: 1px solid #333;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            background: #333;
            color: #aaa;
            border: none;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #444;
            color: #ddd;
        }

        .tab.active {
            background: #1e1e1e;
            color: #fff;
        }

        .tab-close {
            margin-left: 8px;
            color: #888;
            font-size: 12px;
        }

        .tab-close:hover {
            color: #ff6b6b;
        }

        .add-tab-btn {
            padding: 8px 12px;
            background: #2a2a2a;
            color: #888;
            border: 1px dashed #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-tab-btn:hover {
            background: #333;
            color: #aaa;
            border-color: #555;
        }

        .tab-content {
            display: none;
            position: absolute;
            margin-top: 140px;
            padding-left: 20px;
            padding-right: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-content.active {
            display: block;
        }

        .code-wrapper {
            max-width: 50%;
            width: 50%;
        }
    </style>
</head>
<body>
<div id="front-content">
    <div style="position: fixed;background: #333333;width: 100vw;z-index: 100;padding-bottom: 10px;">
        <div style="font-weight: bold;text-align:center;font-size: 30px;padding: 10px 0">
            CODE FILLING
        </div>
        <div class="tab-container" id="tabContainer">
            <!-- Tabs will be added here dynamically -->
            <button class="add-tab-btn" id="addTabBtn">+ Add Tab</button>
        </div>
    </div>

    <audio id="dingSound" src="mp3/bounce.mp3"></audio>

<div id="tabContents">
        <!-- Tab contents will be added here dynamically -->
    </div>
</div>


<script>
    function onKeydown(event) {
        if (event.key === 'F3') {
            const comments = document.querySelectorAll(".comment");
            comments.forEach(element => {
                element.style.visibility =
                    (element.style.visibility !== 'hidden') ? 'hidden' : 'visible';
            });
        }
    }

    function bindKeyEvent() {
        document.removeEventListener("keydown", onKeydown);
        document.addEventListener("keydown", onKeydown);
    }

    const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
            if (mutation.type === "childList" && mutation.addedNodes.length > 0) {
                bindKeyEvent();
            }
        }
    });

    observer.observe(document.body, { childList: true, subtree: true });
    bindKeyEvent();
</script>


<script>
    // Tab management
    let tabCount = 0;
    let activeTabId = null;

    // Timer management for inputs
    const inputTimers = {};

    // Helper function to start timer for an input
    function startTimerForInput(input, minutes) {
        const totalSeconds = minutes * 60;
        input.dataset.timerStarted = 'true';
        input.dataset.timerTotalSeconds = totalSeconds;
        input.dataset.timerOriginal = `${minutes}m`;
        input.dataset.timerStartTime = Date.now();
        input.className = '';

        const timerId = setInterval(() => {
            const elapsed = Math.floor((Date.now() - parseInt(input.dataset.timerStartTime, 10)) / 1000);
            const remaining = parseInt(input.dataset.timerTotalSeconds, 10) - elapsed;

            if (remaining <= 0) {
                clearInterval(timerId);
                delete inputTimers[input.dataset.timerId];
                input.value = input.dataset.timerOriginal || '';
                input.className = 'orange';
                input.style.background = '#ff6666';
                delete input.dataset.timerStarted;
                delete input.dataset.timerTotalSeconds;
                delete input.dataset.timerOriginal;
                delete input.dataset.timerStartTime;
                delete input.dataset.timerId;
                const ding = document.getElementById('dingSound');
                if (ding) ding.play();
                const tabContent = input.closest('.tab-content');
                if (tabContent) {
                    const tabId = tabContent.dataset.tabId;
                    const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
                    if (tab && !tab.textContent.includes('💡')) {
                        const closeBtn = tab.querySelector('.tab-close');
                        const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
                        tab.dataset.tabName = tabName;
                        if (closeBtn) {
                            tab.innerHTML = `${tabName} 💡<span class="tab-close" data-close="${tabId}">×</span>`;
                        }
                    }
                }
            } else {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                input.value = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 250);

        input.dataset.timerId = timerId;
        inputTimers[timerId] = { input, interval: timerId };
    }

    const tabContainer = document.getElementById('tabContainer');
    const tabContents = document.getElementById('tabContents');
    const addTabBtn = document.getElementById('addTabBtn');

    function createTab(name, id) {
        const tab = document.createElement('button');
        tab.className = 'tab active';
        tab.dataset.tabId = id;
        tab.innerHTML = `${name}<span class="tab-close" data-close="${id}">×</span>`;

        tab.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) {
                closeTab(e.target.dataset.close);
            } else if (e.ctrlKey && e.altKey && e.shiftKey) {
                // Ctrl+Alt+Shift click on tab: start 10m timer for all inputs
                const tabContent = document.getElementById(`tab-content-${id}`);
                if (tabContent) {
                    tabContent.querySelectorAll('input').forEach(input => {
                        startTimerForInput(input, 10);
                    });
                }
            } else if (e.ctrlKey && e.altKey) {
                // Ctrl+Alt click on tab: start 2m timer for all inputs
                const tabContent = document.getElementById(`tab-content-${id}`);
                if (tabContent) {
                    tabContent.querySelectorAll('input').forEach(input => {
                        startTimerForInput(input, 2);
                    });
                }
            } else if (e.altKey) {
                // Alt + click to rename tab
                const newName = prompt('Enter new tab name:', tab.textContent.replace('×', '').trim());
                if (newName && newName.trim()) {
                    tab.innerHTML = `${newName.trim()}<span class="tab-close" data-close="${id}">×</span>`;
                }
            } else {
                switchTab(id);
            }
        });

        // Insert before the add tab button
        tabContainer.insertBefore(tab, addTabBtn);
    }

    function createTabContent(id) {
        const content = document.createElement('div');
        content.className = 'tab-content active';
        content.id = `tab-content-${id}`;
        content.innerHTML = `<pre><code id="code-${id}" style="line-height: 1.5;white-space: pre-wrap;word-break: break-word"></code></pre>`;
        tabContents.appendChild(content);
        // Store tab reference for timer notifications
        content.dataset.tabId = id;
        return content;
    }

    function switchTab(id) {
        // Update tab appearance
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tabId === id);
        });

        // Update tab content visibility
        document.querySelectorAll('.tab-content').forEach(c => {
            c.classList.toggle('active', c.id === `tab-content-${id}`);
        });

        activeTabId = id;

        // Focus the code input of the active tab
        const activeCode = document.getElementById(`code-${id}`);
        if (activeCode) {
            activeCode.focus();
        }
    }

    function closeTab(id) {
        const tab = document.querySelector(`.tab[data-tab-id="${id}"]`);
        const content = document.getElementById(`tab-content-${id}`);

        if (!tab || !content) return;

        const wasActive = activeTabId === id;
        const isLastTab = document.querySelectorAll('.tab').length <= 1;

        tab.remove();
        content.remove();

        if (isLastTab) {
            // Create a new tab if we closed the last one
            addNewTab();
        } else if (wasActive) {
            // Switch to another tab
            const remainingTabs = document.querySelectorAll('.tab');
            if (remainingTabs.length > 0) {
                switchTab(remainingTabs[remainingTabs.length - 1].dataset.tabId);
            }
        }
    }

    function addNewTab() {
        tabCount++;
        const tabId = `tab-${tabCount}`;
        const tabName = `Code${tabCount}`;
        createTab(tabName, tabId);
        createTabContent(tabId);
        switchTab(tabId);
    }

    // Add tab button handler
    addTabBtn.addEventListener('click', addNewTab);

    // Global Ctrl+V handler - pastes to active tab only
    window.addEventListener('keydown', (event) => {
        if (event.key === "v" && event.ctrlKey) {
            event.preventDefault();

            if (!activeTabId) return;

            const codeElement = document.getElementById(`code-${activeTabId}`);
            if (!codeElement) return;

            const clipboardText = navigator.clipboard.readText();

            clipboardText.then(text => {
                // Set innerHTML directly - browser will parse <input> tags as actual elements
                codeElement.innerHTML = text;
                highlightElement(codeElement);
                setUpCodeElement(codeElement);
                window.scrollTo(0, 0);
            });
        }
    });

    function highlightElement(codeElement) {
        const block = codeElement;
        if (!block) return;

        let html = block.innerHTML;

        html = html.replace(/^###\s*(.*)$/gm, '<h3>$1</h3>');

        // Protect input tags first
        const inputTags = [];
        html = html.replace(/<input[^>]*>/g, (m) => {
            inputTags.push(m);
            return `__INPUT_${inputTags.length - 1}__`;
        });

        // Process comments
        const commentTags = [];
        html = html.replace(/\/\*[\s\S]*?\*\//g, (m) => {
            commentTags.push(`<span class="comment1">${m}</span>`);
            return `__COMMENT_${commentTags.length - 1}__`;
        });
        html = html.replace(/(\/\/.*?$)/gm, (m) => {
            commentTags.push(`<span class="comment" onclick="speak('${m.replace("//", "")}')" style="cursor: pointer">${m}</span>`);
            return `__COMMENT_${commentTags.length - 1}__`;
        });

        // Now process keywords (they won't affect input placeholders since inputs are protected)
        const keywords = ['function', 'var', 'let', 'const', 'return', 'class', 'async', 'await', 'log', 'get', 'set'];
        html = html.replace(new RegExp(`\\b(${keywords.join('|')})\\b`, 'g'), '<span class="keyword">$1</span>');

        const keywords1 = ['for', 'while', 'if', 'else', 'null', 'true', 'false', 'this', 'constructor', 'new', 'try', 'catch', 'implements', 'export', 'import', 'from', 'static'];
        html = html.replace(new RegExp(`\\b(${keywords1.join('|')})\\b`, 'g'), '<span class="keyword1">$1</span>');

        // Restore comments and inputs
        html = html.replace(/__COMMENT_(\d+)__/g, (_, i) => commentTags[i]);
        html = html.replace(/__INPUT_(\d+)__/g, (_, i) => inputTags[i]);

        block.innerHTML = html;
    }

    function setUpCodeElement(codeElement) {
        var initialInputLength = 0;

        function isFuzzyPrefix(userInput, target) {
            const u = userInput.replaceAll(" ", "").toLowerCase();
            const t = target.replaceAll(" ", "").toLowerCase();

            let i = 0, j = 0;
            while (i < u.length && j < t.length) {
                if (u[i] === t[j]) {
                    i++; j++;
                } else if ((u[i] === ')' && u[i-1] === '(') || (u[i] === ']' && u[i-1] === '[')) {
                    const closing = u[i];
                    while (j < t.length && t[j] !== closing) j++;
                    if (j < t.length && t[j] === closing) {
                        i++; j++;
                    } else {
                        return false;
                    }
                } else if ((u[i] === ')' && t[j] !== ')') || (u[i] === ']' && t[j] !== ']')) {
                    i++;
                } else {
                    return false;
                }
            }

            while (i < u.length) {
                if (u[i] !== ')' && u[i] !== ']') return false;
                i++;
            }

            return true;
        }

        codeElement.querySelectorAll('input').forEach((input, index) => {
            input.placeholder = input.placeholder.trim();

            const length = input.placeholder.length;
            let width = Math.max(length * 12, 40);
            width = Math.min(width, 500);
            input.style.width = width + 'px';

            input.dataset.charIndex = 0;
            input.value = input.placeholder.substring(0, initialInputLength);
            input.dataset.charIndex = input.value.length;
            if (index === 0) {
                input.focus();
            }

            input.addEventListener('input', () => {
                const targetString = input.placeholder.toLowerCase();
                const userInput = input.value.toLowerCase();

                input.dataset.charIndex = userInput.length;

                // Check for timer pattern (e.g., "1m", "2m", "10m")
                const timerMatch = userInput.match(/^(\d+)m$/);
                if (timerMatch && !input.dataset.timerStarted) {
                    const minutes = parseInt(timerMatch[1], 10);
                    const totalSeconds = minutes * 60;

                    input.dataset.timerStarted = 'true';
                    input.dataset.timerTotalSeconds = totalSeconds;
                    input.dataset.timerOriginal = userInput;
                    input.dataset.timerStartTime = Date.now();

                    const timerId = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - parseInt(input.dataset.timerStartTime, 10)) / 1000);
                        const remaining = parseInt(input.dataset.timerTotalSeconds, 10) - elapsed;

                        if (remaining <= 0) {
                            // Timer finished
                            clearInterval(timerId);
                            delete inputTimers[input.dataset.timerId];
                            input.value = input.dataset.timerOriginal || '';
                            input.className = 'orange';
                            input.style.background = '#ff6666';
                            delete input.dataset.timerStarted;
                            delete input.dataset.timerTotalSeconds;
                            delete input.dataset.timerOriginal;
                            delete input.dataset.timerStartTime;
                            delete input.dataset.timerId;
                            // Play sound
                            const ding = document.getElementById('dingSound');
                            if (ding) ding.play();
                            // Add notification indicator to tab
                            const tabContent = input.closest('.tab-content');
                            if (tabContent) {
                                const tabId = tabContent.dataset.tabId;
                                const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
                                if (tab && !tab.textContent.includes('💡')) {
                                    const closeBtn = tab.querySelector('.tab-close');
                                    const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
                                    tab.dataset.tabName = tabName;
                                    if (closeBtn) {
                                        tab.innerHTML = `${tabName} 💡<span class="tab-close" data-close="${tabId}">×</span>`;
                                    }
                                }
                            }
                        } else {
                            // Display remaining time as mm:ss
                            const mins = Math.floor(remaining / 60);
                            const secs = remaining % 60;
                            input.value = `${mins}:${secs.toString().padStart(2, '0')}`;
                        }
                    }, 250);

                    input.dataset.timerId = timerId;
                    inputTimers[timerId] = { input, interval: timerId };
                    return;
                }

                if (userInput.replaceAll(" ", "").toLowerCase() === targetString.replaceAll(" ", "").toLowerCase()) {
                    input.className = 'orange';
                } else if (isFuzzyPrefix(userInput, targetString)) {
                    input.className = 'green';
                } else {
                    input.className = 'red';
                }
            });

            input.addEventListener('focus', () => {
                input.dataset.charIndex = input.value.length;
                const length = input.value.length;
                input.setSelectionRange(length, length);
            });

            input.addEventListener('click', (event) => {
                event.preventDefault();

                // Clear notification indicator from tab
                const tabContent = input.closest('.tab-content');
                if (tabContent) {
                    const tabId = tabContent.dataset.tabId;
                    const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
                    if (tab && tab.textContent.includes('💡')) {
                        const closeBtn = tab.querySelector('.tab-close');
                        const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
                        if (closeBtn) {
                            tab.innerHTML = `${tabName}<span class="tab-close" data-close="${tabId}">×</span>`;
                        }
                    }
                }

                // Cancel timer if running
                if (input.dataset.timerId) {
                    const timerId = parseInt(input.dataset.timerId, 10);
                    clearInterval(timerId);
                    delete inputTimers[timerId];
                    input.value = '';
                    input.className = '';
                    delete input.dataset.timerStarted;
                    delete input.dataset.timerTotalSeconds;
                    delete input.dataset.timerOriginal;
                    delete input.dataset.timerStartTime;
                    delete input.dataset.timerId;
                    return;
                }

                const placeholderValue = input.placeholder;
                if (event.shiftKey && event.ctrlKey && event.altKey) {
                    // Ctrl+Shift+Alt: start 10m timer
                    const totalSeconds = 10 * 60;
                    input.dataset.timerStarted = 'true';
                    input.dataset.timerTotalSeconds = totalSeconds;
                    input.dataset.timerOriginal = '10m';
                    input.dataset.timerStartTime = Date.now();
                    input.className = '';

                    const timerId = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - parseInt(input.dataset.timerStartTime, 10)) / 1000);
                        const remaining = parseInt(input.dataset.timerTotalSeconds, 10) - elapsed;

                        if (remaining <= 0) {
                            clearInterval(timerId);
                            delete inputTimers[input.dataset.timerId];
                            input.value = input.dataset.timerOriginal || '';
                            input.className = 'orange';
                            input.style.background = '#ff6666';
                            delete input.dataset.timerStarted;
                            delete input.dataset.timerTotalSeconds;
                            delete input.dataset.timerOriginal;
                            delete input.dataset.timerStartTime;
                            delete input.dataset.timerId;
                            const ding = document.getElementById('dingSound');
                            if (ding) ding.play();
                            const tabContent = input.closest('.tab-content');
                            if (tabContent) {
                                const tabId = tabContent.dataset.tabId;
                                const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
                                if (tab && !tab.textContent.includes('💡')) {
                                    const closeBtn = tab.querySelector('.tab-close');
                                    const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
                                    tab.dataset.tabName = tabName;
                                    if (closeBtn) {
                                        tab.innerHTML = `${tabName} 💡<span class="tab-close" data-close="${tabId}">×</span>`;
                                    }
                                }
                            }
                        } else {
                            const mins = Math.floor(remaining / 60);
                            const secs = remaining % 60;
                            input.value = `${mins}:${secs.toString().padStart(2, '0')}`;
                        }
                    }, 250);

                    input.dataset.timerId = timerId;
                    inputTimers[timerId] = { input, interval: timerId };
                } else if (event.shiftKey && event.ctrlKey) {
                    codeElement.querySelectorAll("input").forEach(input => {
                        input.value = "";
                        input.dataset.charIndex = 0;
                    });
                } else if (event.ctrlKey && event.altKey) {
                    // Ctrl+Alt: start 2m timer
                    const totalSeconds = 2 * 60;
                    input.dataset.timerStarted = 'true';
                    input.dataset.timerTotalSeconds = totalSeconds;
                    input.dataset.timerOriginal = '2m';
                    input.dataset.timerStartTime = Date.now();
                    input.className = '';

                    const timerId = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - parseInt(input.dataset.timerStartTime, 10)) / 1000);
                        const remaining = parseInt(input.dataset.timerTotalSeconds, 10) - elapsed;

                        if (remaining <= 0) {
                            clearInterval(timerId);
                            delete inputTimers[input.dataset.timerId];
                            input.value = input.dataset.timerOriginal || '';
                            input.className = 'orange';
                            input.style.background = '#ff6666';
                            delete input.dataset.timerStarted;
                            delete input.dataset.timerTotalSeconds;
                            delete input.dataset.timerOriginal;
                            delete input.dataset.timerStartTime;
                            delete input.dataset.timerId;
                            const ding = document.getElementById('dingSound');
                            if (ding) ding.play();
                            const tabContent = input.closest('.tab-content');
                            if (tabContent) {
                                const tabId = tabContent.dataset.tabId;
                                const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
                                if (tab && !tab.textContent.includes('💡')) {
                                    const closeBtn = tab.querySelector('.tab-close');
                                    const tabName = tab.dataset.tabName || tab.textContent.replace('×', '').trim().replace('💡', '').trim();
                                    tab.dataset.tabName = tabName;
                                    if (closeBtn) {
                                        tab.innerHTML = `${tabName} 💡<span class="tab-close" data-close="${tabId}">×</span>`;
                                    }
                                }
                            }
                        } else {
                            const mins = Math.floor(remaining / 60);
                            const secs = remaining % 60;
                            input.value = `${mins}:${secs.toString().padStart(2, '0')}`;
                        }
                    }, 250);

                    input.dataset.timerId = timerId;
                    inputTimers[timerId] = { input, interval: timerId };
                } else if (event.shiftKey) {
                    codeElement.querySelectorAll("input").forEach(input => {
                        input.value = input.placeholder;
                        input.dataset.charIndex = input.placeholder.length;
                        input.className = 'orange';
                    });
                } else if (event.altKey) {
                    input.value = placeholderValue;
                    input.dataset.charIndex = placeholderValue.length;
                    input.className = 'orange';
                } else if (event.ctrlKey) {
                    input.value = "";
                    input.dataset.charIndex = 0;
                } else {
                    let charIndex = parseInt(input.dataset.charIndex, 10);

                    if (placeholderValue && charIndex < placeholderValue.length) {
                        input.value += placeholderValue.charAt(charIndex);
                        charIndex++;
                        input.dataset.charIndex = charIndex;
                        if (charIndex === input.placeholder.length) {
                            input.className = 'orange';
                        }
                    }
                }
            });

            input.addEventListener('keydown', (event) => {
                if (document.activeElement === input) {
                    if (event.key === '`') {
                        event.preventDefault();
                        let charIndex = parseInt(input.dataset.charIndex, 10);

                        if (input.placeholder && charIndex < input.placeholder.length) {
                            input.value += input.placeholder.charAt(charIndex);
                            charIndex++;
                            input.dataset.charIndex = charIndex;
                            if (charIndex === input.placeholder.length) {
                                input.className = 'orange';
                            }
                        }
                    }
                }
            });

            let longPressTimeout;

            input.addEventListener('mousedown', () => {
                longPressTimeout = setTimeout(() => {
                    const placeholderValue = input.placeholder;
                    input.value = placeholderValue;
                    input.dataset.charIndex = placeholderValue.length;
                    input.className = 'orange';
                }, 600);
            });

            input.addEventListener('mouseup', () => {
                clearTimeout(longPressTimeout);
            });

            input.addEventListener('mouseleave', () => {
                clearTimeout(longPressTimeout);
            });
        });
    }

    // Initialize with one tab
    addNewTab();
</script>

</body>
</html>
