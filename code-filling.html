<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style/code-filling.css"></link>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.min.css">
    <style>
        select {
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 2px;
        }
        select option {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        /* Tab styles */
        .tab-container {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: #252525;
            border-bottom: 1px solid #333;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            background: #333;
            color: #aaa;
            border: none;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #444;
            color: #ddd;
        }

        .tab.active {
            background: #1e1e1e;
            color: #fff;
        }

        .tab-close {
            margin-left: 8px;
            color: #888;
            font-size: 12px;
        }

        .tab-close:hover {
            color: #ff6b6b;
        }

        .add-tab-btn {
            padding: 8px 12px;
            background: #2a2a2a;
            color: #888;
            border: 1px dashed #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-tab-btn:hover {
            background: #333;
            color: #aaa;
            border-color: #555;
        }

        .tab-content {
            display: none;
            position: absolute;
            margin-top: 180px;
            padding-left: 25%;
            padding-right: 25%;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-content.active {
            display: block;
        }

        .code-wrapper {
            max-width: 50%;
            width: 50%;
        }
    </style>
</head>
<body>
<div id="front-content">
    <div style="position: fixed;background: #333333;width: 100vw;z-index: 100;padding-bottom: 10px;">
        <div style="font-weight: bold;text-align:center;font-size: 30px;padding: 10px 0">
            CODE FILLING
        </div>
        <div style="display: flex;height: 30px;align-items: center;width: 100%;">
            <select id="voice-select" style="margin-left: auto;">
            </select>
            <div style="margin-left: 20px; display: flex;margin-top: 0px;margin-right: auto;">
                <label for="rate-slider">Speed:</label>
                <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1" style="margin-left: 10px;">
                <span id="rate-value" style="margin-left: 10px;">1.0</span>
            </div>
        </div>

        <div class="tab-container" id="tabContainer">
            <!-- Tabs will be added here dynamically -->
            <button class="add-tab-btn" id="addTabBtn">+ Add Tab</button>
        </div>
    </div>

    <div id="tabContents">
        <!-- Tab contents will be added here dynamically -->
    </div>
</div>


<script>
    const defaultVoiceName = localStorage.getItem('selectedVoice') || "Microsoft Brian Online (Natural) - English (United States)";

    let isSpeaking = false;
    const select = document.getElementById('voice-select');
    select.innerHTML = '<option value="">Loading...</option>';
    select.addEventListener('change', () => {
        const selectedVoiceName = select.value;
        localStorage.setItem('selectedVoice', selectedVoiceName);
        const voices = window.speechSynthesis.getVoices();
        const voice = voices.find(voice => voice.name === selectedVoiceName);
        if (voice) {
            selectVoice = voice;
        }
    });

    document.addEventListener("keydown",  (e) => {
        console.log(e.key)
        if (e.keyCode === 32) {
            e.preventDefault();
            window.speechSynthesis.cancel();
            isSpeaking = false;
        } else if (e.key === 'd'){
            e.preventDefault();
            if (!isSpeaking) {
                isSpeaking = true;
                window.speechSynthesis.resume();
            } else {
                isSpeaking = false;
                window.speechSynthesis.pause();
            }
        }
    })

    let selectVoice = null
    let currentRate = parseFloat(localStorage.getItem('speechRate')) || 1.0;

    document.addEventListener('DOMContentLoaded', () => {
        const rateSlider = document.getElementById('rate-slider');
        const rateValueSpan = document.getElementById('rate-value');

        if (rateSlider && rateValueSpan) {
            rateSlider.value = currentRate;
            rateValueSpan.textContent = currentRate.toFixed(1);

            rateSlider.addEventListener('input', () => {
                currentRate = parseFloat(rateSlider.value);
                rateValueSpan.textContent = currentRate.toFixed(1);
                localStorage.setItem('speechRate', currentRate);
            });
        }
    });

    window.speechSynthesis.onvoiceschanged = () => {
        const voices = window.speechSynthesis.getVoices();

        select.innerHTML = '';

        voices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.name;
            option.textContent = voice.name;
            select.appendChild(option);

            if (voice.name === defaultVoiceName) {
                selectVoice = voice;
            }
        });

        if (selectVoice) {
            select.value = selectVoice.name;
        }
    };

    function speak(text){
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = currentRate;
        utterance.voice = selectVoice;
        utterance.onstart = () => {
            isSpeaking = true;
        };
        utterance.onend = () => {
            isSpeaking = false;
        }
        speechSynthesis.speak(utterance);
    }


    function onKeydown(event) {
        if (event.key === 'F3') {
            const comments = document.querySelectorAll(".comment");
            comments.forEach(element => {
                element.style.visibility =
                    (element.style.visibility !== 'hidden') ? 'hidden' : 'visible';
            });
        }
    }

    function bindKeyEvent() {
        document.removeEventListener("keydown", onKeydown);
        document.addEventListener("keydown", onKeydown);
    }

    const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
            if (mutation.type === "childList" && mutation.addedNodes.length > 0) {
                bindKeyEvent();
            }
        }
    });

    observer.observe(document.body, { childList: true, subtree: true });
    bindKeyEvent();
</script>

<script>
    function speakText(text) {
        if (!text) return;

        window.speechSynthesis.cancel();

        const filteredText = filterText(text);
        const utterance = new SpeechSynthesisUtterance(filteredText);
        utterance.rate = 1;

        function findVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v =>
                v.name === "Microsoft Aria Online (Natural) - English (United States)" &&
                v.lang === "en-US"
            );
        }

        let voice = findVoice();
        if (voice) {
            utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        } else {
            window.speechSynthesis.onvoiceschanged = () => {
                voice = findVoice();
                utterance.voice = voice || null;
                utterance.lang = voice ? voice.lang : "zh-CN";
                window.speechSynthesis.speak(utterance);
                window.speechSynthesis.onvoiceschanged = null;
            };
        }
    }

    function filterText(text) {
        return text;
    }

    function setupTTS() {
        const front = document.querySelector("#read");
        if (front) {
            const title = front.innerText || front.textContent;
            speakText(title);
        }
    }

    if (typeof ankiDeckObserverAttached === "undefined") {
        document.addEventListener("anki-show", setupTTS);
        window.ankiDeckObserverAttached = true;
    }
</script>


<script>
    // Tab management
    let tabCount = 0;
    let activeTabId = null;

    const tabContainer = document.getElementById('tabContainer');
    const tabContents = document.getElementById('tabContents');
    const addTabBtn = document.getElementById('addTabBtn');

    function createTab(name, id) {
        const tab = document.createElement('button');
        tab.className = 'tab active';
        tab.dataset.tabId = id;
        tab.innerHTML = `${name}<span class="tab-close" data-close="${id}">×</span>`;

        tab.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) {
                closeTab(e.target.dataset.close);
            } else if (e.altKey) {
                // Alt + click to rename tab
                const newName = prompt('Enter new tab name:', tab.textContent.replace('×', '').trim());
                if (newName && newName.trim()) {
                    tab.innerHTML = `${newName.trim()}<span class="tab-close" data-close="${id}">×</span>`;
                }
            } else {
                switchTab(id);
            }
        });

        // Insert before the add tab button
        tabContainer.insertBefore(tab, addTabBtn);
    }

    function createTabContent(id) {
        const content = document.createElement('div');
        content.className = 'tab-content active';
        content.id = `tab-content-${id}`;
        content.innerHTML = `<pre><code id="code-${id}" style="line-height: 1.5;white-space: pre-wrap;word-break: break-word"></code></pre>`;
        tabContents.appendChild(content);
        return content;
    }

    function switchTab(id) {
        // Update tab appearance
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tabId === id);
        });

        // Update tab content visibility
        document.querySelectorAll('.tab-content').forEach(c => {
            c.classList.toggle('active', c.id === `tab-content-${id}`);
        });

        activeTabId = id;

        // Focus the code input of the active tab
        const activeCode = document.getElementById(`code-${id}`);
        if (activeCode) {
            activeCode.focus();
        }
    }

    function closeTab(id) {
        const tab = document.querySelector(`.tab[data-tab-id="${id}"]`);
        const content = document.getElementById(`tab-content-${id}`);

        if (!tab || !content) return;

        const wasActive = activeTabId === id;
        const isLastTab = document.querySelectorAll('.tab').length <= 1;

        tab.remove();
        content.remove();

        if (isLastTab) {
            // Create a new tab if we closed the last one
            addNewTab();
        } else if (wasActive) {
            // Switch to another tab
            const remainingTabs = document.querySelectorAll('.tab');
            if (remainingTabs.length > 0) {
                switchTab(remainingTabs[remainingTabs.length - 1].dataset.tabId);
            }
        }
    }

    function addNewTab() {
        tabCount++;
        const tabId = `tab-${tabCount}`;
        const tabName = `Code${tabCount}`;
        createTab(tabName, tabId);
        createTabContent(tabId);
        switchTab(tabId);
    }

    // Add tab button handler
    addTabBtn.addEventListener('click', addNewTab);

    // Global Ctrl+V handler - pastes to active tab only
    window.addEventListener('keydown', (event) => {
        if (event.key === "v" && event.ctrlKey) {
            event.preventDefault();

            if (!activeTabId) return;

            const codeElement = document.getElementById(`code-${activeTabId}`);
            if (!codeElement) return;

            const clipboardText = navigator.clipboard.readText();

            clipboardText.then(text => {
                const escapedText = text.replace(/<input\b[^>]*>|[&<>]/g, match => {
                    if (match.startsWith('<input')) return match;

                    switch (match) {
                        case '&': return '&amp;';
                        case '<': return '&lt;';
                        case '>': return '&gt;';
                        default: return match;
                    }
                });

                codeElement.innerHTML = escapedText;
                highlightElement(codeElement);
                setUpCodeElement(codeElement);
                window.scrollTo(0, 0);
            });
        }
    });

    function highlightElement(codeElement) {
        const block = codeElement;
        if (!block) return;

        let html = block.innerHTML;

        html = html.replace(/^###\s*(.*)$/gm, '<h3>$1</h3>');

        const inputTags = [];
        html = html.replace(/<input[^>]*>/g, (m) => {
            inputTags.push(m);
            return `__INPUT_${inputTags.length - 1}__`;
        });

        const commentTags = [];
        html = html.replace(/\/\*[\s\S]*?\*\//g, (m) => {
            commentTags.push(`<span class="comment1">${m}</span>`);
            return `__COMMENT_${commentTags.length - 1}__`;
        });
        html = html.replace(/(\/\/.*?$)/gm, (m) => {
            commentTags.push(`<span class="comment" onclick="speak('${m.replace("//", "")}')" style="cursor: pointer">${m}</span>`);
            return `__COMMENT_${commentTags.length - 1}__`;
        });

        const keywords = ['function', 'var', 'let', 'const', 'return', 'class', 'async', 'await', 'log', 'get', 'set'];
        html = html.replace(new RegExp(`\\b(${keywords.join('|')})\\b`, 'g'), '<span class="keyword">$1</span>');

        const keywords1 = ['for', 'while', 'if', 'else', 'null', 'true', 'false', 'this', 'constructor', 'new', 'try', 'catch', 'implements', 'export', 'import', 'from', 'static'];
        html = html.replace(new RegExp(`\\b(${keywords1.join('|')})\\b`, 'g'), '<span class="keyword1">$1</span>');

        html = html.replace(/__COMMENT_(\d+)__/g, (_, i) => commentTags[i]);
        html = html.replace(/__INPUT_(\d+)__/g, (_, i) => inputTags[i]);

        block.innerHTML = html;
    }

    function setUpCodeElement(codeElement) {
        var initialInputLength = 0;

        function isFuzzyPrefix(userInput, target) {
            const u = userInput.replaceAll(" ", "").toLowerCase();
            const t = target.replaceAll(" ", "").toLowerCase();

            let i = 0, j = 0;
            while (i < u.length && j < t.length) {
                if (u[i] === t[j]) {
                    i++; j++;
                } else if ((u[i] === ')' && u[i-1] === '(') || (u[i] === ']' && u[i-1] === '[')) {
                    const closing = u[i];
                    while (j < t.length && t[j] !== closing) j++;
                    if (j < t.length && t[j] === closing) {
                        i++; j++;
                    } else {
                        return false;
                    }
                } else if ((u[i] === ')' && t[j] !== ')') || (u[i] === ']' && t[j] !== ']')) {
                    i++;
                } else {
                    return false;
                }
            }

            while (i < u.length) {
                if (u[i] !== ')' && u[i] !== ']') return false;
                i++;
            }

            return true;
        }

        codeElement.querySelectorAll('code input').forEach((input, index) => {
            input.placeholder = input.placeholder.trim();

            const length = input.placeholder.length;
            let width = Math.max(length * 12, 40);
            width = Math.min(width, 500);
            input.style.width = width + 'px';

            input.dataset.charIndex = 0;
            input.value = input.placeholder.substring(0, initialInputLength);
            input.dataset.charIndex = input.value.length;
            if (index === 0) {
                input.focus();
            }

            input.addEventListener('input', () => {
                const targetString = input.placeholder.toLowerCase();
                const userInput = input.value.toLowerCase();

                input.dataset.charIndex = userInput.length;

                if (userInput.replaceAll(" ", "").toLowerCase() === targetString.replaceAll(" ", "").toLowerCase()) {
                    input.className = 'orange';
                } else if (isFuzzyPrefix(userInput, targetString)) {
                    input.className = 'green';
                } else {
                    input.className = 'red';
                }
            });

            input.addEventListener('focus', () => {
                input.dataset.charIndex = input.value.length;
                const length = input.value.length;
                input.setSelectionRange(length, length);
            });

            input.addEventListener('click', (event) => {
                event.preventDefault();
                const placeholderValue = input.placeholder;
                if (event.shiftKey && event.ctrlKey) {
                    codeElement.querySelectorAll("input").forEach(input => {
                        input.value = "";
                        input.dataset.charIndex = 0;
                    });
                } else if (event.shiftKey) {
                    codeElement.querySelectorAll("input").forEach(input => {
                        input.value = input.placeholder;
                        input.dataset.charIndex = input.placeholder.length;
                        input.className = 'orange';
                    });
                } else if (event.altKey) {
                    input.value = placeholderValue;
                    input.dataset.charIndex = placeholderValue.length;
                    input.className = 'orange';
                } else if (event.ctrlKey) {
                    input.value = "";
                    input.dataset.charIndex = 0;
                } else {
                    let charIndex = parseInt(input.dataset.charIndex, 10);

                    if (placeholderValue && charIndex < placeholderValue.length) {
                        input.value += placeholderValue.charAt(charIndex);
                        charIndex++;
                        input.dataset.charIndex = charIndex;
                        if (charIndex === input.placeholder.length) {
                            input.className = 'orange';
                        }
                    }
                }
            });

            input.addEventListener('keydown', (event) => {
                if (document.activeElement === input) {
                    if (event.key === '`') {
                        event.preventDefault();
                        let charIndex = parseInt(input.dataset.charIndex, 10);

                        if (input.placeholder && charIndex < input.placeholder.length) {
                            input.value += input.placeholder.charAt(charIndex);
                            charIndex++;
                            input.dataset.charIndex = charIndex;
                            if (charIndex === input.placeholder.length) {
                                input.className = 'orange';
                            }
                        }
                    }
                }
            });

            let longPressTimeout;

            input.addEventListener('mousedown', () => {
                longPressTimeout = setTimeout(() => {
                    const placeholderValue = input.placeholder;
                    input.value = placeholderValue;
                    input.dataset.charIndex = placeholderValue.length;
                    input.className = 'orange';
                }, 600);
            });

            input.addEventListener('mouseup', () => {
                clearTimeout(longPressTimeout);
            });

            input.addEventListener('mouseleave', () => {
                clearTimeout(longPressTimeout);
            });
        });
    }

    // Initialize with one tab
    addNewTab();
</script>

</body>
</html>
