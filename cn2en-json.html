<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cn2en-json</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .error-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #7a1f1f;
            color: #fff;
            padding: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 18px;
            color: #888;
        }
        .cn-text {
            font-size: 64px;
            color: wheat;
            font-family: 华文细黑, 楷体, serif;
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            line-height: 1.3;
        }
        .en-text {
            font-size: 48px;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            line-height: 1.3;
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
        }
        .empty-state {
            font-size: 24px;
            color: #888;
            text-align: center;
        }
        [hidden] { display: none; }
    </style>
</head>
<body>
    <div id="errorBar" class="error-bar"></div>
    <div id="counter" class="counter" hidden></div>
    <div id="cnText" class="cn-text" hidden></div>
    <div id="enText" class="en-text" hidden></div>
    <div id="hint" class="hint">← → 切换</div>
    <div id="emptyState" class="empty-state">按 Ctrl+V 粘贴 JSON 数据</div>
<script>
    let entries = [];
    let currentIndex = 0;
    let errorTimer = null;

    const errorBar = document.getElementById('errorBar');
    const counter = document.getElementById('counter');
    const cnText = document.getElementById('cnText');
    const enText = document.getElementById('enText');
    const hint = document.getElementById('hint');
    const emptyState = document.getElementById('emptyState');

    function showError(msg) {
        errorBar.textContent = msg;
        errorBar.style.display = 'block';
        if (errorTimer) clearTimeout(errorTimer);
        errorTimer = setTimeout(() => {
            errorBar.style.display = 'none';
            errorTimer = null;
        }, 3000);
    }

    function clearError() {
        errorBar.style.display = 'none';
        if (errorTimer) {
            clearTimeout(errorTimer);
            errorTimer = null;
        }
    }

    function render() {
        if (entries.length === 0) {
            emptyState.hidden = false;
            counter.hidden = true;
            cnText.hidden = true;
            enText.hidden = true;
            hint.hidden = true;
            return;
        }
        emptyState.hidden = true;
        counter.hidden = false;
        cnText.hidden = false;
        enText.hidden = false;
        hint.hidden = false;
        const [cn, en] = entries[currentIndex];
        counter.textContent = `${currentIndex + 1}/${entries.length}`;
        cnText.textContent = cn;
        enText.textContent = en;
    }

    function parseAndLoad(text) {
        let parsed;
        try {
            parsed = JSON.parse(text);
        } catch (err) {
            showError(`JSON 解析失败: ${err.message}`);
            return;
        }
        if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
            showError('JSON 格式错误：必须为对象');
            return;
        }
        const newEntries = Object.entries(parsed);
        if (newEntries.length === 0) {
            showError('JSON 不能为空对象');
            return;
        }
        entries = newEntries;
        currentIndex = 0;
        clearError();
        render();
    }

    document.addEventListener('keydown', async function (e) {
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyV') {
            e.preventDefault();
            try {
                const text = await navigator.clipboard.readText();
                parseAndLoad(text);
            } catch (err) {
                showError(`剪贴板读取失败: ${err.message || err}`);
            }
        }
    });

    render();
</script>
</body>
</html>
