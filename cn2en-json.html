<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cn2en-json</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .error-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #7a1f1f;
            color: #fff;
            padding: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 18px;
            color: #888;
        }
        .cn-text {
            font-size: 64px;
            color: wheat;
            font-family: 华文细黑, 楷体, serif;
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            line-height: 1.3;
        }
        .en-text {
            font-size: 48px;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            line-height: 1.3;
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
        }
        .empty-state {
            font-size: 24px;
            color: #888;
            text-align: center;
        }
        [hidden] { display: none; }
        .tts-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .voice-select {
            padding: 4px 8px;
            font-size: 14px;
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
        }
        .tts-toggle-label {
            font-size: 14px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .tts-toggle-label input {
            width: 16px;
            height: 16px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="errorBar" class="error-bar"></div>
    <div id="ttsControls" class="tts-controls">
        <select id="voiceSelect" class="voice-select"></select>
        <label class="tts-toggle-label"><input type="checkbox" id="ttsToggle" checked> TTS</label>
    </div>
    <div id="counter" class="counter" hidden></div>
    <div id="cnText" class="cn-text" hidden></div>
    <div id="enText" class="en-text" hidden></div>
    <div id="hint" class="hint">← → 切换</div>
    <div id="emptyState" class="empty-state">按 Ctrl+V 粘贴 JSON 数据</div>
<script>
    let entries = [];
    let currentIndex = 0;
    let errorTimer = null;

    const errorBar = document.getElementById('errorBar');
    const counter = document.getElementById('counter');
    const cnText = document.getElementById('cnText');
    const enText = document.getElementById('enText');
    const hint = document.getElementById('hint');
    const emptyState = document.getElementById('emptyState');
    const voiceSelect = document.getElementById('voiceSelect');
    const ttsToggle = document.getElementById('ttsToggle');

    cnText.addEventListener('click', () => speakCn());

    function showError(msg) {
        errorBar.textContent = msg;
        errorBar.style.display = 'block';
        if (errorTimer) clearTimeout(errorTimer);
        errorTimer = setTimeout(() => {
            errorBar.style.display = 'none';
            errorTimer = null;
        }, 3000);
    }

    function clearError() {
        errorBar.style.display = 'none';
        if (errorTimer) {
            clearTimeout(errorTimer);
            errorTimer = null;
        }
    }

    function populateVoices() {
        const voices = window.speechSynthesis.getVoices();
        voicesCN = voices.filter(v => v.lang === "zh-CN" && !v.name.includes("PRC"));
        voiceSelect.innerHTML = voicesCN
            .map(v => `<option value="${v.name}">${v.name}</option>`)
            .join("");
        const saved = localStorage.getItem(STORAGE_KEY_VOICE);
        if (saved && voicesCN.find(v => v.name === saved)) {
            voiceSelect.value = saved;
            selectedVoice = voicesCN.find(v => v.name === saved);
        } else {
            selectedVoice = voicesCN[0] || null;
            if (selectedVoice) voiceSelect.value = selectedVoice.name;
        }
    }

    function render() {
        if (entries.length === 0) {
            emptyState.hidden = false;
            counter.hidden = true;
            cnText.hidden = true;
            enText.hidden = true;
            hint.hidden = true;
            return;
        }
        emptyState.hidden = true;
        counter.hidden = false;
        cnText.hidden = false;
        enText.hidden = false;
        hint.hidden = false;
        const [cn, en] = entries[currentIndex];
        counter.textContent = `${currentIndex + 1}/${entries.length}`;
        cnText.textContent = cn;
        enText.textContent = en;
        speakCn();
    }

    const STORAGE_KEY_DATA = 'cn2en-json:data';
    const STORAGE_KEY_INDEX = 'cn2en-json:index';
    const STORAGE_KEY_VOICE = 'cn2en-json:voice';
    const STORAGE_KEY_TTS = 'cn2en-json:ttsEnabled';

    let voicesCN = [];
    let selectedVoice = null;
    let ttsEnabled = true;

    function saveState() {
        localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(entries));
        localStorage.setItem(STORAGE_KEY_INDEX, String(currentIndex));
    }

    function loadState() {
        try {
            const data = localStorage.getItem(STORAGE_KEY_DATA);
            const index = localStorage.getItem(STORAGE_KEY_INDEX);
            if (data && index !== null) {
                entries = JSON.parse(data);
                currentIndex = parseInt(index, 10) || 0;
            }
        } catch (err) {
            console.error('恢复状态失败:', err);
        }
    }

    function speakCn() {
        if (!ttsEnabled || entries.length === 0 || !selectedVoice) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(entries[currentIndex][0]);
        utterance.voice = selectedVoice;
        window.speechSynthesis.speak(utterance);
    }

    function parseAndLoad(text) {
        let parsed;
        try {
            parsed = JSON.parse(text);
        } catch (err) {
            showError(`JSON 解析失败: ${err.message}`);
            return;
        }
        if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
            showError('JSON 格式错误：必须为对象');
            return;
        }
        const newEntries = Object.entries(parsed);
        if (newEntries.length === 0) {
            showError('JSON 不能为空对象');
            return;
        }
        entries = newEntries;
        currentIndex = 0;
        clearError();
        saveState();
        render();
    }

    document.addEventListener('keydown', async function (e) {
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyV') {
            e.preventDefault();
            try {
                const text = await navigator.clipboard.readText();
                parseAndLoad(text);
            } catch (err) {
                showError(`剪贴板读取失败: ${err.message || err}`);
            }
        }
        if (entries.length > 0) {
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + entries.length) % entries.length;
                saveState();
                render();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % entries.length;
                saveState();
                render();
            }
        }
    });

    loadState();
    ttsEnabled = localStorage.getItem(STORAGE_KEY_TTS) !== "false";
    ttsToggle.checked = ttsEnabled;
    populateVoices();
    voiceSelect.addEventListener('change', () => {
        selectedVoice = voicesCN.find(v => v.name === voiceSelect.value) || null;
        if (selectedVoice) {
            localStorage.setItem(STORAGE_KEY_VOICE, selectedVoice.name);
        }
    });
    ttsToggle.addEventListener('change', () => {
        ttsEnabled = ttsToggle.checked;
        localStorage.setItem(STORAGE_KEY_TTS, String(ttsEnabled));
        if (!ttsEnabled) window.speechSynthesis.cancel();
    });
    window.speechSynthesis.onvoiceschanged = populateVoices;
    render();
</script>
</body>
</html>
