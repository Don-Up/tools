<body>
<div>
    <div id="card">

        <div id="errorBar" class="error-bar"></div>

<script>

    let entries = [];
    let currentIndex = 0;
    let errorTimer = null;

    const errorBar = document.getElementById('errorBar');
    const counter = document.getElementById('counter');
    const cnText = document.getElementById('cnText');
    const enText = document.getElementById('enText');
    const hint = document.getElementById('hint');
    const emptyState = document.getElementById('emptyState');
    const voiceSelect = document.getElementById('voiceSelect');
    const ttsToggle = document.getElementById('ttsToggle');
    const voiceSelectEn = document.getElementById('voiceSelectEn');
    const ttsToggleEn = document.getElementById('ttsToggleEn');
    const cnRateInput = document.getElementById('cnRate');
    const enRateInput = document.getElementById('enRate');
    const cnRateValue = document.getElementById('cnRateValue');
    const enRateValue = document.getElementById('enRateValue');
    const modeRadios = document.querySelectorAll('input[name="mode"]');
    const cnModal = document.getElementById('cnModal');
    const cnModalBackdrop = document.getElementById('cnModalBackdrop');
    const cnModalPanel = document.getElementById('cnModalPanel');
    const cnModalText = document.getElementById('cnModalText');
    const bgModal = document.getElementById('bgModal');
    const bgModalBackdrop = document.getElementById('bgModalBackdrop');
    const bgFileInput = document.getElementById('bgFileInput');
    const bgCloseBtn = document.getElementById('bgCloseBtn');
    const bgList = document.getElementById('bgList');
    const bgAddBtn = document.getElementById('bgAddBtn');
    const sidePanel = document.getElementById('sidePanel');

    window.addEventListener('message', async (e) => {
        if (e.source !== sidePanel.contentWindow) return;
        const msg = e.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'load-fav-by-name') {
            const targetName = (msg.name || '').trim();
            if (!targetName) return;
            try {
                const favs = await getAllFavorites();
                const match = favs.find(f => f.name === targetName);
                if (!match) {
                    showError(`未找到收藏: ${targetName}`);
                    return;
                }
                await loadFavorite(match);
            } catch (err) {
                showError(`加载收藏失败: ${err.message || err}`);
            }
        }
    });
    const favSaveModal = document.getElementById('favSaveModal');
    const favSaveBackdrop = document.getElementById('favSaveBackdrop');
    const favSaveInput = document.getElementById('favSaveInput');
    const favSaveOk = document.getElementById('favSaveOk');
    const favSaveCancel = document.getElementById('favSaveCancel');
    const favSaveTitle = document.getElementById('favSaveTitle');
    const favListModal = document.getElementById('favListModal');
    const favListBackdrop = document.getElementById('favListBackdrop');
    const favListEl = document.getElementById('favList');
    const favListClose = document.getElementById('favListClose');
    const favStatus = document.getElementById('favStatus');
    const noteModal = document.getElementById('noteModal');
    const noteBackdrop = document.getElementById('noteBackdrop');
    const noteInput = document.getElementById('noteInput');
    const noteOk = document.getElementById('noteOk');
    const noteDelete = document.getElementById('noteDelete');
    const noteCancel = document.getElementById('noteCancel');
    const noteIndexLabel = document.getElementById('noteIndexLabel');
    const noteDisplay = document.getElementById('noteDisplay');
    let bgImages = [];
    let currentBgId = -1;
    let onlyBgId = -1;
    let favorites = [];
    let currentFavName = null;
    let currentFavId = null;
    let favModalMode = 'save';
    let favRenameId = null;

    function copyEntryToClipboard() {
        if (entries.length === 0) return;
        const [cn, en] = entries[currentIndex];
        navigator.clipboard.writeText(`${cn}|${en}|`);
    }

    function showAllCn() {
        if (entries.length === 0) return;
        cnModalText.textContent = entries.map(e => e[0]).join('\n\n');
        cnModal.hidden = false;
    }
    function hideAllCn() {
        cnModal.hidden = true;
    }
    cnModalBackdrop.addEventListener('click', hideAllCn);

    const DB_NAME = 'cn2en-json-bg';
    const DB_VERSION = 3;
    const STORE = 'images';

    function openBgDb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (db.objectStoreNames.contains(STORE)) {
                    db.deleteObjectStore(STORE);
                }
                db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function loadAllBg() {
        const db = await openBgDb();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).getAll();
            req.onsuccess = () => resolve((req.result || []).sort((a, b) => a.id - b.id));
            req.onerror = () => resolve([]);
        });
    }

    async function addBg(dataUrl) {
        const db = await openBgDb();
        const all = await loadAllBg();
        const name = `image${all.length + 1}`;
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const store = tx.objectStore(STORE);
            const req = store.add({ name, dataUrl });
            req.onsuccess = () => resolve({ id: req.result, name, dataUrl });
            req.onerror = () => reject(req.error);
        });
    }

    async function deleteBg(id) {
        const db = await openBgDb();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
        });
    }

    const FAV_DB_NAME = 'cn2en-json-fav';
    const FAV_DB_VERSION = 1;
    const FAV_STORE = 'favorites';

    function md5(str) {
        function rh(n) { let j, s = ''; for (j = 0; j <= 3; j++) s += ((n >> (j * 8 + 4)) & 0x0F).toString(16) + ((n >> (j * 8)) & 0x0F).toString(16); return s; }
        function ad(x, y) { const l = (x & 0xFFFF) + (y & 0xFFFF); const m = (x >> 16) + (y >> 16) + (l >> 16); return (m << 16) | (l & 0xFFFF); }
        function rl(n, c) { return (n << c) | (n >>> (32 - c)); }
        function cm(q, a, b, x, s, t) { return ad(rl(ad(ad(a, q), ad(x, t)), s), b); }
        function ff(a, b, c, d, x, s, t) { return cm((b & c) | ((~b) & d), a, b, x, s, t); }
        function gg(a, b, c, d, x, s, t) { return cm((b & d) | (c & (~d)), a, b, x, s, t); }
        function hh(a, b, c, d, x, s, t) { return cm(b ^ c ^ d, a, b, x, s, t); }
        function ii(a, b, c, d, x, s, t) { return cm(c ^ (b | (~d)), a, b, x, s, t); }
        function sb(s) {
            const n = s.length, w = [];
            for (let i = 0; i < n; i++) w[i >> 2] |= (s.charCodeAt(i) & 0xFF) << ((i % 4) * 8);
            w[n >> 2] |= 0x80 << ((n % 4) * 8);
            w[(((n + 8) >> 6) << 4) + 14] = n * 8;
            return w;
        }
        const x = sb(str);
        let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
        for (let i = 0; i < x.length; i += 16) {
            const oa = a, ob = b, oc = c, od = d;
            a = ff(a, b, c, d, x[i + 0], 7, -680876936);
            d = ff(d, a, b, c, x[i + 1], 12, -389564586);
            a = ff(a, d, a, b, x[i + 2], 17, 606105819);
            a = ff(a, b, c, d, x[i + 5], 5, -176418897);
            b = ff(b, c, d, a, x[i + 8], 22, 1200080426);
            c = ff(c, d, a, b, x[i + 11], 7, -1473231341);
            c = ff(c, d, a, b, x[i + 14], 17, -45705983);
            d = ff(d, a, b, c, x[i + 3], 22, 0xF61E2562);
            c = ff(c, d, a, b, x[i + 10], 7, 1200080426);
            d = ff(d, a, b, c, x[i + 1], 12, -1473231341);
            a = ff(a, d, a, b, x[i + 9], 19, -1444681469);
            a = ff(a, d, a, b, x[i + 6], 7, 1502002290);
            d = ff(d, a, b, c, x[i + 15], 22, -3533383444);
            a = ff(a, b, c, d, x[i + 4], 12, -1530992060);
            b = ff(b, c, d, a, x[i + 13], 5, -40341101);
            a = gg(a, d, a, b, x[i + 12], 6, 1236535329);
            a = gg(a, d, a, b, x[i + 8], 10, -198630844);
            d = gg(d, a, b, c, x[i + 5], 9, 643717713);
            d = gg(d, a, b, c, x[i + 14], 21, -373897302);
            c = ff(c, d, a, b, x[i + 2], 17, -42063);
            b = gg(b, c, d, a, x[i + 11], 4, -1990404162);
            c = gg(c, d, a, b, x[i + 1], 21, -1502002290);
            d = gg(d, a, b, c, x[i + 9], 16, 1246535329);
            d = gg(d, a, b, c, x[i + 7], 4, -1009580436);
            a = gg(a, b, c, d, x[i + 12], 11, -1164527348);
            a = ff(a, b, c, d, x[i + 6], 9, -1416354905);
            d = gg(d, a, b, c, x[i + 2], 15, 0xA679CD4E);
            b = gg(b, c, d, a, x[i + 13], 2, -1094730640);
            d = gg(d, a, b, c, x[i + 8], 13, 0x49B40821);
            b = gg(b, c, d, a, x[i + 7], 12, -1444681469);
            c = gg(c, d, a, b, x[i + 4], 20, -51403784);
            b = gg(b, c, d, a, x[i + 7], 12, 1735328473);
            c = gg(c, d, a, b, x[i + 6], 6, -1921207734);
            b = gg(b, c, d, a, x[i + 15], 10, 378558);
            c = gg(c, d, a, b, x[i + 10], 15, -2022574463);
            c = gg(c, d, a, b, x[i + 9], 11, -1839032964);
            a = hh(a, d, a, b, x[i + 12], 7, -3533383444);
            b = hh(b, c, d, a, x[i + 15], 16, 1236535329);
            a = hh(a, d, a, b, x[i + 6], 10, -1444681469);
            a = hh(a, b, c, d, x[i + 11], 6, -1502002290);
            b = hh(b, c, d, a, x[i + 0], 11, 0xA679CD4E);
            d = hh(d, a, b, c, x[i + 13], 8, 0x49B40821);
            b = hh(b, c, d, a, x[i + 4], 7, -1009580436);
            b = hh(b, c, d, a, x[i + 1], 12, 0x6B901122);
            c = hh(c, d, a, b, x[i + 8], 6, 0xA679CD4E);
            a = ii(a, b, c, d, x[i + 0], 7, -176418897);
            a = ii(a, b, c, d, x[i + 4], 12, 1200080426);
            d = ii(d, a, b, c, x[i + 8], 7, -1473231341);
            c = ii(c, d, a, b, x[i + 12], 17, -176418897);
            a = ad(a, oa); b = ad(b, ob); c = ad(c, oc); d = ad(d, od);
        }
        return rh(a) + rh(b) + rh(c) + rh(d);
    }

    function hashEntries(payload) {
        return md5(JSON.stringify(payload || []));
    }

    function openFavDb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(FAV_DB_NAME, FAV_DB_VERSION);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(FAV_STORE)) {
                    db.createObjectStore(FAV_STORE, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function saveFavorite(name, payload) {
        const db = await openFavDb();
        const hash = hashEntries(payload);
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FAV_STORE, 'readwrite');
            const store = tx.objectStore(FAV_STORE);
            const req = store.add({ name, payload, hash, createdAt: Date.now() });
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function updateFavorite(id, updates) {
        const db = await openFavDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FAV_STORE, 'readwrite');
            const store = tx.objectStore(FAV_STORE);
            const getReq = store.get(id);
            getReq.onsuccess = () => {
                const fav = getReq.result;
                if (!fav) return resolve(null);
                const updated = { ...fav, ...updates };
                const putReq = store.put(updated);
                putReq.onsuccess = () => resolve(putReq.result);
                putReq.onerror = () => reject(putReq.error);
            };
            getReq.onerror = () => reject(getReq.error);
        });
    }

    async function getAllFavorites() {
        const db = await openFavDb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FAV_STORE, 'readonly');
            const req = tx.objectStore(FAV_STORE).getAll();
            req.onsuccess = () => {
                const list = req.result || [];
                list.forEach(f => { if (!f.hash) f.hash = hashEntries(f.payload); });
                resolve(list);
            };
            req.onerror = () => reject(req.error);
        });
    }

    async function findFavoriteByHash(hash) {
        if (!hash) return null;
        const favs = await getAllFavorites();
        return favs.find(f => f.hash === hash) || null;
    }

    async function deleteFavorite(id) {
        const db = await openFavDb();
        return new Promise((resolve) => {
            const tx = db.transaction(FAV_STORE, 'readwrite');
            tx.objectStore(FAV_STORE).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
        });
    }

    }

    async function refreshFavorites() {
        try {
            favorites = await getAllFavorites();
        } catch (err) {
            console.error('[fav] load failed:', err);
            favorites = [];
        }
        renderFavList();
    }

    function renderFavList() {
        favListEl.innerHTML = '';
        favorites.forEach(fav => {
            const li = document.createElement('li');
            li.className = 'fav-list-item';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'fav-name';
            nameSpan.textContent = fav.name;
            nameSpan.title = fav.name;
            nameSpan.addEventListener('click', () => {
                navigator.clipboard.writeText(fav.name).catch(() => {});
            });
            const loadBtn = document.createElement('button');
            loadBtn.className = 'fav-load-btn';
            loadBtn.textContent = '加载';
            loadBtn.addEventListener('click', () => loadFavorite(fav));
            const delBtn = document.createElement('button');
            delBtn.className = 'fav-delete-btn';
            delBtn.textContent = '×';
            delBtn.addEventListener('click', async () => {
                await deleteFavorite(fav.id);
                if (currentFavName === fav.name) setFavStatus(null);
                await refreshFavorites();
            });
            li.appendChild(nameSpan);
            li.appendChild(loadBtn);
            li.appendChild(delBtn);
            favListEl.appendChild(li);
        });
    }

    async function loadFavorite(fav) {
        const payload = fav.payload;
        if (!Array.isArray(payload)) {
            showError('收藏数据无效');
            return;
        }
        entries = payload;
        currentIndex = 0;
        saveState();
        render();
        favListModal.hidden = true;
        if (!favorites.find(f => f.id === fav.id)) {
            favorites.push(fav);
        }
        setFavStatus(fav);
    }

    async function updateFavStatus() {
        if (!Array.isArray(entries) || entries.length === 0) {
            setFavStatus(null);
            return;
        }
        const hash = hashEntries(entries);
        const match = await findFavoriteByHash(hash);
        setFavStatus(match);
    }

    function setFavStatus(fav) {
        if (fav) {
            currentFavId = fav.id;
            currentFavName = fav.name;
            favStatus.textContent = `已收藏(${fav.name})`;
            favStatus.hidden = false;
            if (!favorites.find(f => f.id === fav.id)) {
                favorites.push(fav);
            }
        } else {
            currentFavId = null;
            currentFavName = null;
            favStatus.textContent = '';
            favStatus.hidden = true;
        }
    }

    function getCurrentNote() {
        if (!currentFavId) return null;
        const fav = favorites.find(f => f.id === currentFavId);
        if (!fav || !Array.isArray(fav.notes)) return null;
        const hit = fav.notes.find(n => n.index === currentIndex);
        return hit ? hit.note : null;
    }

    function renderNote() {
        const note = getCurrentNote();
        if (!note) {
            noteDisplay.textContent = '';
            noteDisplay.hidden = true;
            return;
        }
        const isMaskedMode = currentMode === 2 || currentMode === 3;
        const isRevealed = currentMode === 1 || enRevealed;
        noteDisplay.textContent = isRevealed ? note : '💡';
        noteDisplay.hidden = false;
    }

    function openNoteModal() {
        if (!currentFavId) {
            showError('请先加载收藏');
            return;
        }
        if (!Array.isArray(entries) || entries.length === 0) {
            showError('当前没有句子');
            return;
        }
        noteInput.value = getCurrentNote() || '';
        noteIndexLabel.textContent = `${currentIndex + 1}/${entries.length}`;
        noteModal.hidden = false;
        setTimeout(() => { noteInput.focus(); }, 0);
    }

    function closeNoteModal() {
        noteModal.hidden = true;
    }

    async function persistNotesForCurrent(notes) {
        if (!currentFavId) return;
        const fav = favorites.find(f => f.id === currentFavId);
        if (!fav) return;
        fav.notes = notes;
        try {
            await updateFavorite(currentFavId, { notes });
        } catch (err) {
            showError(`保存笔记失败: ${err.message || err}`);
            throw err;
        }
    }

    async function saveNote() {
        if (!currentFavId) {
            showError('请先加载收藏');
            return;
        }
        const fav = favorites.find(f => f.id === currentFavId);
        if (!fav) {
            console.warn('[note] current favorite not in local cache', currentFavId);
            showError('当前收藏未加载,请重新打开收藏');
            return;
        }
        const text = noteInput.value;
        let notes = Array.isArray(fav.notes) ? [...fav.notes] : [];
        const idx = notes.findIndex(n => n.index === currentIndex);
        if (text.trim()) {
            if (idx >= 0) {
                notes[idx] = { index: currentIndex, note: text };
            } else {
                notes.push({ index: currentIndex, note: text });
            }
        } else if (idx >= 0) {
            notes.splice(idx, 1);
        }
        try {
            await persistNotesForCurrent(notes);
            renderNote();
            closeNoteModal();
        } catch {}
    }

    async function deleteNote() {
        if (!currentFavId) return;
        const fav = favorites.find(f => f.id === currentFavId);
        if (!fav) {
            showError('当前收藏未加载');
            return;
        }
        const next = Array.isArray(fav.notes) ? fav.notes.filter(n => n.index !== currentIndex) : [];
        try {
            await persistNotesForCurrent(next);
            renderNote();
            closeNoteModal();
        } catch {}
    }

    favSaveOk.addEventListener('click', async () => {
        const name = favSaveInput.value.trim();
        if (!name) {
            favSaveInput.focus();
            return;
        }
        if (favModalMode === 'rename') {
            try {
                await updateFavorite(favRenameId, { name });
                await refreshFavorites();
                const updated = favorites.find(f => f.id === favRenameId);
                closeFavSaveModal();
                setFavStatus(updated || { id: favRenameId, name });
            } catch (err) {
                showError(`重命名失败: ${err.message || err}`);
            }
            return;
        }
        const payload = entries;
        if (!Array.isArray(payload) || payload.length === 0) {
            showError('当前没有可收藏的 JSON 数据');
            return;
        }
        try {
            const newId = await saveFavorite(name, payload);
            await refreshFavorites();
            const newFav = favorites.find(f => f.id === newId);
            closeFavSaveModal();
            setFavStatus(newFav || { name });
        } catch (err) {
            showError(`收藏失败: ${err.message || err}`);
        }
    });

    function applyBg(dataUrl) {
        if (dataUrl) {
            document.body.style.backgroundImage = `url(${dataUrl})`;
            document.body.classList.add('has-bg');
        } else {
            document.body.style.backgroundImage = '';
            document.body.classList.remove('has-bg');
        }
    }

    function renderBgList() {
        bgList.innerHTML = '';
        bgImages.forEach(img => {
            const li = document.createElement('li');
            li.className = 'bg-list-item';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'bg-name';
            nameSpan.textContent = img.name;
            const previewBtn = document.createElement('button');
            previewBtn.className = 'bg-preview-btn';
            previewBtn.textContent = '👁';
            previewBtn.title = '预览';
            previewBtn.addEventListener('click', () => {
                applyBg(img.dataUrl);
                currentBgId = img.id;
            });
            const onlyBtn = document.createElement('button');
            onlyBtn.className = 'bg-only-btn' + (onlyBgId === img.id ? ' active' : '');
            onlyBtn.textContent = 'only';
            onlyBtn.title = '只显示这张';
            onlyBtn.addEventListener('click', () => {
                onlyBgId = (onlyBgId === img.id) ? -1 : img.id;
                if (onlyBgId === -1) {
                    localStorage.removeItem(STORAGE_KEY_ONLY_BG);
                } else {
                    localStorage.setItem(STORAGE_KEY_ONLY_BG, String(onlyBgId));
                }
                renderBgList();
                if (onlyBgId !== -1) {
                    applyOnlyBg();
                } else if (bgImages.length > 0) {
                    pickRandomBg();
                }
            });
            const delBtn = document.createElement('button');
            delBtn.className = 'bg-delete-btn';
            delBtn.textContent = '×';
            delBtn.title = '删除';
            delBtn.addEventListener('click', async () => {
                await deleteBg(img.id);
                if (onlyBgId === img.id) {
                    onlyBgId = -1;
                    localStorage.removeItem(STORAGE_KEY_ONLY_BG);
                }
                bgImages = bgImages.filter(b => b.id !== img.id);
                if (bgImages.length === 0) {
                    applyBg(null);
                    currentBgId = -1;
                } else if (currentBgId === img.id) {
                    if (!applyOnlyBg()) pickRandomBg();
                }
                renderBgList();
            });
            li.appendChild(nameSpan);
            li.appendChild(previewBtn);
            li.appendChild(onlyBtn)
            li.appendChild(delBtn);
            bgList.appendChild(li);
        });
    }

    function pickRandomBg() {
        if (bgImages.length === 0) return;
        let candidates = bgImages;
        if (bgImages.length > 1) {
            candidates = bgImages.filter(b => b.id !== currentBgId);
        }
        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        currentBgId = picked.id;
        applyBg(picked.dataUrl);
    }

    function applyOnlyBg() {
        if (onlyBgId === -1) return false;
        const locked = bgImages.find(b => b.id === onlyBgId);
        if (!locked) {
            onlyBgId = -1;
            return false;
        }
        currentBgId = locked.id;
        applyBg(locked.dataUrl);
        return true;
    }

        if (entries.length === 0) return;
        const [cn, en] = entries[currentIndex];

    bgFileInput.addEventListener('change', () => {
        const file = bgFileInput.files[0];
        console.log('[bg] change fired, file:', file?.name, 'type:', file?.type);
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            showError('请选择图片文件');
            bgFileInput.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
            console.log('[bg] reader onload, result len:', reader.result?.length);
            try {
                const rec = await addBg(reader.result);
                console.log('[bg] addBg returned:', rec);
                bgImages.push(rec);
                pickRandomBg();
                renderBgList();
                console.log('[bg] renderBgList done, children:', bgList.children.length);
                bgFileInput.value = '';
            } catch (err) {
                console.error('[bg] addBg error:', err);
                showError(`保存失败: ${err.message}`);
            }
        };
        reader.onerror = (e) => {
            console.error('[bg] reader error:', e);
            showError('读取文件失败');
        };
        reader.readAsDataURL(file);
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (!favSaveModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                closeFavSaveModal();
            } else if (!favListModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                closeFavListModal();
            } else if (!noteModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                closeNoteModal();
            } else if (!bgModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                bgModal.hidden = true;
            } else if (!cnModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                hideAllCn();
            }
        }
        if (!favSaveModal.hidden || !noteModal.hidden) {
            return;
        }
        if (e.key === 'f' && e.altKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            e.stopPropagation();
            openFavListModal();
            return;
        }
        if (e.key === 'f' && !e.ctrlKey && !e.altKey && !e.metaKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            openFavSaveModal();
            return;
        }
        if (e.key === 'q' && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            const sel = window.getSelection()?.toString().trim();
            if (sel) {
                sidePanel.contentWindow?.postMessage(
                    { type: 'cn-en-q', content: sel },
                    '*'
                );
            }
        }
        if (e.key === 'w' && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            const sel = window.getSelection()?.toString().trim();
            if (sel) {
                sidePanel.contentWindow?.postMessage(
                    { type: 'cn-en-append', content: sel },
                    '*'
                );
            }
        }
        if (e.key === 'e' && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            const sel = window.getSelection()?.toString().trim();
            if (sel) {
                sidePanel.contentWindow?.postMessage(
                    { type: 'cn-en-br', content: sel },
                    '*'
                );
            }
        }
        if (e.key === 'r' && !e.ctrlKey && !e.altKey && !e.metaKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            const sel = window.getSelection()?.toString().trim();
            if (sel && !/[一-龥]/.test(sel)) {
                speakEn(true, sel);
            } else {
                speakEn(true);
            }
        }
        if (e.key === 't' && !e.ctrlKey && !e.altKey && !e.metaKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            speakCn(true);
        }
    });

    function copyEntryWithTildes() {
        if (entries.length === 0) return;
        const [cn, en] = entries[currentIndex];
        navigator.clipboard.writeText(`${cn}|~${en}~~|`);
    }

    cnText.addEventListener('click', (e) => {
        if (e.altKey) {
            e.preventDefault();
            copyEntryToClipboard();
        } else if (e.ctrlKey) {
            e.preventDefault();
            copyEntryWithTildes();
        }
    });
    enText.addEventListener('click', (e) => {
        if (e.altKey) {
            e.preventDefault();
            speakEn(true);
        }
    });

    function showError(msg) {
        errorBar.textContent = msg;
        errorBar.style.display = 'block';
        if (errorTimer) clearTimeout(errorTimer);
        errorTimer = setTimeout(() => {
            errorBar.style.display = 'none';
            errorTimer = null;
        }, 3000);
    }

    function clearError() {
        errorBar.style.display = 'none';
        if (errorTimer) {
            clearTimeout(errorTimer);
            errorTimer = null;
        }
    }

    function maskEnText(text, preserveFirst) {

        return text.replace(/[a-zA-Z]+/g, (match) =>
            preserveFirst
                ? ((match.length <= 2 || ["the", "that", "The", "and"].includes(match)) ? match : match[0] + '_'.repeat(match.length - 1))
                : '_'.repeat(match.length)
        );
    }

    function populateVoices() {
        const voices = window.speechSynthesis.getVoices();
        voicesCN = voices.filter(v => v.lang === "zh-CN");//&& !v.name.includes("PRC")
        voiceSelect.innerHTML = voicesCN
            .map(v => `<option value="${v.name}">${v.name}</option>`)
            .join("");
        const saved = localStorage.getItem(STORAGE_KEY_VOICE);
        if (saved && voicesCN.find(v => v.name === saved)) {
            voiceSelect.value = saved;
            selectedVoice = voicesCN.find(v => v.name === saved);
        } else {
            selectedVoice = voicesCN[0] || null;
            if (selectedVoice) voiceSelect.value = selectedVoice.name;
        }
        voicesEN = voices.filter(v => v.lang.startsWith("en-"));
        voiceSelectEn.innerHTML = voicesEN
            .map(v => `<option value="${v.name}">${v.name}</option>`)
            .join("");
        const savedEn = localStorage.getItem(STORAGE_KEY_VOICE_EN);
        if (savedEn && voicesEN.find(v => v.name === savedEn)) {
            voiceSelectEn.value = savedEn;
            selectedVoiceEn = voicesEN.find(v => v.name === savedEn);
        } else {
            selectedVoiceEn = voicesEN[0] || null;
            if (selectedVoiceEn) voiceSelectEn.value = selectedVoiceEn.name;
        }
    }

    function render() {
        if (entries.length === 0) {
            emptyState.hidden = false;
            counter.hidden = true;
            cnText.hidden = true;
            enText.hidden = true;
            hint.hidden = true;
            noteDisplay.hidden = true;
            return;
        }
        emptyState.hidden = true;
        counter.hidden = false;
        cnText.hidden = false;
        enText.hidden = false;
        hint.hidden = false;
        const [cn, en] = entries[currentIndex];
        counter.textContent = `${currentIndex + 1}/${entries.length}`;
        cnText.innerHTML = cn;
        cnText.classList.toggle('last-entry', currentIndex === entries.length - 1);
        enRevealed = false;
        if (currentMode === 1) {
            enText.textContent = en;
        } else {
            enText.textContent = maskEnText(en, currentMode === 2);
        }
        renderNote();
        speakCn();
        if (bgImages.length > 0 && !applyOnlyBg()) pickRandomBg();
        postCnEnToChild();
    }

    const STORAGE_KEY_DATA = 'cn2en-json:data';
    const STORAGE_KEY_INDEX = 'cn2en-json:index';
    const STORAGE_KEY_VOICE = 'cn2en-json:voice';
    const STORAGE_KEY_TTS = 'cn2en-json:ttsEnabled';
    const STORAGE_KEY_VOICE_EN = 'cn2en-json:voiceEn';
    const STORAGE_KEY_TTS_EN = 'cn2en-json:ttsEnabledEn';
    const STORAGE_KEY_RATE_CN = 'cn2en-json:rateCn';
    const STORAGE_KEY_RATE_EN = 'cn2en-json:rateEn';
    const STORAGE_KEY_MODE = 'cn2en-json:mode';
    const STORAGE_KEY_ONLY_BG = 'cn2en-json:onlyBg';

    let voicesCN = [];
    let selectedVoice = null;
    let ttsEnabled = true;
    let voicesEN = [];
    let selectedVoiceEn = null;
    let ttsEnabledEn = false;
    let cnRate = 1.0;
    let enRate = 1.0;
    let currentMode = 1;
    let enRevealed = false;
    let enShown = true;


    function saveState() {
        localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(entries));
        localStorage.setItem(STORAGE_KEY_INDEX, String(currentIndex));
    }

    function loadState() {
        try {
            const data = localStorage.getItem(STORAGE_KEY_DATA);
            const index = localStorage.getItem(STORAGE_KEY_INDEX);
            if (data && index !== null) {
                entries = JSON.parse(data);
                currentIndex = parseInt(index, 10) || 0;
            }
        } catch (err) {
            console.error('恢复状态失败:', err);
        }
    }

    function speakCn(force) {
        if (entries.length === 0) return;
        if (force || (ttsEnabled && selectedVoice)) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(entries[currentIndex][0]);
            utterance.voice = selectedVoice;
            utterance.rate = cnRate;
            if (!force && ttsEnabledEn && selectedVoiceEn) {
                utterance.onend = () => speakEn();
            }
            window.speechSynthesis.speak(utterance);
        } else if (ttsEnabledEn && selectedVoiceEn) {
            speakEn();
        }
    }

    function speakEn(force, text) {
        if (!selectedVoiceEn) return;
        if (!force && !ttsEnabledEn) return;
        const content = text ?? entries[currentIndex][1];
        if (!content) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(content);
        utterance.voice = selectedVoiceEn;
        utterance.rate = enRate;
        window.speechSynthesis.speak(utterance);
    }

    function extractJsonObjects(text) {
        const objects = [];
        let depth = 0;
        let start = -1;
        let inString = false;
        let escape = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (escape) { escape = false; continue; }
            if (c === '\\' && inString) { escape = true; continue; }
            if (c === '"') { inString = !inString; continue; }
            if (inString) continue;
            if (c === '{') {
                if (depth === 0) start = i;
                depth++;
            } else if (c === '}') {
                depth--;
                if (depth === 0 && start !== -1) {
                    objects.push(text.slice(start, i + 1));
                    start = -1;
                }
            }
        }
        return objects;
    }

    function parseAndLoad(text) {
        const stripped = text.replace(/^📕.*$/gm, '');
        const jsonStrings = extractJsonObjects(stripped);
        if (jsonStrings.length === 0) {
            showError('未找到 JSON 数据');
            return;
        }
        const allEntries = [];
        for (const jsonStr of jsonStrings) {
            let parsed;
            try {
                parsed = JSON.parse(jsonStr);
            } catch (err) {
                showError(`JSON 解析失败: ${err.message}`);
                return;
            }
            if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
                showError('JSON 格式错误：必须为对象');
                return;
            }
            const objEntries = Object.entries(parsed);
            if (objEntries.length === 0) {
                showError('JSON 不能为空对象');
                return;
            }
            allEntries.push(...objEntries);
        }
        entries = allEntries;
        currentIndex = 0;
        clearError();
        saveState();
        render();
        updateFavStatus();
    }

    document.addEventListener('keydown', async function (e) {
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyI') {
            e.preventDefault();
            renderBgList();
            bgModal.hidden = false;
        }
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyO') {
            e.preventDefault();
            const shown = sidePanel.classList.toggle('shown');
            document.body.classList.toggle('side-panel-open', shown);
            if (shown) postCnEnToChild();
        }
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyV' && favSaveModal.hidden && noteModal.hidden) {
            e.preventDefault();
            try {
                const text = await navigator.clipboard.readText();
                parseAndLoad(text);
            } catch (err) {
                showError(`剪贴板读取失败: ${err.message || err}`);
            }
        }
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyX' && favSaveModal.hidden && noteModal.hidden) {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;
            e.preventDefault();
            const sel = window.getSelection()?.toString();
            if (!sel) return;
            try {
                const cur = await navigator.clipboard.readText();
                await navigator.clipboard.writeText(cur ? cur + ' ' + sel : sel);
            } catch (err) {
                showError(`剪贴板追加失败: ${err.message || err}`);
            }
        }
        if (e.code === 'ArrowDown' && !e.ctrlKey && !e.altKey && !e.shiftKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            enRevealed = !enRevealed;
            if (currentMode === 1 || enRevealed) {
                enText.textContent = entries[currentIndex][1];
            } else {
                enText.textContent = maskEnText(entries[currentIndex][1], currentMode === 2);
            }
            renderNote();
        }
        if (e.code === 'ArrowUp' && !e.ctrlKey && !e.altKey && !e.shiftKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            enShown = !enShown;
            enText.style.visibility = enShown ? "visible" : "hidden"
        }
        if (!e.ctrlKey && !e.altKey && !e.shiftKey && e.code === 'KeyZ' && favSaveModal.hidden && noteModal.hidden) {
            if (entries.length === 0) return;
            if (cnModal.hidden) {
                showAllCn();
            } else {
                hideAllCn();
            }
        }
        if (!e.ctrlKey && !e.altKey && !e.shiftKey && favSaveModal.hidden && noteModal.hidden) {
            const tag = e.target.tagName;
            if (e.code === 'KeyN' && noteModal.hidden && tag !== 'INPUT' && tag !== 'TEXTAREA') {
                if (entries.length === 0) return;
                e.preventDefault();
                openNoteModal();
                return;
            }
            if (e.code === 'Digit1' || e.code === 'Numpad1') {
                e.preventDefault();
                applyMode(1);
            } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
                e.preventDefault();
                applyMode(2);
            } else if (e.code === 'Digit3' || e.code === 'Numpad3') {
                e.preventDefault();
                applyMode(3);
            }
        }
        if (entries.length > 0) {
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + entries.length) % entries.length;
                saveState();
                render();
                if(!enShown){
                    enText.style.visibility = "visible"
                    enShown = true
                }
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % entries.length;
                saveState();
                render();
                if(!enShown){
                    enText.style.visibility = "visible"
                    enShown = true
                }
            }
        }
    });

    loadState();
    refreshFavorites().then(() => {
        if (entries.length > 0) return updateFavStatus();
    }).then(() => render());
    ttsEnabled = localStorage.getItem(STORAGE_KEY_TTS) !== "false";
    ttsToggle.checked = ttsEnabled;
    ttsEnabledEn = localStorage.getItem(STORAGE_KEY_TTS_EN) === "true";
    ttsToggleEn.checked = ttsEnabledEn;
    const savedMode = localStorage.getItem(STORAGE_KEY_MODE);
    if (savedMode === "2" || savedMode === "3") {
        currentMode = parseInt(savedMode, 10);
    }
    modeRadios.forEach(radio => {
        radio.checked = parseInt(radio.value, 10) === currentMode;
    });
    const savedCnRate = parseFloat(localStorage.getItem(STORAGE_KEY_RATE_CN));
    if (!isNaN(savedCnRate) && savedCnRate >= 1 && savedCnRate <= 3) {
        cnRate = savedCnRate;
        cnRateInput.value = String(cnRate);
        cnRateValue.textContent = cnRate.toFixed(1);
    }
    const savedEnRate = parseFloat(localStorage.getItem(STORAGE_KEY_RATE_EN));
    if (!isNaN(savedEnRate) && savedEnRate >= 1 && savedEnRate <= 3) {
        enRate = savedEnRate;
        enRateInput.value = String(enRate);
        enRateValue.textContent = enRate.toFixed(1);
    }
    populateVoices();
    loadAllBg().then(list => {
        bgImages = list;
        const savedOnly = parseInt(localStorage.getItem(STORAGE_KEY_ONLY_BG), 10);
        if (!isNaN(savedOnly) && bgImages.some(b => b.id === savedOnly)) {
            onlyBgId = savedOnly;
            applyOnlyBg();
        } else if (bgImages.length > 0) {
            if (!isNaN(savedOnly)) localStorage.removeItem(STORAGE_KEY_ONLY_BG);
            pickRandomBg();
        }
    });
    voiceSelect.addEventListener('change', () => {
        selectedVoice = voicesCN.find(v => v.name === voiceSelect.value) || null;
        if (selectedVoice) {
            localStorage.setItem(STORAGE_KEY_VOICE, selectedVoice.name);
        }
    });
    ttsToggle.addEventListener('change', () => {
        ttsEnabled = ttsToggle.checked;
        localStorage.setItem(STORAGE_KEY_TTS, String(ttsEnabled));
        if (!ttsEnabled) window.speechSynthesis.cancel();
    });
    voiceSelectEn.addEventListener('change', () => {
        selectedVoiceEn = voicesEN.find(v => v.name === voiceSelectEn.value) || null;
        if (selectedVoiceEn) {
            localStorage.setItem(STORAGE_KEY_VOICE_EN, selectedVoiceEn.name);
        }
    });
    ttsToggleEn.addEventListener('change', () => {
        ttsEnabledEn = ttsToggleEn.checked;
        localStorage.setItem(STORAGE_KEY_TTS_EN, String(ttsEnabledEn));
        if (!ttsEnabledEn) window.speechSynthesis.cancel();
    });
    cnRateInput.addEventListener('input', () => {
        cnRate = parseFloat(cnRateInput.value);
        cnRateValue.textContent = cnRate.toFixed(1);
        localStorage.setItem(STORAGE_KEY_RATE_CN, String(cnRate));
    });
    enRateInput.addEventListener('input', () => {
        enRate = parseFloat(enRateInput.value);
        enRateValue.textContent = enRate.toFixed(1);
        localStorage.setItem(STORAGE_KEY_RATE_EN, String(enRate));
    });
    function applyMode(mode) {
        currentMode = mode;
        localStorage.setItem(STORAGE_KEY_MODE, String(mode));
        modeRadios.forEach(r => {
            r.checked = parseInt(r.value, 10) === mode;
        });
        if (entries.length > 0) {
            if (mode === 1) {
                enText.textContent = entries[currentIndex][1];
            } else {
                enText.textContent = maskEnText(entries[currentIndex][1], mode === 2);
            }
            renderNote();
        }
    }
    modeRadios.forEach(radio => {
        radio.addEventListener('change', () => {
            if (radio.checked) applyMode(parseInt(radio.value, 10));
        });
    });
    window.speechSynthesis.onvoiceschanged = populateVoices;
</script>
</body>
