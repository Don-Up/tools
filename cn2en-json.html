<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cn2en-json</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        body > div { margin: 0 auto; }
        .error-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #7a1f1f;
            color: #fff;
            padding: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        .counter {
            font-size: 18px;
            color: #888;
            position: fixed;
            bottom: 20px;
            left: 20px;
        }
        .cn-text {
            font-size: 64px;
            color: wheat;
            font-family: 华文细黑, 楷体, serif;
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            line-height: 1.3;
            cursor: pointer;
        }
        .en-text {
            font-size: 48px;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            line-height: 1.3;
            cursor: pointer;
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
        }
        body.side-panel-open .hint {
            left: calc(50% - 20vw);
        }
        .empty-state {
            font-size: 24px;
            color: #888;
            text-align: center;
        }
        [hidden] { display: none; }
        .tts-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .voice-select {
            padding: 4px 8px;
            font-size: 14px;
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
        }
        .tts-toggle-label {
            font-size: 14px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .tts-toggle-label input {
            width: 16px;
            height: 16px;
            margin: 0;
        }
        #ttsControlsEn { top: 60px; }
        .speed-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }
        .speed-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #888;
        }
        .speed-label {
            font-size: 12px;
            color: #888;
            width: 24px;
        }
        .rate-slider {
            width: 100px;
            cursor: pointer;
        }
        .rate-value {
            min-width: 30px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .mode-controls {
            position: fixed;
            top: 100px;
            left: 20px;
            z-index: 5;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .mode-radio-label {
            font-size: 14px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .mode-radio-label input {
            width: 14px;
            height: 14px;
            margin: 0;
        }
        .cn-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cn-modal[hidden] { display: none; }
        .cn-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.1);
        }
        .cn-modal-panel {
            position: relative;
            max-width: 80vw;
            max-height: 80vh;
            overflow-y: auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
        }
        .cn-modal-text {
            font-size: 24px;
            color: wheat;
            line-height: 1.5;
            white-space: pre-wrap;
            font-family: 华文细黑, 楷体, serif;
        }
        .bg-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-modal[hidden] { display: none; }
        .bg-modal-backdrop {
            position: absolute;
            inset: 0;
            background: transparent;
        }
        .bg-modal-panel {
            position: relative;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bg-modal-title {
            font-size: 20px;
            color: #e0e0e0;
            text-align: center;
        }
        .bg-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .bg-modal-actions button {
            padding: 6px 16px;
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .bg-modal-actions button:hover { background: #3a3a3a; }
        body.has-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body.has-bg #textStage {
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 8px;
        }
        #textStage {
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
            max-width: 100%;
        }
        .bg-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
            min-width: 260px;
        }
        .bg-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            color: #e0e0e0;
            font-size: 14px;
            border-radius: 4px;
        }
        .bg-list-item:hover { background: #2c2c2c; }
        .bg-preview-btn {
            background: transparent;
            color: #6cf;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 0 8px;
            line-height: 1;
        }
        .bg-preview-btn:hover { color: #9df; }
        .bg-delete-btn {
            background: transparent;
            color: #c66;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
            line-height: 1;
        }
        .bg-delete-btn:hover { color: #f88; }
        .bg-list:empty::before {
            content: '暂无背景图片';
            color: #666;
            font-size: 13px;
            display: block;
            text-align: center;
            padding: 8px;
        }
        #sidePanel {
            position: fixed;
            top: 0;
            right: 0;
            width: 40vw;
            height: 100vh;
            border: none;
            background: #121212;
            z-index: 50;
            display: none;
        }
        #sidePanel.shown { display: block; }
        body.side-panel-open { padding-right: 40vw; }
        #card { width: 100%; }
        .cn-modal-panel::-webkit-scrollbar {
            width: 10px;
        }
        .cn-modal-panel::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        .cn-modal-panel::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 5px;
        }
        .cn-modal-panel::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
        .cn-modal-panel {
            scrollbar-color: #444 #1e1e1e;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
<div>
    <div id="card">

        <div id="errorBar" class="error-bar"></div>
        <div id="ttsControls" class="tts-controls">
            <select id="voiceSelect" class="voice-select"></select>
            <label class="tts-toggle-label"><input type="checkbox" id="ttsToggle" checked> TTS</label>
        </div>
        <div id="ttsControlsEn" class="tts-controls">
            <select id="voiceSelectEn" class="voice-select"></select>
            <label class="tts-toggle-label"><input type="checkbox" id="ttsToggleEn"> EN TTS</label>
        </div>
        <div id="modeControls" class="mode-controls">
            <label class="mode-radio-label"><input type="radio" name="mode" value="1" checked> Mode 1</label>
            <label class="mode-radio-label"><input type="radio" name="mode" value="2"> Mode 2</label>
            <label class="mode-radio-label"><input type="radio" name="mode" value="3"> Mode 3</label>
        </div>
        <div id="speedControls" class="speed-controls">
            <div class="speed-row">
                <span class="speed-label">CN</span>
                <input type="range" id="cnRate" min="1" max="3" value="1" step="0.1" class="rate-slider">
                <span id="cnRateValue" class="rate-value">1.0</span>
            </div>
            <div class="speed-row">
                <span class="speed-label">EN</span>
                <input type="range" id="enRate" min="1" max="3" value="1" step="0.1" class="rate-slider">
                <span id="enRateValue" class="rate-value">1.0</span>
            </div>
            <!--        <div id="counter" class="counter" hidden></div>-->
        </div>
        <div id="textStage">
            <div id="cnText" class="cn-text" hidden></div>
            <div id="enText" class="en-text" hidden></div>
        </div>
        <div id="counter" class="counter" hidden></div>

        <div id="hint" class="hint">← → 切换 · 1-3 切 Mode · S 揭示 · E/PgDn 读 EN · Z 全文 · Ctrl+I 背景</div>
        <div id="emptyState" class="empty-state">按 Ctrl+V 粘贴 JSON 数据</div>
        <div id="cnModal" class="cn-modal" hidden>
            <div id="cnModalBackdrop" class="cn-modal-backdrop"></div>
            <div id="cnModalPanel" class="cn-modal-panel">
                <div id="cnModalText" class="cn-modal-text"></div>
            </div>
        </div>
        <div id="bgModal" class="bg-modal" hidden>
            <div id="bgModalBackdrop" class="bg-modal-backdrop"></div>
            <div id="bgModalPanel" class="bg-modal-panel">
                <div class="bg-modal-title">背景图片</div>
                <ul id="bgList" class="bg-list"></ul>
                <div class="bg-modal-actions">
                    <button id="bgAddBtn">选择图片</button>
                    <button id="bgCloseBtn">关闭</button>
                </div>
            </div>
            <input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>
        </div>
    </div>

    <iframe id="sidePanel" src="https://don-up.github.io/tools/card-timer"></iframe>
</div>
<script>

    let entries = [];
    let currentIndex = 0;
    let errorTimer = null;

    const errorBar = document.getElementById('errorBar');
    const counter = document.getElementById('counter');
    const cnText = document.getElementById('cnText');
    const enText = document.getElementById('enText');
    const hint = document.getElementById('hint');
    const emptyState = document.getElementById('emptyState');
    const voiceSelect = document.getElementById('voiceSelect');
    const ttsToggle = document.getElementById('ttsToggle');
    const voiceSelectEn = document.getElementById('voiceSelectEn');
    const ttsToggleEn = document.getElementById('ttsToggleEn');
    const cnRateInput = document.getElementById('cnRate');
    const enRateInput = document.getElementById('enRate');
    const cnRateValue = document.getElementById('cnRateValue');
    const enRateValue = document.getElementById('enRateValue');
    const modeRadios = document.querySelectorAll('input[name="mode"]');
    const cnModal = document.getElementById('cnModal');
    const cnModalBackdrop = document.getElementById('cnModalBackdrop');
    const cnModalPanel = document.getElementById('cnModalPanel');
    const cnModalText = document.getElementById('cnModalText');
    const bgModal = document.getElementById('bgModal');
    const bgModalBackdrop = document.getElementById('bgModalBackdrop');
    const bgFileInput = document.getElementById('bgFileInput');
    const bgCloseBtn = document.getElementById('bgCloseBtn');
    const bgList = document.getElementById('bgList');
    const bgAddBtn = document.getElementById('bgAddBtn');
    const sidePanel = document.getElementById('sidePanel');
    let bgImages = [];
    let currentBgId = -1;

    function copyEntryToClipboard() {
        if (entries.length === 0) return;
        const [cn, en] = entries[currentIndex];
        navigator.clipboard.writeText(`${cn}|${en}|`);
    }

    function showAllCn() {
        if (entries.length === 0) return;
        cnModalText.textContent = entries.map(e => e[0]).join('\n\n');
        cnModal.hidden = false;
    }
    function hideAllCn() {
        cnModal.hidden = true;
    }
    cnModalBackdrop.addEventListener('click', hideAllCn);

    const DB_NAME = 'cn2en-json-bg';
    const DB_VERSION = 3;
    const STORE = 'images';

    function openBgDb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (db.objectStoreNames.contains(STORE)) {
                    db.deleteObjectStore(STORE);
                }
                db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function loadAllBg() {
        const db = await openBgDb();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).getAll();
            req.onsuccess = () => resolve((req.result || []).sort((a, b) => a.id - b.id));
            req.onerror = () => resolve([]);
        });
    }

    async function addBg(dataUrl) {
        const db = await openBgDb();
        const all = await loadAllBg();
        const name = `image${all.length + 1}`;
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const store = tx.objectStore(STORE);
            const req = store.add({ name, dataUrl });
            req.onsuccess = () => resolve({ id: req.result, name, dataUrl });
            req.onerror = () => reject(req.error);
        });
    }

    async function deleteBg(id) {
        const db = await openBgDb();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
        });
    }

    function applyBg(dataUrl) {
        if (dataUrl) {
            document.body.style.backgroundImage = `url(${dataUrl})`;
            document.body.classList.add('has-bg');
        } else {
            document.body.style.backgroundImage = '';
            document.body.classList.remove('has-bg');
        }
    }

    function renderBgList() {
        bgList.innerHTML = '';
        bgImages.forEach(img => {
            const li = document.createElement('li');
            li.className = 'bg-list-item';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'bg-name';
            nameSpan.textContent = img.name;
            const previewBtn = document.createElement('button');
            previewBtn.className = 'bg-preview-btn';
            previewBtn.textContent = '👁';
            previewBtn.title = '预览';
            previewBtn.addEventListener('click', () => {
                applyBg(img.dataUrl);
                currentBgId = img.id;
            });
            const delBtn = document.createElement('button');
            delBtn.className = 'bg-delete-btn';
            delBtn.textContent = '×';
            delBtn.title = '删除';
            delBtn.addEventListener('click', async () => {
                await deleteBg(img.id);
                bgImages = bgImages.filter(b => b.id !== img.id);
                if (bgImages.length === 0) {
                    applyBg(null);
                    currentBgId = -1;
                } else if (currentBgId === img.id) {
                    pickRandomBg();
                }
                renderBgList();
            });
            li.appendChild(nameSpan);
            li.appendChild(previewBtn);
            li.appendChild(delBtn);
            bgList.appendChild(li);
        });
    }

    function pickRandomBg() {
        if (bgImages.length === 0) return;
        let candidates = bgImages;
        if (bgImages.length > 1) {
            candidates = bgImages.filter(b => b.id !== currentBgId);
        }
        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        currentBgId = picked.id;
        applyBg(picked.dataUrl);
    }

    function postCnEnToChild() {
        if (entries.length === 0) return;
        const [cn, en] = entries[currentIndex];
        sidePanel.contentWindow?.postMessage(
            { type: 'cn-en', content: `${cn}|${en}|` },
            '*'
        );
    }

    bgAddBtn.addEventListener('click', () => bgFileInput.click());

    bgFileInput.addEventListener('change', () => {
        const file = bgFileInput.files[0];
        console.log('[bg] change fired, file:', file?.name, 'type:', file?.type);
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            showError('请选择图片文件');
            bgFileInput.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
            console.log('[bg] reader onload, result len:', reader.result?.length);
            try {
                const rec = await addBg(reader.result);
                console.log('[bg] addBg returned:', rec);
                bgImages.push(rec);
                pickRandomBg();
                renderBgList();
                console.log('[bg] renderBgList done, children:', bgList.children.length);
                bgFileInput.value = '';
            } catch (err) {
                console.error('[bg] addBg error:', err);
                showError(`保存失败: ${err.message}`);
            }
        };
        reader.onerror = (e) => {
            console.error('[bg] reader error:', e);
            showError('读取文件失败');
        };
        reader.readAsDataURL(file);
    });

    bgCloseBtn.addEventListener('click', () => { bgModal.hidden = true; });
    bgModalBackdrop.addEventListener('click', () => { bgModal.hidden = true; });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (!bgModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                bgModal.hidden = true;
            } else if (!cnModal.hidden) {
                e.preventDefault();
                e.stopPropagation();
                hideAllCn();
            }
        }
    });

    function copyEntryWithTildes() {
        if (entries.length === 0) return;
        const [cn, en] = entries[currentIndex];
        navigator.clipboard.writeText(`${cn}|~${en}~~|`);
    }

    cnText.addEventListener('click', (e) => {
        if (e.altKey) {
            e.preventDefault();
            copyEntryToClipboard();
        } else if (e.ctrlKey) {
            e.preventDefault();
            copyEntryWithTildes();
        } else {
            speakCn(true);
        }
    });
    enText.addEventListener('click', () => speakEn(true));

    function showError(msg) {
        errorBar.textContent = msg;
        errorBar.style.display = 'block';
        if (errorTimer) clearTimeout(errorTimer);
        errorTimer = setTimeout(() => {
            errorBar.style.display = 'none';
            errorTimer = null;
        }, 3000);
    }

    function clearError() {
        errorBar.style.display = 'none';
        if (errorTimer) {
            clearTimeout(errorTimer);
            errorTimer = null;
        }
    }

    function maskEnText(text, preserveFirst) {

        return text.replace(/[a-zA-Z]+/g, (match) =>
            preserveFirst
                ? ((match.length <= 2 || ["the", "that", "The", "and"].includes(match)) ? match : match[0] + '_'.repeat(match.length - 1))
                : '_'.repeat(match.length)
        );
    }

    function populateVoices() {
        const voices = window.speechSynthesis.getVoices();
        voicesCN = voices.filter(v => v.lang === "zh-CN");//&& !v.name.includes("PRC")
        voiceSelect.innerHTML = voicesCN
            .map(v => `<option value="${v.name}">${v.name}</option>`)
            .join("");
        const saved = localStorage.getItem(STORAGE_KEY_VOICE);
        if (saved && voicesCN.find(v => v.name === saved)) {
            voiceSelect.value = saved;
            selectedVoice = voicesCN.find(v => v.name === saved);
        } else {
            selectedVoice = voicesCN[0] || null;
            if (selectedVoice) voiceSelect.value = selectedVoice.name;
        }
        voicesEN = voices.filter(v => v.lang.startsWith("en-"));
        voiceSelectEn.innerHTML = voicesEN
            .map(v => `<option value="${v.name}">${v.name}</option>`)
            .join("");
        const savedEn = localStorage.getItem(STORAGE_KEY_VOICE_EN);
        if (savedEn && voicesEN.find(v => v.name === savedEn)) {
            voiceSelectEn.value = savedEn;
            selectedVoiceEn = voicesEN.find(v => v.name === savedEn);
        } else {
            selectedVoiceEn = voicesEN[0] || null;
            if (selectedVoiceEn) voiceSelectEn.value = selectedVoiceEn.name;
        }
    }

    function render() {
        if (entries.length === 0) {
            emptyState.hidden = false;
            counter.hidden = true;
            cnText.hidden = true;
            enText.hidden = true;
            hint.hidden = true;
            return;
        }
        emptyState.hidden = true;
        counter.hidden = false;
        cnText.hidden = false;
        enText.hidden = false;
        hint.hidden = false;
        const [cn, en] = entries[currentIndex];
        counter.textContent = `${currentIndex + 1}/${entries.length}`;
        cnText.textContent = cn;
        enRevealed = false;
        if (currentMode === 1) {
            enText.textContent = en;
        } else {
            enText.textContent = maskEnText(en, currentMode === 2);
        }
        speakCn();
        if (bgImages.length > 0) pickRandomBg();
        postCnEnToChild();
    }

    const STORAGE_KEY_DATA = 'cn2en-json:data';
    const STORAGE_KEY_INDEX = 'cn2en-json:index';
    const STORAGE_KEY_VOICE = 'cn2en-json:voice';
    const STORAGE_KEY_TTS = 'cn2en-json:ttsEnabled';
    const STORAGE_KEY_VOICE_EN = 'cn2en-json:voiceEn';
    const STORAGE_KEY_TTS_EN = 'cn2en-json:ttsEnabledEn';
    const STORAGE_KEY_RATE_CN = 'cn2en-json:rateCn';
    const STORAGE_KEY_RATE_EN = 'cn2en-json:rateEn';
    const STORAGE_KEY_MODE = 'cn2en-json:mode';

    let voicesCN = [];
    let selectedVoice = null;
    let ttsEnabled = true;
    let voicesEN = [];
    let selectedVoiceEn = null;
    let ttsEnabledEn = false;
    let cnRate = 1.0;
    let enRate = 1.0;
    let currentMode = 1;
    let enRevealed = false;
    let enShown = true;


    function saveState() {
        localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(entries));
        localStorage.setItem(STORAGE_KEY_INDEX, String(currentIndex));
    }

    function loadState() {
        try {
            const data = localStorage.getItem(STORAGE_KEY_DATA);
            const index = localStorage.getItem(STORAGE_KEY_INDEX);
            if (data && index !== null) {
                entries = JSON.parse(data);
                currentIndex = parseInt(index, 10) || 0;
            }
        } catch (err) {
            console.error('恢复状态失败:', err);
        }
    }

    function speakCn(force) {
        if (entries.length === 0) return;
        if (force || (ttsEnabled && selectedVoice)) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(entries[currentIndex][0]);
            utterance.voice = selectedVoice;
            utterance.rate = cnRate;
            if (!force && ttsEnabledEn && selectedVoiceEn) {
                utterance.onend = () => speakEn();
            }
            window.speechSynthesis.speak(utterance);
        } else if (ttsEnabledEn && selectedVoiceEn) {
            speakEn();
        }
    }

    function speakEn(force) {
        if (!selectedVoiceEn) return;
        if (!force && !ttsEnabledEn) return;
        const utterance = new SpeechSynthesisUtterance(entries[currentIndex][1]);
        utterance.voice = selectedVoiceEn;
        utterance.rate = enRate;
        window.speechSynthesis.speak(utterance);
    }

    function extractJsonObjects(text) {
        const objects = [];
        let depth = 0;
        let start = -1;
        let inString = false;
        let escape = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (escape) { escape = false; continue; }
            if (c === '\\' && inString) { escape = true; continue; }
            if (c === '"') { inString = !inString; continue; }
            if (inString) continue;
            if (c === '{') {
                if (depth === 0) start = i;
                depth++;
            } else if (c === '}') {
                depth--;
                if (depth === 0 && start !== -1) {
                    objects.push(text.slice(start, i + 1));
                    start = -1;
                }
            }
        }
        return objects;
    }

    function parseAndLoad(text) {
        const stripped = text.replace(/^📕.*$/gm, '');
        const jsonStrings = extractJsonObjects(stripped);
        if (jsonStrings.length === 0) {
            showError('未找到 JSON 数据');
            return;
        }
        const allEntries = [];
        for (const jsonStr of jsonStrings) {
            let parsed;
            try {
                parsed = JSON.parse(jsonStr);
            } catch (err) {
                showError(`JSON 解析失败: ${err.message}`);
                return;
            }
            if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
                showError('JSON 格式错误：必须为对象');
                return;
            }
            const objEntries = Object.entries(parsed);
            if (objEntries.length === 0) {
                showError('JSON 不能为空对象');
                return;
            }
            allEntries.push(...objEntries);
        }
        entries = allEntries;
        currentIndex = 0;
        clearError();
        saveState();
        render();
    }

    document.addEventListener('keydown', async function (e) {
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyI') {
            e.preventDefault();
            renderBgList();
            bgModal.hidden = false;
        }
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyO') {
            e.preventDefault();
            const shown = sidePanel.classList.toggle('shown');
            document.body.classList.toggle('side-panel-open', shown);
            if (shown) postCnEnToChild();
        }
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.code === 'KeyV') {
            e.preventDefault();
            try {
                const text = await navigator.clipboard.readText();
                parseAndLoad(text);
            } catch (err) {
                showError(`剪贴板读取失败: ${err.message || err}`);
            }
        }
        if ((e.code === 'KeyS' || e.code === 'ArrowDown') && !e.ctrlKey && !e.altKey && !e.shiftKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            enRevealed = !enRevealed;
            if (currentMode === 1 || enRevealed) {
                enText.textContent = entries[currentIndex][1];
            } else {
                enText.textContent = maskEnText(entries[currentIndex][1], currentMode === 2);
            }
        }
        if ((e.code === 'KeyW' || e.code === 'ArrowUp') && !e.ctrlKey && !e.altKey && !e.shiftKey) {
            if (entries.length === 0) return;
            e.preventDefault();
            enShown = !enShown;
            enText.style.visibility = enShown ? "visible" : "hidden"
        }
        if (!e.ctrlKey && !e.altKey && !e.shiftKey && (e.code === 'KeyE' || e.code === 'PageDown')) {
            if (entries.length === 0) return;
            speakEn(true);
        }
        if (!e.ctrlKey && !e.altKey && !e.shiftKey && e.code === 'KeyZ') {
            if (entries.length === 0) return;
            if (cnModal.hidden) {
                showAllCn();
            } else {
                hideAllCn();
            }
        }
        if (!e.ctrlKey && !e.altKey && !e.shiftKey) {
            if (e.code === 'Digit1' || e.code === 'Numpad1') {
                e.preventDefault();
                applyMode(1);
            } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
                e.preventDefault();
                applyMode(2);
            } else if (e.code === 'Digit3' || e.code === 'Numpad3') {
                e.preventDefault();
                applyMode(3);
            }
        }
        if (entries.length > 0) {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + entries.length) % entries.length;
                saveState();
                render();
                if(!enShown){
                    enText.style.visibility = "visible"
                    enShown = true
                }
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % entries.length;
                saveState();
                render();
                if(!enShown){
                    enText.style.visibility = "visible"
                    enShown = true
                }
            }
        }
    });

    loadState();
    ttsEnabled = localStorage.getItem(STORAGE_KEY_TTS) !== "false";
    ttsToggle.checked = ttsEnabled;
    ttsEnabledEn = localStorage.getItem(STORAGE_KEY_TTS_EN) === "true";
    ttsToggleEn.checked = ttsEnabledEn;
    const savedMode = localStorage.getItem(STORAGE_KEY_MODE);
    if (savedMode === "2" || savedMode === "3") {
        currentMode = parseInt(savedMode, 10);
    }
    modeRadios.forEach(radio => {
        radio.checked = parseInt(radio.value, 10) === currentMode;
    });
    const savedCnRate = parseFloat(localStorage.getItem(STORAGE_KEY_RATE_CN));
    if (!isNaN(savedCnRate) && savedCnRate >= 1 && savedCnRate <= 3) {
        cnRate = savedCnRate;
        cnRateInput.value = String(cnRate);
        cnRateValue.textContent = cnRate.toFixed(1);
    }
    const savedEnRate = parseFloat(localStorage.getItem(STORAGE_KEY_RATE_EN));
    if (!isNaN(savedEnRate) && savedEnRate >= 1 && savedEnRate <= 3) {
        enRate = savedEnRate;
        enRateInput.value = String(enRate);
        enRateValue.textContent = enRate.toFixed(1);
    }
    populateVoices();
    loadAllBg().then(list => {
        bgImages = list;
        if (bgImages.length > 0) pickRandomBg();
    });
    voiceSelect.addEventListener('change', () => {
        selectedVoice = voicesCN.find(v => v.name === voiceSelect.value) || null;
        if (selectedVoice) {
            localStorage.setItem(STORAGE_KEY_VOICE, selectedVoice.name);
        }
    });
    ttsToggle.addEventListener('change', () => {
        ttsEnabled = ttsToggle.checked;
        localStorage.setItem(STORAGE_KEY_TTS, String(ttsEnabled));
        if (!ttsEnabled) window.speechSynthesis.cancel();
    });
    voiceSelectEn.addEventListener('change', () => {
        selectedVoiceEn = voicesEN.find(v => v.name === voiceSelectEn.value) || null;
        if (selectedVoiceEn) {
            localStorage.setItem(STORAGE_KEY_VOICE_EN, selectedVoiceEn.name);
        }
    });
    ttsToggleEn.addEventListener('change', () => {
        ttsEnabledEn = ttsToggleEn.checked;
        localStorage.setItem(STORAGE_KEY_TTS_EN, String(ttsEnabledEn));
        if (!ttsEnabledEn) window.speechSynthesis.cancel();
    });
    cnRateInput.addEventListener('input', () => {
        cnRate = parseFloat(cnRateInput.value);
        cnRateValue.textContent = cnRate.toFixed(1);
        localStorage.setItem(STORAGE_KEY_RATE_CN, String(cnRate));
    });
    enRateInput.addEventListener('input', () => {
        enRate = parseFloat(enRateInput.value);
        enRateValue.textContent = enRate.toFixed(1);
        localStorage.setItem(STORAGE_KEY_RATE_EN, String(enRate));
    });
    function applyMode(mode) {
        currentMode = mode;
        localStorage.setItem(STORAGE_KEY_MODE, String(mode));
        modeRadios.forEach(r => {
            r.checked = parseInt(r.value, 10) === mode;
        });
        if (entries.length > 0) {
            if (mode === 1) {
                enText.textContent = entries[currentIndex][1];
            } else {
                enText.textContent = maskEnText(entries[currentIndex][1], mode === 2);
            }
        }
    }
    modeRadios.forEach(radio => {
        radio.addEventListener('change', () => {
            if (radio.checked) applyMode(parseInt(radio.value, 10));
        });
    });
    window.speechSynthesis.onvoiceschanged = populateVoices;
    render();
</script>
</body>
</html>
